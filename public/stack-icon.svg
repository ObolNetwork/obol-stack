<svg width="39" height="24" viewBox="0 0 39 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision">
    <title id="title">Tiered emblem</title>
    <desc id="desc">Three offset trapezoids forming a stepped mark.</desc>
  
    <!-- Fallback is solid fill; CSS below upgrades to gradient when supported -->
    <defs>
      <linearGradient id="markGradient" x1="0" y1="0" x2="0" y2="24" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#F2F6F7"/>
        <stop offset="1" stop-color="#D6DEE1"/>
      </linearGradient>
      <filter id="softShadow" x="-10%" y="-20%" width="120%" height="160%" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="0.6" stdDeviation="0.6" flood-opacity="0.18"/>
      </filter>
      <style>
        /* If gradients are supported, this overrides the solid fill */
        #mark > path { fill: url(#markGradient); }
      </style>
    </defs>
  
    <g id="mark" filter="url(#softShadow)" fill="#E1E9EB">
      <path d="M21.6986 24H0L6.5393 17.1635H27.9406L21.6986 24Z"/>
      <path d="M31.805 15.4182H10.1064L16.6457 8.5817H38.0471L31.805 15.4182Z"/>
      <path d="M27.0492 6.83654H5.35059L11.8899 0H33.2912L27.0492 6.83654Z"/>
    </g>
  
    <!-- Subtle highlight along top edges for extra depth -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width=".25" stroke-linecap="round" vector-effect="non-scaling-stroke">
      <path d="M6.5393 17.1635H27.9406"/>
      <path d="M16.6457 8.5817H38.0471"/>
      <path d="M11.8899 0H33.2912"/>
    </g>
  </svg>
  