repositories:
  - name: grafana
    url: https://grafana.github.io/helm-charts

releases:
  - name: grafana
    namespace: monitoring
    chart: grafana/grafana
    version: ~8.9.0
    values:
      - persistence:
          enabled: true
          size: 10Gi
      - adminPassword: admin
      - service:
          type: LoadBalancer
      - datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                url: http://prometheus-server
                isDefault: true