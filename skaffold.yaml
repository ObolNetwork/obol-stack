apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: obol-frontend-dev
build:
  artifacts:
  - image: obol-frontend
    context: .
    docker:
      dockerfile: Dockerfile
  tagPolicy:
    gitCommit: {}
  local:
    push: false
    useDockerCLI: true
    useBuildkit: true
deploy:
  kubectl: {}
manifests:
  rawYaml:
  - k8s/dev-deployment-skaffold.yaml
portForward:
- resourceType: service
  resourceName: obol-frontend-obol-app
  namespace: frontend
  port: 3000
  localPort: 3000