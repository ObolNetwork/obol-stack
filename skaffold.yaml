apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: obol-stack-frontend
build:
  artifacts:
    - image: obol-frontend
      context: .
      docker:
        dockerfile: Dockerfile
  tagPolicy:
    gitCommit: {}
  local:
    push: false
    useDockerCLI: true
    useBuildkit: true
manifests:
  rawYaml:
    - k8s/dev-deployment-skaffold.yaml
deploy:
  kubectl: {}
portForward:
  - resourceType: service
    resourceName: obol-frontend
    namespace: obol-frontend
    port: 3000
    localPort: 3000
