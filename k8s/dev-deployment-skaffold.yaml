apiVersion: apps/v1
kind: Deployment
metadata:
  name: obol-frontend-obol-app
  namespace: frontend
  labels:
    app.kubernetes.io/name: obol-app
    app.kubernetes.io/instance: obol-frontend
    app.kubernetes.io/version: '1.0.0'
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: obol-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: obol-app
      app.kubernetes.io/instance: obol-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obol-app
        app.kubernetes.io/instance: obol-frontend
        app.kubernetes.io/version: '1.0.0'
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: obol-stack
    spec:
      containers:
        - name: obol-app
          image: obol-frontend
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: 'development'
            - name: PORT
              value: '3000'
            - name: HOSTNAME
              value: '0.0.0.0'
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '1Gi'
              cpu: '1'
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: obol-frontend-obol-app
  namespace: frontend
  labels:
    app.kubernetes.io/name: obol-app
    app.kubernetes.io/instance: obol-frontend
    app.kubernetes.io/version: '1.0.0'
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: obol-stack
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: obol-app
    app.kubernetes.io/instance: obol-frontend
