apiVersion: apps/v1
kind: Deployment
metadata:
  name: obol-frontend-obol-app
  namespace: obol-frontend
  labels:
    app.kubernetes.io/name: obol-app
    app.kubernetes.io/instance: obol-frontend
    app.kubernetes.io/version: '1.0.0'
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: obol-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: obol-app
      app.kubernetes.io/instance: obol-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obol-app
        app.kubernetes.io/instance: obol-frontend
        app.kubernetes.io/version: '1.0.0'
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: obol-stack
    spec:
      containers:
        - name: obol-app
          # FIXED: Use the full image reference from the Helm chart values
          image: obolnetwork/obol-stack-front-end:main-b98b361
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            # Development environment variables
            - name: NODE_ENV
              value: 'development'
            - name: PORT
              value: '3000'
            - name: HOSTNAME
              value: '0.0.0.0'
            # Frontend environment variables from Helm chart values
            # Note: These use template variables - adjust based on your network
            - name: NEXT_PUBLIC_HELIOS_CLIENT_URL
              value: 'http://helios-mainnet.helios.svc.cluster.local:8545'
            - name: NEXT_PUBLIC_ERPC_URL
              value: 'http://erpc.default.svc.cluster.local:4000/rpc'
            - name: NEXT_PUBLIC_AZTEC_SEQUENCER_URL
              value: 'http://l2-sequencer-node-mainnet-node.aztec.svc.cluster.local:8080'
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '1Gi'
              cpu: '1'
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: obol-frontend
  namespace: obol-frontend
  labels:
    app.kubernetes.io/name: obol-app
    app.kubernetes.io/instance: obol-frontend
    app.kubernetes.io/version: '1.0.0'
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: obol-stack
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: obol-app
    app.kubernetes.io/instance: obol-frontend
