version: '3.8'

services:
  obol-stack-dashboard:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - obol-network

  # Optional: Nginx reverse proxy (uncomment if needed)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - obol-stack-dashboard
  #   networks:
  #     - obol-network

  # Example monitoring service (replace with your actual monitoring setup)
  # monitoring:
  #   image: your-monitoring-image
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - obol-network

networks:
  obol-network:
    driver: bridge