name: Build, Push and Deploy

on:
  push:
    branches:
      - main
      - 'integration/**'
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-push-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME: obolnetwork/obol-stack-front-end

jobs:
  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      created: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.4
        with:
          # Need full history to generate version
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(git describe --tags --always --dirty)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Compute integration branch version
        id: integration
        if: startsWith(github.ref, 'refs/heads/integration/')
        run: |
          INTEGRATION_VERSION="${GITHUB_REF_NAME#integration/}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "version=$INTEGRATION_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Integration version: $INTEGRATION_VERSION"
          echo "Short SHA: $SHORT_SHA"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME }}
          tags: |
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # set next tag for default branch
            type=raw,value=next,enable={{is_default_branch}}
            # branch event (skipped for integration/* — see -dev-<sha> rule below)
            type=ref,event=branch,enable=${{ !startsWith(github.ref, 'refs/heads/integration/') }}
            # tag event
            type=ref,event=tag
            # short sha
            type=sha
            # Additionally, add 'latest' tag for release tags (v*)
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
            # integration/<version> branches publish a <version>-dev-<sha> image per commit.
            # SHA suffix keeps every push unique, which is required because Docker Hub on
            # this repo enforces tag immutability (a stable :<version>-dev tag would fail
            # on the second push to the same integration branch).
            # e.g. integration/0.1.17-rc.4 @ abc1234 -> obolnetwork/obol-stack-front-end:0.1.17-rc.4-dev-abc1234
            type=raw,value=${{ steps.integration.outputs.version }}-dev-${{ steps.integration.outputs.short_sha }},enable=${{ startsWith(github.ref, 'refs/heads/integration/') }}
          labels: |
            org.opencontainers.image.title=Obol Stack Front End
            org.opencontainers.image.description=Monitoring dashboard for Obol Stack and Ethereum node status
            org.opencontainers.image.vendor=Obol Network
            org.opencontainers.image.url=https://github.com/ObolNetwork/obol-stack-front-end
            org.opencontainers.image.documentation=https://docs.obol.org
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

  build-amd64:
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Prepare amd64 tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${{ needs.meta.outputs.tags }}" | sed 's/$/-amd64/'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push amd64 image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ needs.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            BUILDTIME=${{ needs.meta.outputs.created }}
            GITCOMMIT=${{ github.sha }}
            NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ secrets.WALLET_CONNECT_PROJECT_ID || '' }}

  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: meta
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Prepare arm64 tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${{ needs.meta.outputs.tags }}" | sed 's/$/-arm64/'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push arm64 image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ needs.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            BUILDTIME=${{ needs.meta.outputs.created }}
            GITCOMMIT=${{ github.sha }}
            NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ secrets.WALLET_CONNECT_PROJECT_ID || '' }}

  manifest:
    runs-on: ubuntu-latest
    needs: [meta, build-amd64, build-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Create manifests (multi-arch)
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker buildx imagetools create -t "$tag" "${tag}-amd64" "${tag}-arm64"
            fi
          done <<<"$TAGS"
