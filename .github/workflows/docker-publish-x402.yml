name: Build and Publish x402 Images

on:
  push:
    # main only — release images are built from main (or via the manual
    # release-prep.yml dispatch); feature/integration branches never publish.
    branches:
      - main
    # Tag pushes MUST keep building: path filters below do not apply to tags,
    # and internal/images.Resolve commit-pins demo-server (and the release
    # binary's own components) to the tag commit's short SHA — the tag build
    # is what guarantees those SHA tags exist even when the same commit's
    # main-push build was skipped by the paths filter (e.g. a docs-only merge).
    tags:
      - 'v*'
    # Approximates the import graph of the built binaries (verifier,
    # controller, buyer pull in far more than internal/x402 — agent
    # rendering, embed, erc8004, tunnel, ...). The release-gate script
    # .github/scripts/verify-x402-pins.sh computes the EXACT graph via
    # `go list -deps` at tag time, so anything this list misses fails the
    # release instead of shipping stale; keep the list generous.
    paths:
      - 'internal/agentruntime/**'
      - 'internal/config/**'
      - 'internal/defaults/**'
      - 'internal/dns/**'
      - 'internal/embed/**'
      - 'internal/enclave/**'
      - 'internal/erc8004/**'
      - 'internal/helmcmd/**'
      - 'internal/images/**'
      - 'internal/inference/**'
      - 'internal/kubectl/**'
      - 'internal/model/**'
      - 'internal/monetizeapi/**'
      - 'internal/openclaw/**'
      - 'internal/schemas/**'
      - 'internal/serviceoffercontroller/**'
      - 'internal/tee/**'
      - 'internal/tunnel/**'
      - 'internal/ui/**'
      - 'internal/version/**'
      - 'internal/walletbackup/**'
      - 'internal/x402/**'
      - 'internal/demo/**'
      - 'internal/jobbroker/**'
      - 'cmd/x402-verifier/**'
      - 'cmd/x402-buyer/**'
      - 'cmd/serviceoffer-controller/**'
      - 'cmd/demo-server/**'
      - 'cmd/job-broker/**'
      - 'Dockerfile.x402-verifier'
      - 'Dockerfile.x402-buyer'
      - 'Dockerfile.serviceoffer-controller'
      - 'Dockerfile.demo-server'
      - 'Dockerfile.job-broker'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker-publish-x402.yml'
      - '.github/scripts/repin-x402-images.sh'
  workflow_dispatch:

concurrency:
  group: x402-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Build each x402 component and publish its image.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: x402-verifier
            image: obolnetwork/x402-verifier
            dockerfile: Dockerfile.x402-verifier
            description: x402 payment verification sidecar for Obol Stack
          - component: x402-buyer
            image: obolnetwork/x402-buyer
            dockerfile: Dockerfile.x402-buyer
            description: x402 buy-side payment sidecar for Obol Stack
          - component: serviceoffer-controller
            image: obolnetwork/serviceoffer-controller
            dockerfile: Dockerfile.serviceoffer-controller
            description: ServiceOffer reconciler for Obol Stack monetization
          - component: demo-server
            image: obolnetwork/demo-server
            dockerfile: Dockerfile.demo-server
            description: Demo HTTP services for Obol Stack sell demo
          - component: job-broker
            image: obolnetwork/job-broker
            dockerfile: Dockerfile.job-broker
            description: Async job delivery broker for x402-paid ServiceOffers

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # format=long + empty prefix emits the full 40-char commit SHA so the
            # security-scan job's `image-ref: ...:${{ github.sha }}` reference resolves.
            # Previously `type=sha,prefix=` produced the 7-char short SHA,
            # causing Trivy to fail with MANIFEST_UNKNOWN on every run.
            type=sha,format=long,prefix=
            # Also publish the 7-char short SHA as a separate tag. The obol
            # binary embeds version.GitCommit (short SHA) via ldflags and uses
            # it through internal/images.Resolve to commit-pin the deployments
            # it manages. Without this, binary upgrades wouldn't roll the pods.
            type=sha,format=short,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.component }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=Obol
            org.opencontainers.image.source=https://github.com/ObolNetwork/obol-stack

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
          provenance: true
          sbom: true

  # ---------------------------------------------------------------------------
  # Security scan each published image using the exact SHA tag from the build.
  # ---------------------------------------------------------------------------
  security-scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: x402-verifier
            image: obolnetwork/x402-verifier
          - component: x402-buyer
            image: obolnetwork/x402-buyer
          - component: serviceoffer-controller
            image: obolnetwork/serviceoffer-controller
          - component: demo-server
            image: obolnetwork/demo-server
          - component: job-broker
            image: obolnetwork/job-broker

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()
