name: Build and Publish x402 Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'internal/x402/**'
      - 'internal/serviceoffercontroller/**'
      - 'internal/monetizeapi/**'
      - 'cmd/x402-verifier/**'
      - 'cmd/x402-buyer/**'
      - 'cmd/serviceoffer-controller/**'
      - 'Dockerfile.x402-verifier'
      - 'Dockerfile.x402-buyer'
      - 'Dockerfile.serviceoffer-controller'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker-publish-x402.yml'
  workflow_dispatch:

concurrency:
  group: x402-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Build each x402 component and publish its image.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: x402-verifier
            image: obolnetwork/x402-verifier
            dockerfile: Dockerfile.x402-verifier
            description: x402 payment verification sidecar for Obol Stack
          - component: x402-buyer
            image: obolnetwork/x402-buyer
            dockerfile: Dockerfile.x402-buyer
            description: x402 buy-side payment sidecar for Obol Stack
          - component: serviceoffer-controller
            image: obolnetwork/serviceoffer-controller
            dockerfile: Dockerfile.serviceoffer-controller
            description: ServiceOffer reconciler for Obol Stack monetization

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/secure-enclave-inference' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.component }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=Obol
            org.opencontainers.image.source=https://github.com/ObolNetwork/obol-stack

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
          provenance: true
          sbom: true

  # ---------------------------------------------------------------------------
  # Security scan each published image using the exact SHA tag from the build.
  # ---------------------------------------------------------------------------
  security-scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: x402-verifier
            image: obolnetwork/x402-verifier
          - component: x402-buyer
            image: obolnetwork/x402-buyer
          - component: serviceoffer-controller
            image: obolnetwork/serviceoffer-controller

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b13d724d35ff0a814e21683638ed68ed34cf53d1 # main
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()
