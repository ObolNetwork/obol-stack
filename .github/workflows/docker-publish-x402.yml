name: Build and Publish x402 Images

# Publishes stack-owned pure-Go images via docker bake (Dockerfile.x402):
# one shared builder stage, native cross-compile (no QEMU), shared GHA cache.
# Tags: short SHA (images.Resolve), long SHA (Trivy), latest on main.
# Release gate: .github/scripts/verify-release-images.sh

on:
  # Every main commit gets images at :<short-sha> (built, or retagged from an
  # ancestor when no image input changed). Not on v* tags: the tag commit's
  # images already exist, and rebuilding would overwrite published short-SHA
  # tags with new digests (builds are not byte-reproducible).
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Rebuild even if images can be reused (overwrites existing short-SHA tags)'
        type: boolean
        default: false

concurrency:
  group: x402-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      source: ${{ steps.plan.outputs.source }}
      short_sha: ${{ steps.sha.outputs.short }}
      long_sha: ${{ steps.sha.outputs.long }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 50

      - name: Resolve SHAs
        id: sha
        run: |
          {
            echo "long=$(git rev-parse HEAD)"
            echo "short=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build, retag or skip
        id: plan
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
        run: .github/scripts/image-plan.sh

  retag:
    needs: plan
    if: needs.plan.outputs.mode == 'retag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy manifests to this commit's tags
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=("${{ needs.plan.outputs.short_sha }}" "${{ needs.plan.outputs.long_sha }}")
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then tags+=(latest); fi
          .github/scripts/image-retag.sh "${{ needs.plan.outputs.source }}" "${tags[@]}"

  # ---------------------------------------------------------------------------
  # One bake job builds all five images for amd64+arm64. Pure-Go cross-compile
  # from BUILDPLATFORM means we do NOT need QEMU (the old multi-arch tax).
  # ---------------------------------------------------------------------------
  build:
    needs: plan
    if: needs.plan.outputs.mode == 'build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
      long_sha: ${{ steps.sha.outputs.long }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve SHAs
        id: sha
        run: |
          {
            echo "long=$(git rev-parse HEAD)"
            echo "short=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # No QEMU: Dockerfile.x402 uses FROM --platform=$BUILDPLATFORM and
      # GOARCH=$TARGETARCH. Emulation was the dominant cost (~15–25m/job).

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake and push all x402 images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          files: docker-bake.hcl
          push: true
          provenance: true
          sbom: true
          vars: |
            REGISTRY=ghcr.io/obolnetwork
            SHA_SHORT=${{ steps.sha.outputs.short }}
            SHA_LONG=${{ steps.sha.outputs.long }}
            PUSH_LATEST=${{ github.ref == 'refs/heads/main' }}

  # ---------------------------------------------------------------------------
  # Trivy still fans out; scans are cheap vs the old multi-arch QEMU builds.
  # ---------------------------------------------------------------------------
  security-scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - obolnetwork/x402-verifier
          - obolnetwork/x402-buyer
          - obolnetwork/serviceoffer-controller
          - obolnetwork/demo-server
          - obolnetwork/job-broker
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ needs.build.outputs.long_sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()
