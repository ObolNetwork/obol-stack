name: Renovate

# Self-hosted (not the Renovate app): postUpgradeTasks need
# RENOVATE_ALLOWED_COMMANDS below. Every packageRule in renovate.json is
# scheduled "before 6am on monday" (UTC), so hourly runs only matter in that
# window; the 4-hourly run covers unscheduled updates (github-actions,
# security alerts), rebases and Dependency Dashboard approvals. Need it now?
# Run the workflow manually.
on:
  schedule:
    - cron: "0 0-5 * * 1"   # Monday 00:00–05:00 UTC, hourly: the update window
    - cron: "30 */4 * * *"  # every 4h: dashboard approvals, rebases, unscheduled updates
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (no PRs opened)"
        required: false
        default: "false"

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          LOG_LEVEL: debug
          RENOVATE_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'full' || '' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BASE_BRANCHES: ${{ github.ref_name }}
          # Allow-list for postUpgradeTasks (renovate.json). Only the Scalar
          # SRI refresh is permitted: the @scalar/api-reference bump must
          # rewrite the SRI hash in the same commit or the /api docs page
          # ships a browser-blocked script tag.
          RENOVATE_ALLOWED_COMMANDS: '["bash scripts/update-scalar-sri.sh", "bash scripts/update-gateway-api-crds.sh"]'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
