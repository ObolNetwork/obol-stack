name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.1.0
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@10.30.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Build application
        run: pnpm run build
        env:
          NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: ${{ secrets.WALLET_CONNECT_PROJECT_ID || 'test-project-id' }}

  # Smoke-test the production image on main only — PRs already run `pnpm build`
  # above; a second full Docker build per push was the main CI cost driver.
  docker-build-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Build Docker image (test)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          tags: obol-stack-front-end:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          build-args: |
            NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ secrets.WALLET_CONNECT_PROJECT_ID || 'test-project-id' }}

      - name: Verify Docker image exists
        run: |
          docker images | grep obol-stack-front-end || (echo "Docker image not found!" && exit 1)

      - name: Test Docker image
        run: |
          docker run --rm -d --name test-container -p 3000:3000 obol-stack-front-end:test
          for i in {1..30}; do
            if curl -sf http://localhost:3000 >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000 || (docker logs test-container && exit 1)
          docker stop test-container
