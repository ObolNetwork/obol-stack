name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.4

      - name: Setup Node.js
        uses: actions/setup-node@dda4788290998366da86b6a4f497909644397bb2 # v4.1.0
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Build application
        run: pnpm run build
        env:
          NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: ${{ secrets.WALLET_CONNECT_PROJECT_ID || 'test-project-id' }}

  docker-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Build Docker image (test)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: false
          tags: obol-stack-front-end:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true # Ensure image is loaded into local Docker daemon
          build-args: |
            NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=${{ secrets.WALLET_CONNECT_PROJECT_ID || 'test-project-id' }}

      - name: Verify Docker image exists
        run: |
          echo "Checking if Docker image was built successfully..."
          docker images | grep obol-stack-front-end || (echo "Docker image not found!" && exit 1)

      - name: Test Docker image
        run: |
          echo "Starting Docker container..."
          docker run --rm -d --name test-container -p 3000:3000 obol-stack-front-end:test

          echo "Waiting for container to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:3000 >/dev/null 2>&1; then
              echo "Container is responding!"
              break
            fi
            echo "Attempt $i: Container not ready yet, waiting..."
            sleep 2
          done

          echo "Final health check..."
          curl -f http://localhost:3000 || (echo "Health check failed!" && docker logs test-container && exit 1)

          echo "Stopping container..."
          docker stop test-container
