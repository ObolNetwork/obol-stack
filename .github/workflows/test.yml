name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.4

      - name: Setup Node.js
        uses: actions/setup-node@65beceff8e91358525397bdce9103d999507ab03 # v4.1.0
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

  docker-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.2.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Build Docker image (test)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          tags: obol-stack-front-end:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true  # Ensure image is loaded into local Docker daemon

      - name: Verify Docker image exists
        run: |
          echo "Checking if Docker image was built successfully..."
          docker images | grep obol-stack-front-end || (echo "Docker image not found!" && exit 1)
          
      - name: Test Docker image
        run: |
          echo "Starting Docker container..."
          docker run --rm -d --name test-container -p 3000:3000 obol-stack-front-end:test
          
          echo "Waiting for container to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:3000 >/dev/null 2>&1; then
              echo "Container is responding!"
              break
            fi
            echo "Attempt $i: Container not ready yet, waiting..."
            sleep 2
          done
          
          echo "Final health check..."
          curl -f http://localhost:3000 || (echo "Health check failed!" && docker logs test-container && exit 1)
          
          echo "Stopping container..."
          docker stop test-container