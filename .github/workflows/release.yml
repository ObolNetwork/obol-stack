# Release Workflow
#
# Builds and publishes obol CLI releases via goreleaser (.goreleaser.yaml).
#
# Artifacts per release:
#   - Raw binaries: obol_linux_amd64, obol_linux_arm64, obol_darwin_amd64,
#     obol_darwin_arm64 (exact names obolup.sh's download_release expects)
#   - SHA256SUMS in sha256sum format (obolup.sh verifies binaries against it)
#   - deb + rpm packages (linux amd64/arm64)
#   - Homebrew formula pushed to ObolNetwork/homebrew-tap (stable tags only,
#     and only when the HOMEBREW_TAP_GITHUB_TOKEN secret is configured — a
#     fine-grained token with contents:write on the tap repo)
#
# How to use:
#
#   0. Confirm stack-owned images for the tag commit's short SHA are on GHCR
#      (built by docker-publish-x402 on the main merge, or workflow_dispatch).
#      Tag on main after that commit is green — no repin PR.
#
#   1. Create and push a release tag ON MAIN:
#      $ git tag v0.1.0
#      $ git push origin v0.1.0
#
#   2. The workflow builds everything and creates a DRAFT release with
#      GitHub-generated notes. Before publishing the draft:
#      - Rewrite the generated body using .github/release-template.md
#      - Keep the generated "What's Changed", "New Contributors", and
#        "Full Changelog" sections at the bottom
#      - Do not include private keys, seed phrases, passwords, hostnames,
#        personal paths, or raw bearer tokens
#
#   3. Binaries are available at:
#      https://github.com/ObolNetwork/obol-stack/releases/download/v0.1.0/obol_linux_amd64
#
#   4. Manual trigger (optional):
#      - Go to Actions tab → Release workflow → Run workflow
#      - Enter an EXISTING tag name (e.g., v0.1.0); the workflow checks out
#        that tag and releases it

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Gate: the released CLI embeds version.GitCommit (short SHA) and Resolve
  # pins deployments to ghcr.io/obolnetwork/<component>:<short-sha>. Those
  # tags must already exist on GHCR (published by docker-publish-x402 for
  # the same commit on main, or via workflow_dispatch).
  verify-release-images:
    name: Verify release images exist on GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Verify GHCR has images for this commit
        run: .github/scripts/verify-release-images.sh

  release:
    name: Build and release (goreleaser)
    needs: [verify-release-images]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      - name: Decide goreleaser args
        id: args
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          ARGS="release --clean"
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_GITHUB_TOKEN not configured — skipping Homebrew tap publish"
            ARGS="$ARGS --skip=homebrew"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ steps.args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
