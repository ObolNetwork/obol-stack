name: CI

# The one PR/branch CI workflow. Every job is gated on what the change touches
# (see the `changes` job); the final `lint-test` job aggregates them and is the
# ONLY required status check in branch protection — it passes when every
# relevant job passed and every irrelevant one was skipped.
#
# Image publishing lives in docker-publish-*.yml (main + dispatch), releases in
# release.yml (tags), secret scanning in gitleaks.yml.

on:
  pull_request:
    branches: [main, 'integration/**']
  # Integration branches collect several PRs before they reach main; test the
  # branch itself too. main pushes are not re-tested here: they were tested as
  # the PR that produced them.
  push:
    branches: ['integration/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      charts: ${{ steps.filter.outputs.charts }}
      storefront: ${{ steps.filter.outputs.storefront }}
      frontend: ${{ steps.filter.outputs.frontend }}
      obolup: ${{ steps.filter.outputs.obolup }}
      crds: ${{ steps.filter.outputs.crds }}
      lint_base: ${{ steps.filter.outputs.lint_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none # trees only; enough for `git diff --name-only`

      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all() {
            for k in go charts storefront frontend obolup crds; do echo "$k=true"; done >> "$GITHUB_OUTPUT"
            echo "lint_base=${1:-}" >> "$GITHUB_OUTPUT"
            echo "running every job: $2"
            exit 0
          }

          case "$EVENT" in
            pull_request)
              # HEAD is the PR merge commit; its first parent is the base tip.
              base="$(git rev-parse HEAD^1)"
              ;;
            push)
              if [[ -z "$PUSH_BEFORE" || "$PUSH_BEFORE" =~ ^0+$ ]] \
                || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                # New branch (or force-push to an unknown commit): diff against main.
                base="$(git merge-base origin/main HEAD)"
              else
                base="$PUSH_BEFORE"
              fi
              ;;
            *) all "$(git merge-base origin/main HEAD)" "event ${EVENT}" ;;
          esac
          lint_base="$base"

          files="$(git diff --name-only "$base" HEAD)"
          printf 'changed files (%s):\n%s\n' "$(printf '%s' "$files" | grep -c . || true)" "$files"

          # Editing this workflow re-validates everything it runs.
          if grep -qx '.github/workflows/ci.yml' <<<"$files"; then
            all "$lint_base" "ci.yml changed"
          fi

          has() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          {
            # Go: anything except web apps, docs/plans, root-level markdown,
            # agent tooling and other workflows. Deliberately broad: go tests
            # read embedded charts/skills (internal/embed) and obolup.sh pins.
            echo "go=$(grep -qvE '^(web/|docs/|plans/|\.agents/|\.claude/|\.github/|[^/]+\.md$)' <<<"$files" && echo true || echo false)"
            echo "charts=$(has '^internal/embed/(infrastructure|networks)/')"
            echo "storefront=$(has '^(web/public-storefront/|Dockerfile\.public-storefront$)')"
            echo "frontend=$(has '^web/frontend/')"
            echo "obolup=$(has '^obolup\.sh$')"
            # CRD sources (Go types), the embedded manifests, and the
            # apiserver version / k3d pin the crd-apply job reads.
            echo "crds=$(has '^internal/(monetizeapi/|embed/(infrastructure|networks)/|embed/k3d-config\.yaml$|tools/manifest\.yaml$)')"
            echo "lint_base=$lint_base"
          } | tee -a "$GITHUB_OUTPUT"

  go:
    name: Go build, vet, test, generate, goreleaser
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # First, on a pristine tree, so the porcelain check sees only its output.
      - name: Regenerate CRDs + DeepCopy
        run: just generate

      - name: Fail if CRD generation is out of date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::CRD manifests or DeepCopy methods are out of date."
            echo "::error::Run 'just generate' locally and commit the result."
            git status
            git --no-pager diff
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Check .goreleaser.yaml
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  golangci-lint:
    name: golangci-lint (new code)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # --new-from-rev needs the base commit

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # Only issues introduced since the PR base (or the previous push) fail
      # the job; the existing backlog does not.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --new-from-rev=${{ needs.changes.outputs.lint_base }} --timeout=10m

  charts:
    name: Embedded charts (helm template + lint)
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.3.0   # match obolup.sh pinned version

      - name: Stage base chart with CI placeholder values
        run: |
          # The base chart contains `{{PLACEHOLDER}}` strings (e.g.
          # `{{OLLAMA_HOST_IP}}`, `{{CLUSTER_ID}}`) that are substituted
          # by `internal/defaults/defaults.go::InfrastructureReplacements`
          # before helmfile runs. Helm's Go-template parser would treat
          # them as actions and fail, so we substitute stub values into
          # a working copy first — mirroring what `obol stack init` does.
          set -euo pipefail
          cp -R internal/embed/infrastructure/base "$RUNNER_TEMP/base"
          find "$RUNNER_TEMP/base" -type f -name '*.yaml' -print0 \
            | xargs -0 sed -i \
              -e 's/{{OLLAMA_HOST_IP}}/127.0.0.1/g' \
              -e 's/{{OLLAMA_HOST}}/localhost/g' \
              -e 's/{{CLUSTER_ID}}/ci-helm-smoke/g'

      - name: helm template ./base (+ duplicate object check)
        run: |
          # Fails on Go-template parse errors (e.g. the unescaped
          # `{{ $labels }}` in PrometheusRule annotations, PR #527) —
          # `go test ./...` does not exercise Helm rendering.
          set -euo pipefail
          # Match values passed by helmfile.yaml `releases[base]`.
          helm template base "$RUNNER_TEMP/base" \
            --set dataDir=/data \
            --set network=mainnet \
            > "$RUNNER_TEMP/base-rendered.yaml"

          # Kubernetes object identity must be unique within one rendered
          # chart. Helm will happily render duplicate apiVersion/kind/name
          # tuples and leave the actual outcome to manifest ordering; this
          # caught the duplicated obol-frontend ClusterRole/Binding review bug.
          awk '
          function flush() {
            if (api && kind && name) {
              key = api "/" kind "/" ns "/" name
              count[key]++
            }
            api = kind = name = ns = ""; inmeta = 0
          }
          /^---/ { flush(); next }
          /^apiVersion:/ { api = $2; next }
          /^kind:/ { kind = $2; next }
          /^metadata:/ { inmeta = 1; next }
          inmeta && /^  name:/ { name = $2; next }
          inmeta && /^  namespace:/ { ns = $2; next }
          /^[^ ]/ && $0 !~ /^(apiVersion|kind|metadata):/ { inmeta = 0 }
          END {
            flush()
            for (k in count) {
              if (count[k] > 1) {
                print count[k] " " k
                dup = 1
              }
            }
            exit dup
          }' "$RUNNER_TEMP/base-rendered.yaml"

      - name: helm template ./cloudflared
        run: helm template cloudflared internal/embed/infrastructure/cloudflared > /dev/null

      # Replaces chart-testing `ct lint`: ct looked for charts under ./charts
      # (absent in this repo), so it never linted anything.
      - name: helm lint embedded charts
        run: |
          set -euo pipefail
          helm lint "$RUNNER_TEMP/base" --set dataDir=/data --set network=mainnet
          helm lint internal/embed/infrastructure/cloudflared
          helm lint internal/embed/networks/ethereum
          helm lint internal/embed/networks/aztec

  # Offline checks cannot see the apiserver's CEL cost budget: a CRD whose
  # rule cost exceeds it renders, lints and unit-tests clean, then fails to
  # apply on a live cluster. Apply every embedded CRD to a real k3s apiserver,
  # same image as `obol stack up` (internal/embed/k3d-config.yaml).
  crd-apply:
    name: Embedded CRDs apply to a real kube-apiserver
    needs: changes
    if: needs.changes.outputs.crds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned k3d
        run: |
          set -euo pipefail
          # Version + checksum from the obol tool manifest (same pin as obolup.sh).
          version="$(yq '.tools[] | select(.name == "k3d") | .version' internal/tools/manifest.yaml)"
          sha="$(yq '.tools[] | select(.name == "k3d") | .assets["linux/amd64"].sha256' internal/tools/manifest.yaml)"
          curl -fsSL -o "$RUNNER_TEMP/k3d" "https://github.com/k3d-io/k3d/releases/download/v${version}/k3d-linux-amd64"
          echo "${sha}  $RUNNER_TEMP/k3d" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/k3d" /usr/local/bin/k3d
          k3d version

      - name: Create k3s cluster
        run: |
          set -euo pipefail
          # k3d-config.yaml carries {{...}} placeholders, so read the image
          # line directly rather than parsing it as YAML.
          image="$(sed -n 's/^image:[[:space:]]*//p' internal/embed/k3d-config.yaml)"
          if [ -z "$image" ]; then
            echo "::error::no image: line in internal/embed/k3d-config.yaml"
            exit 1
          fi
          echo "k3s image: $image"
          k3d cluster create crd-apply \
            --image "$image" \
            --no-lb \
            --k3s-arg '--disable=traefik@server:*' \
            --k3s-arg '--disable=metrics-server@server:*' \
            --wait --timeout 300s
          kubectl version

      - name: Apply embedded CRDs (server-side dry-run, then for real)
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -rlE --include='*.yaml' --include='*.yml' \
            '^kind:[[:space:]]*CustomResourceDefinition' internal/embed | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no CustomResourceDefinition manifests found under internal/embed"
            exit 1
          fi
          failed=0
          for f in "${files[@]}"; do
            if grep -q '{{' "$f"; then
              echo "::error file=$f::templated CRD manifest; render it before applying (extend this job)"
              failed=1
              continue
            fi
            echo "--- $f"
            # The dry-run runs full CRD validation (incl. CEL cost estimation)
            # and reports every problem; the real apply then lets us wait for
            # the CRD to become Established.
            if ! kubectl apply --server-side --dry-run=server -f "$f"; then
              echo "::error file=$f::kube-apiserver rejected this CRD"
              failed=1
              continue
            fi
            kubectl apply --server-side -f "$f"
          done
          [ "$failed" -eq 0 ] || exit 1
          kubectl wait --for condition=Established --timeout=60s crd --all
          kubectl get crd

  storefront:
    name: Public storefront (lint, typecheck, build)
    needs: changes
    if: needs.changes.outputs.storefront == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/public-storefront
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4' # Dockerfile.public-storefront base image
          cache: npm
          cache-dependency-path: web/public-storefront/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

  frontend:
    name: Front-end (lint, test, typecheck, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # Run pnpm inside web/frontend: from the repo root (no package.json)
    # corepack would not see the pinned packageManager version.
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/frontend/.nvmrc

      - name: Enable pnpm (corepack, version from packageManager)
        run: |
          corepack enable
          corepack install
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build
        env:
          # Placeholder only; PR builds never see real secrets.
          NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: test-project-id

  shellcheck:
    name: shellcheck obolup.sh
    needs: changes
    if: needs.changes.outputs.obolup == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Errors only for now: obolup.sh carries a backlog of SC2155/SC2034/
      # SC2064 warnings. Tighten to `-S warning` once those are fixed.
      - name: shellcheck
        env:
          LANG: C.UTF-8
        run: shellcheck -S error obolup.sh

  # Required status check (branch protection: "lint-test"). Always runs and
  # fails only if a needed job failed or was cancelled; skipped jobs (areas
  # the change did not touch) count as passing.
  lint-test:
    name: lint-test
    if: always()
    needs: [changes, go, golangci-lint, charts, crd-apply, storefront, frontend, shellcheck]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
