kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
    - containerPort: 80
      hostPort: 8080
      protocol: TCP
    - containerPort: 443
      hostPort: 4433
      protocol: TCP
  extraMounts:
    - hostPath: ./.data
      containerPath: /data
    # - hostPath: ./.data/lighthouse
    #   containerPath: /data/lighthouse
