# Example values file for deploying Helios on Holesky Testnet
# Replace the execution RPC placeholder with your actual endpoint

# Helios specific configuration
helios:
  # Network to sync to
  network: "holesky"
  
  # REQUIRED: Add your execution RPC endpoint (must support eth_getProof)
  # Example using AllthatNode (replace with your provider)
  executionRpc: "https://ethereum-holesky.g.allthatnode.com"
  
  # Use Nimbus public consensus client for Holesky
  consensusRpc: "http://testing.holesky.beacon-api.nimbus.team"
  
  # Example checkpoint from Holesky
  # Get the latest checkpoint using: ./scripts/get-latest-checkpoint.sh holesky
  checkpoint: "0x60409a013161b33c8c68c6183c7753e779ec6c24be2f3c50c6036c30e13b34a6"
  
  # Bind to 0.0.0.0 to allow connections from outside the pod
  rpcBindIp: "0.0.0.0"
  
  # Data directory for cached checkpoints
  dataDir: "/data"

# Configure service to be accessible
service:
  type: ClusterIP
  port: 8545

# Resource allocation - lower for testnet
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Enable persistent storage for checkpoint data
persistence:
  enabled: true
  size: 500Mi
