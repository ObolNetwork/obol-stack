# Nginx reverse proxy configuration for Obol Stack Front End
# This file is OPTIONAL - the Docker container serves the app directly on port 3000
# Use this configuration when you need SSL termination, caching, or other proxy features

server {
    listen 80;
    server_name obol.stack;
    
    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    
    # Proxy to Next.js standalone server
    location / {
        # Change to your container IP/hostname if needed
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
    
    # Static assets caching
    location /_next/static {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check (optional - proxies to app)
    location /health {
        proxy_pass http://localhost:3000;
        access_log off;
    }
    
    # Alternative: nginx-only health check
    # location /nginx-health {
    #     access_log off;
    #     return 200 "nginx healthy\n";
    #     add_header Content-Type text/plain;
    # }
}

# Optional: Redirect www to non-www
server {
    listen 80;
    server_name www.obol.stack;
    return 301 http://obol.stack$request_uri;
}