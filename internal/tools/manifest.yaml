        member: linux-arm64/helm
        sha256: 31c5794dd55c66a51e6b7d2e2ac7a114ae8b1de41ff1d9ba51748ac973b06a08
      darwin/amd64:
        url: https://get.helm.sh/helm-v{version}-darwin-amd64.tar.gz
        member: darwin-amd64/helm
        sha256: 347a784877e0e20eac865e8d1c36a80f6bb0861d6f29abd34defb6570ef95d92
      darwin/arm64:
