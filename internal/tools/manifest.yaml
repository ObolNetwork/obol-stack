# Host tools managed by the obol CLI.
#
# `obol upgrade` / `obol stack up` download these into the obol bin dir
# (OBOL_BIN_DIR, default ~/.local/bin), verify the sha256 below (fail closed)
# and install atomically. `obol update` reports drift against these pins.
#
# Every `version` MUST equal the matching pin in obolup.sh (`obolupVar`);
# TestManifestMatchesObolup enforces it. When bumping a version, update ALL
# four platform sha256 values from the upstream release checksum files:
#   kubectl  https://dl.k8s.io/release/v<V>/bin/<os>/<arch>/kubectl.sha256
#   helm     https://get.helm.sh/helm-v<V>-<os>-<arch>.tar.gz.sha256sum
#   k3d      https://github.com/k3d-io/k3d/releases/download/v<V>/checksums.txt
#   helmfile https://github.com/helmfile/helmfile/releases/download/v<V>/helmfile_<V>_checksums.txt
#   k9s      https://github.com/derailed/k9s/releases/download/v<V>/checksums.sha256
#   helm-diff https://github.com/databus23/helm-diff/releases/download/v<V>/helm-diff_<V>_checksums.txt
#
# Fields:
#   compat   how a binary found on $PATH is judged usable instead of a managed copy:
#              skew1 = same major, minor within ±1 of the pin (kubectl version-skew policy)
#              minor = same major, minor >= pin's minor
#              any   = any version
#   required installed automatically by `obol stack init/up` when missing.
#   format   raw | tar.gz | zip
#   member   path inside the archive ({version} expands); for helm plugins a
#            directory prefix that becomes the plugin directory.
#   url      {version} expands to the pinned version.
tools:
  - name: kubectl
    version: "1.36.5"
    obolupVar: KUBECTL_VERSION
    required: true
    compat: skew1
    versionArgs: ["version", "--client", "--output=json"]
    versionRegex: '"gitVersion":\s*"v?([0-9]+\.[0-9]+\.[0-9]+)'
    format: raw
    assets:
      linux/amd64:
        url: https://dl.k8s.io/release/v{version}/bin/linux/amd64/kubectl
        sha256: 33bc88a24c3b09cf55bfd59e6ca977881b61fc3f25ab65bc80c65b430248648e
      linux/arm64:
        url: https://dl.k8s.io/release/v{version}/bin/linux/arm64/kubectl
        sha256: 88fc1aca8fd0c1b44fe379f67c39bd6858bdfc50241dc55775f84d0f5b31da3a
      darwin/amd64:
        url: https://dl.k8s.io/release/v{version}/bin/darwin/amd64/kubectl
        sha256: 03338828c3ba74c37bf5964573fbfbab132eb5bb15da2f821c25a4043d6eb3f0
      darwin/arm64:
        url: https://dl.k8s.io/release/v{version}/bin/darwin/arm64/kubectl
        sha256: c5850a4a6b9469b26cce47c1ab456285f58e308283dcdf72b4ddda3db49b0ec0

