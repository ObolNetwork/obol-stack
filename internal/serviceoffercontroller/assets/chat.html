<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — chat</title>
<style>
  /* Tokens come from the storefront theme system: ThemeCSS is the offer's
     resolved default-or-branded palette, identical to its landing page.
     Everything below styles through the tokens only. */
  :root { {{.ThemeCSS}} --mono:"JetBrains Mono",ui-monospace,monospace; }
  * { box-sizing: border-box; margin: 0; }

  /* shell */
  body { height: 100dvh; display: flex; flex-direction: column;
         background: var(--bg01); color: var(--body); font: 14px/1.5 "DM Sans", system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
           padding: 10px 16px; border-bottom: 1px solid var(--stroke); }
  header h1 { font-size: 13px; font-weight: 600; letter-spacing: .14em; color: var(--light); text-transform: uppercase; }
  header .tag { font-size: 12px; color: var(--muted); }
  /* Framed on the landing page, the header duplicates the page around it
     (title, price) — hide it; the price still shows in the composer. */
  .embed header { display: none; }

  /* transcript */
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; }
  .msg { max-width: 46rem; white-space: pre-wrap; overflow-wrap: break-word; color: var(--light); }
  .msg.user { align-self: flex-end; padding: 8px 12px;
              background: var(--bg02); border: 1px solid var(--stroke); border-radius: 10px 10px 2px 10px; }
  .msg.agent { align-self: flex-start; }
  .msg.agent::before { content: var(--agent-name, "agent"); display: block; margin-bottom: 3px;
                       font: 10px var(--mono); letter-spacing: .08em; color: var(--green); }
  .msg.sys { align-self: center; font-size: 12px; text-align: center; color: var(--muted); }
  .msg.err { color: var(--red); }

  /* session strip */
  #strip { display: none; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 7px 16px; border-top: 1px solid var(--stroke); font: 11px var(--mono); color: var(--muted); }
  #strip.on { display: flex; }
  #strip b { font-weight: 500; color: var(--light); }
  #strip .bal { color: var(--green); font-variant-numeric: tabular-nums; cursor: pointer; }
  #strip .bal.low { color: var(--amber); }
  #strip a, #strip .lnk { color: var(--green); text-decoration: none; cursor: pointer; }

  /* staged composer: connect -> sign in -> fund -> chat */
  #composer { display: flex; align-items: stretch; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--stroke); }
  #input, #fundamt { background: var(--bg02); border: 1px solid var(--stroke); border-radius: 8px; color: var(--light); }
  #input { flex: 1; min-height: 42px; padding: 10px 14px; font: inherit; resize: none; }
  #input::placeholder { color: var(--muted); }
  #input:focus { outline: 1px solid var(--green); }
  #fundamt { width: 76px; padding: 9px 10px; font: 13px var(--mono); text-align: right; }
  button { background: var(--bg02); color: var(--green); border: 1px solid var(--green); border-radius: 8px;
           padding: 9px 16px; font: 600 13px "DM Sans", system-ui; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { background: var(--green); color: var(--bg01); }
  button:disabled { border-color: var(--stroke); color: var(--muted); cursor: default; }
  .stagebtn { flex: 1; padding: 11px 16px; }
  .stagebtn small { display: block; margin-top: 2px; font-weight: 400; color: var(--muted); }
  .stagebtn:hover:not(:disabled) small { color: var(--bg01); }

  /* status line + spinner */
  #status { min-height: 1em; padding: 0 16px 8px; font-size: 11px; color: var(--muted); }
  .spin::after { content: ""; display: inline-block; width: 9px; height: 9px; margin-left: 7px; vertical-align: -1px;
                 border: 2px solid var(--muted); border-top-color: var(--green); border-radius: 50%;
                 animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
<script>if (self !== top) document.documentElement.classList.add("embed");</script>
</head>
<body>
<header>
  <h1>{{.Title}}</h1>
  <span class="tag"><span id="price">…</span>/message · <span id="netname">…</span></span>
</header>
<div id="log">
  <div class="msg sys">Pay-per-message chat — connect a wallet, fund a small session once, then every message is paid automatically. No account needed.</div>
</div>
<div id="strip">
  <span>session <b id="sessaddr">—</b></span>
  <span class="bal" id="balance" title="click to refresh">$0.00</span>
  <span class="lnk" id="fundlink">+ fund</span>
  <a id="explorer" target="_blank" rel="noopener" style="display:none">explorer</a>
</div>
<form id="composer"></form>
<div id="status"></div>
<script type="module">
// single self-hosted vendor bundle (viem 2.21.25 + @x402/fetch + @x402/evm 2.18.0, esbuild --bundle
// --minify from the exact versions proven by the x402trace paid harness) — no CDN at runtime
import { createWalletClient, createPublicClient, custom, http, erc20Abi,
         formatUnits, parseUnits, keccak256, privateKeyToAccount, base, baseSepolia,
         wrapFetchWithPayment, x402Client, ExactEvmScheme, toClientEvmSigner } from "./chat-vendor.js?v=895fd923";

const ENDPOINT = "/v1/chat/completions";
const AGENT = {{.Title}};
document.documentElement.style.setProperty("--agent-name", JSON.stringify(AGENT));
const MAX_PRICE = 50000n; // refuse challenges above $0.05 in 6-dec units
const CHAINS = { "eip155:8453": base, "eip155:84532": baseSepolia };
const $ = (id) => document.getElementById(id);
let net, chain, asset, pub, explorer; // resolved from the 402 challenge
let wallet, mainAddr, burner, payFetch, balPoll = null;
let model = {{.OfferName}}, price = null, balance = 0n, busy = false;
const messages = [];

const short = (a) => a.slice(0, 6) + "…" + a.slice(-4);
const status = (t, spin) => { $("status").textContent = t; $("status").className = spin ? "spin" : ""; };
const say = (cls, text) => {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  return d;
};

// ---- the composer is a staged control: connect -> sign in -> fund -> chat.
let forceFund = false;
function stage() {
  if (!mainAddr) return "connect";
  if (!burner) return "signin";
  if (forceFund || price === null || balance < price) return "fund";
  return "ready";
}
function renderComposer() {
  const c = $("composer");
  const s = stage();
  if (c.dataset.stage === s) return;
  c.dataset.stage = s;
  c.innerHTML = "";
  if (s === "connect") {
    const b = mkbtn("Connect wallet", "");
    b.onclick = connect;
    c.appendChild(b);
  } else if (s === "signin") {
    // Fallback only: connect() chains into signin() automatically; this
    // stage renders when the user rejected that signature and needs a retry.
    const b = mkbtn("Sign in with Ethereum", "one signature derives your local session wallet — nothing is stored");
    b.onclick = signin;
    c.appendChild(b);
  } else if (s === "fund") {
    const amt = document.createElement("input");
    amt.id = "fundamt"; amt.value = "1.00"; amt.inputMode = "decimal";
    amt.setAttribute("aria-label", "USDC amount");
    const b = mkbtn("Fund session with USDC", "");
    b.onclick = () => fund(amt.value);
    c.appendChild(amt); c.appendChild(b);
    if (forceFund) {
      const x = document.createElement("button");
      x.type = "button"; x.textContent = "×"; x.title = "back to chat";
      x.onclick = () => { forceFund = false; c.dataset.stage = ""; renderComposer(); };
      c.appendChild(x);
    }
  } else {
    const ta = document.createElement("textarea");
    ta.id = "input"; ta.rows = 1;
    ta.placeholder = "Ask anything — " + priceStr() + "/message";
    ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); c.requestSubmit(); } };
    const b = document.createElement("button"); b.type = "submit"; b.textContent = "Send";
    c.appendChild(ta); c.appendChild(b);
    ta.focus();
  }
}
function mkbtn(label, sub) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "stagebtn"; b.textContent = label;
  if (sub) { const s = document.createElement("small"); s.textContent = sub; b.appendChild(s); }
  return b;
}
const priceStr = () => price === null ? "…" : "$" + formatUnits(price, 6);

// ---- startup: unpaid probe confirms the agent is up and shows the live price
(async () => {
  renderComposer();
  try {
    const r = await fetch(ENDPOINT, { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ model, messages: [{ role: "user", content: "ping" }] }) });
    if (r.status !== 402) throw new Error("expected 402, got " + r.status);
    const c = await r.json();
    const acc = (c.accepts || [])[0] || {};
    net = acc.network; chain = CHAINS[net]; asset = acc.asset;
    if (!chain || !asset) throw new Error("unsupported payment network: " + net);
    pub = createPublicClient({ chain, transport: http() });
    explorer = chain.blockExplorers?.default?.url || "";
    price = BigInt(acc.amount || 0);
    model = c.extensions?.bazaar?.info?.input?.body?.model || model;
    $("price").textContent = priceStr();
    $("netname").textContent = (acc.extra?.name || "USDC") + " on " + chain.name;
    if (price > MAX_PRICE) { say("sys err", "Advertised price exceeds this page's safety cap — chat disabled."); price = null; }
    renderComposer();
  } catch (e) { $("price").textContent = "?"; say("sys err", "Agent unreachable: " + e.message); }
})();

// ---- stage 1: connect
async function connect() {
  try {
    if (!window.ethereum) { say("sys err", "No wallet found. Install Rabby or MetaMask, then reload."); return; }
    if (!chain) { status("still fetching the agent's payment details — try again in a second"); return; }
    [mainAddr] = await window.ethereum.request({ method: "eth_requestAccounts" });
    try { await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x" + chain.id.toString(16) }] }); } catch {}
    wallet = createWalletClient({ account: mainAddr, chain, transport: custom(window.ethereum) });
    status("");
    renderComposer();
    // One click does both: the connect gesture keeps the signature request
    // user-triggered, so chain straight into sign-in. If the user rejects,
    // signin() surfaces the error and the composer stays on its retry stage.
    await signin();
  } catch (e) { status("connect failed: " + (e.shortMessage || e.message)); }
}

// ---- stage 2: sign in -> derive session key (deterministic, domain-bound).
// This message must stay byte-identical forever: it re-derives existing
// users' session wallets. Changing it strands their funds.
const SIGNIN = "Agent chat session key v1\n" +
  "domain: " + location.hostname + "\n\n" +
  "Signing derives a local session wallet used to pay this agent per chat message.\n" +
  "Only sign this message on " + location.hostname + ".";
async function signin() {
  try {
    status("waiting for signature…", true);
    const sig = await wallet.signMessage({ account: mainAddr, message: SIGNIN });
    burner = privateKeyToAccount(keccak256(sig));
    const x = new x402Client().register(net, new ExactEvmScheme(toClientEvmSigner(burner, pub)));
    payFetch = wrapFetchWithPayment(fetch, x);
    $("sessaddr").textContent = short(burner.address);
    if (explorer) { $("explorer").href = explorer + "/address/" + burner.address; $("explorer").style.display = ""; }
    $("strip").classList.add("on");
    status("");
    await refreshBalance();
    // Poll so a transfer sent from any wallet (not just the fund stage)
    // unlocks the chat; the balance readout is also click-to-refresh.
    if (!balPoll) balPoll = setInterval(() => refreshBalance(), 8000);
    renderComposer();
  } catch (e) { status("sign-in failed: " + (e.shortMessage || e.message)); }
}

async function refreshBalance() {
  if (!burner || !pub) return;
  let b;
  try {
    b = await pub.readContract({ address: asset, abi: erc20Abi, functionName: "balanceOf", args: [burner.address] });
  } catch { return; } // transient RPC failure: keep the last rendered state
  balance = b;
  $("balance").textContent = "$" + formatUnits(b, 6);
  $("balance").classList.toggle("low", price !== null && b < price * 5n);
  if (!busy) renderComposer();
}
$("balance").onclick = () => { status("refreshing balance…", true); refreshBalance().then(() => status("")); };
$("fundlink").onclick = () => {
  if (!burner || forceFund) return;
  forceFund = true; $("composer").dataset.stage = ""; renderComposer();
};

// ---- stage 3: fund the session wallet from the main wallet (one confirmation)
async function fund(val) {
  try {
    const amt = parseUnits(val || "0", 6);
    if (amt <= 0n) return;
    status("confirm the USDC transfer in your wallet…", true);
    const hash = await wallet.writeContract({ account: mainAddr, chain, address: asset,
      abi: erc20Abi, functionName: "transfer", args: [burner.address, amt] });
    status("funding tx sent, waiting for confirmation…", true);
    await pub.waitForTransactionReceipt({ hash });
    status("session funded ✓");
    forceFund = false; $("composer").dataset.stage = "";
    await refreshBalance();
  } catch (e) { status("funding failed: " + (e.shortMessage || e.message)); }
}

// ---- chat loop: each send is auto-paid via x402 (silent EIP-3009 signature)
$("composer").onsubmit = async (ev) => {
  ev.preventDefault();
  const ta = $("input");
  const text = ta?.value.trim();
  if (!text || !payFetch || busy) return;
  busy = true; ta.value = ""; ta.disabled = true;
  say("user", text);
  messages.push({ role: "user", content: text });
  status("paying " + priceStr() + " and running the agent…", true);
  try {
    const r = await payFetch(ENDPOINT, { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ model, messages, stream: false }) });
    if (r.status === 429) { say("sys err", "Agent is busy — try again in a minute."); messages.pop(); }
    else if (!r.ok) { say("sys err", "Request failed (" + r.status + "). " + (await r.text()).slice(0, 160)); messages.pop(); }
    else {
      const j = await r.json();
      const reply = j.choices?.[0]?.message?.content || "(empty reply)";
      messages.push({ role: "assistant", content: reply });
      say("agent", reply);
      const settled = r.headers.get("x-payment-response") || r.headers.get("payment-response");
      status(settled ? "paid & settled ✓" : "paid ✓");
    }
  } catch (e) {
    messages.pop();
    say("sys err", /insufficient|funds|balance/i.test(String(e.message)) ?
      "Payment failed — session balance too low. Top it up with + fund above." :
      "Error: " + (e.shortMessage || e.message).slice(0, 200));
    status("");
  }
  busy = false;
  if ($("input")) $("input").disabled = false;
  await refreshBalance();
  renderComposer();
  $("input")?.focus();
};

</script>
</body>
</html>
