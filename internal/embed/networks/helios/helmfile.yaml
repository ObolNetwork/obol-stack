# Helios Light Client Network
# Provides an Ethereum light client that can be used as an RPC endpoint

repositories:
  - name: obol
    url: https://obolnetwork.github.io/helm-charts/

# Configuration via environment variables
# Override with: HELIOS_NETWORK, HELIOS_CONSENSUS_RPC, HELIOS_EXECUTION_RPC, HELIOS_CHECKPOINT
values:
  - network: {{ env "HELIOS_NETWORK" | default "mainnet" }}
    consensusRpc: {{ env "HELIOS_CONSENSUS_RPC" | default "http://testing.mainnet.beacon-api.nimbus.team" }}
    executionRpc: {{ env "HELIOS_EXECUTION_RPC" | default "https://eth.drpc.org" }}
    checkpoint: {{ env "HELIOS_CHECKPOINT" | default "" }}

releases:
  - name: helios
    namespace: helios
    createNamespace: true
    chart: obol/helios
    version: 0.1.4
    values:
      - fullnameOverride: helios-{{ .Values.network }}
      - helios:
          rpcBindIp: "0.0.0.0"
          rpcPort: 8545
          strictCheckpointAge: false
          network: {{ .Values.network }}
          consensusRpc: {{ .Values.consensusRpc | quote }}
          executionRpc: {{ .Values.executionRpc | quote }}
          checkpoint: {{ .Values.checkpoint | quote }}

      - persistence:
          enabled: true
          size: 10Gi
          storageClass: local-path

      - ingress:
          enabled: true
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/rewrite-target: /$2
            nginx.ingress.kubernetes.io/use-regex: "true"
          hosts:
            - host: obol.stack
              paths:
                - path: /helios(/|$)(.*)
                  pathType: ImplementationSpecific
