# Scoped RBAC for the default Hermes agent in this network namespace.
# Cluster-wide read (pods, logs, events, statefulsets, PVCs) comes from the
# openclaw-monetize-read ClusterRole; this Role adds ConfigMap read, which is
# not granted cluster-wide because other namespaces' ConfigMaps carry
# credentials. Network ConfigMaps here are public (client config + the
# <network>-<id>-metadata endpoints); keys/JWTs live in Secrets, never readable.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: obol-agent-network-role
  labels:
    app.kubernetes.io/part-of: obol.stack
    obol.stack/id: {{ .Values.id }}
rules:
  # Read access to core resources for monitoring
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "endpoints", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Write access to Obol CRDs only. The serviceoffer-controller owns routing
  # and registration child resources.
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: obol-agent-access
  labels:
    app.kubernetes.io/part-of: obol.stack
    obol.stack/id: {{ .Values.id }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: obol-agent-network-role
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes-obol-agent
