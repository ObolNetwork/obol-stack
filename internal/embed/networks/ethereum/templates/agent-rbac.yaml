# Grant Obol Agent admin access to this namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: obol-agent-access
  # Namespace is set by Helm release
  labels:
    app.kubernetes.io/part-of: obol.stack
    obol.stack/id: {{ .Values.id }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: obol-agent
    namespace: agent