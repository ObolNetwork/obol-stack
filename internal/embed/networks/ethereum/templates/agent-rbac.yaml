{{- if eq .Release.Name "ethereum-pvcs" }}
# Scoped RBAC for Obol Agent in this namespace
# Replaces the previous ClusterRole: admin binding with least-privilege access
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: obol-agent-network-role
  labels:
    app.kubernetes.io/part-of: obol.stack
    obol.stack/id: {{ .Values.id }}
rules:
  # Read access to core resources for monitoring
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "endpoints", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Write access to CRDs and routing for monetization
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: obol-agent-access
  labels:
    app.kubernetes.io/part-of: obol.stack
    obol.stack/id: {{ .Values.id }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: obol-agent-network-role
subjects:
  - kind: ServiceAccount
    name: obol-agent
    namespace: agent
{{- end }}
