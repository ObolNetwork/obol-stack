{{- if eq .Release.Name "ethereum-pvcs" }}
{{- /*
  PVC sizing is resolved by the CLI and written into values.yaml so partial
  archive scopes get smaller requests than full genesis archives. The fallback
  keeps older generated values usable.
*/ -}}
{{- $mode := default "full" .Values.mode -}}
{{- $isArchive := eq $mode "archive" -}}
{{- $execSize := index .Values "executionStorageSize" | default "" -}}
{{- $consensusSize := index .Values "consensusStorageSize" | default "" -}}
{{- if or (eq $execSize "") (eq $consensusSize "") -}}
  {{- $execSize = "500Gi" -}}
  {{- $consensusSize = "200Gi" -}}
  {{- if eq .Values.network "mainnet" -}}
    {{- if $isArchive -}}
      {{- $execSize = "4500Gi" -}}
      {{- $consensusSize = "500Gi" -}}
    {{- end -}}
  {{- else -}}
    {{- /* sepolia, hoodi and other testnets */ -}}
    {{- if $isArchive -}}
      {{- $execSize = "300Gi" -}}
      {{- $consensusSize = "100Gi" -}}
    {{- else -}}
      {{- $execSize = "100Gi" -}}
      {{- $consensusSize = "50Gi" -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
---
# Ethereum Execution Client PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: execution-{{ .Values.executionClient }}-{{ .Values.network }}
  namespace: ethereum-{{ .Values.id }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: {{ $execSize }}
---
# Ethereum Consensus Client PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: consensus-{{ .Values.consensusClient }}-{{ .Values.network }}
  namespace: ethereum-{{ .Values.id }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: {{ $consensusSize }}
{{- end }}
