{{- if eq .Release.Name "ethereum-ingress" }}
# HTTPRoute for Ethereum execution client RPC
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ethereum-execution
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - obol.stack
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /{{ .Release.Namespace }}/execution
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ethereum-execution
          port: 8545
---
# HTTPRoute for Ethereum beacon client RPC
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ethereum-beacon
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - obol.stack
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /{{ .Release.Namespace }}/beacon
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ethereum-beacon
          port: 5052
{{- end }}
