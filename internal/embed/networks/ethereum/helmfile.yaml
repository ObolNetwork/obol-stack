repositories:
  - name: ethereum-helm-charts
    url: https://ethpandaops.github.io/ethereum-helm-charts

# Configuration
values:
  - network: mainnet
    executionClient: reth
    consensusClient: lighthouse

releases:
  # Create PVCs first - before the Ethereum node
  - name: ethereum-pvcs
    namespace: ethereum
    createNamespace: true
    chart: .
    values:
      # Pass only the values needed for PVC creation
      - executionClient: '{{ .Values.executionClient }}'
        consensusClient: '{{ .Values.consensusClient }}'
        network: '{{ .Values.network }}'

  # Ethereum node (execution and consensus clients)
  # Uses the external ethereum-helm-charts/ethereum-node umbrella chart
  # Depends on ethereum-pvcs to ensure PVCs exist first
  - name: ethereum
    namespace: ethereum
    createNamespace: true
    chart: ethereum-helm-charts/ethereum-node
    needs: [ethereum-pvcs]
    values:
      # Network and checkpoint sync configuration
      - global:
          main:
            network: '{{ .Values.network }}'
          checkpointSync:
            enabled: true
            addresses:
              mainnet: https://mainnet-checkpoint-sync.attestant.io
              sepolia: https://checkpoint-sync.sepolia.ethpandaops.io
              holesky: https://checkpoint-sync.holesky.ethpandaops.io
              hoodi: https://checkpoint-sync.hoodi.ethpandaops.io

      # Execution client
      - {{ .Values.executionClient }}:
          enabled: true
          persistence:
            enabled: true
            size: 500Gi
            # Use existing PVC with network/client naming: execution-{client}-{network}
            existingClaim: execution-{{ .Values.executionClient }}-{{ .Values.network }}

      # Consensus client
      - {{ .Values.consensusClient }}:
          enabled: true
          persistence:
            enabled: true
            size: 200Gi
            # Use existing PVC with network/client naming: consensus-{client}-{network}
            existingClaim: consensus-{{ .Values.consensusClient }}-{{ .Values.network }}

  # Ingress for Ethereum RPC endpoints
  # Wait for nginx ingress controller webhook to be ready
  - name: ethereum-ingress
    namespace: ethereum
    chart: .
    needs: [ethereum]
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "sh"
        args:
          - "-c"
          - |
            echo "Waiting for nginx ingress controller admission webhook to be ready..."
            kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=controller,app.kubernetes.io/instance=ingress-nginx -n ingress --timeout=120s || true
            sleep 2
    values:
      # Pass through values for ingress template
      - executionClient: '{{ .Values.executionClient }}'
        consensusClient: '{{ .Values.consensusClient }}'
        network: '{{ .Values.network }}'
