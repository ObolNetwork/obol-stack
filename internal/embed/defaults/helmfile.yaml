# Helmfile for Obol Stack default infrastructure
# Orchestrates core infrastructure components deployed with every stack

repositories:
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx

releases:
  # Local storage provisioner (raw manifests wrapped as chart)
  - name: obol-infrastructure
    namespace: kube-system
    chart: ./obol-infrastructure
    values:
      - dataDir: /data

  # Nginx ingress controller (upstream chart)
  - name: ingress-nginx
    namespace: ingress
    createNamespace: true
    chart: ingress-nginx/ingress-nginx
    version: 4.13.3
    values:
      - controller:
          replicaCount: 1
          service:
            type: LoadBalancer
            externalTrafficPolicy: Local
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          tolerations: []
