# Helmfile for Obol Stack default infrastructure
# Orchestrates core infrastructure components deployed with every stack

repositories:
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: obol
    url: https://obolnetwork.github.io/helm-charts/
  - name: ethereum
    url: https://ethpandaops.github.io/ethereum-helm-charts

# Single source of truth: change this to switch networks
values:
  - network: mainnet 

releases:
  # Local storage provisioner (raw manifests wrapped as chart)
  - name: obol-stack-defaults
    namespace: default
    chart: ./obol-stack-defaults
    values:
      - dataDir: /data
      - network: "{{ .Values.network }}"

  # Nginx ingress controller (upstream chart)
  - name: ingress-nginx
    namespace: default
    chart: ingress-nginx/ingress-nginx
    version: 4.13.3
    values:
      - controller:
          replicaCount: 1
          service:
            type: LoadBalancer
            externalTrafficPolicy: Local
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          tolerations: []
          admissionWebhooks:
            enabled: false

  # Helios light client
  - name: helios
    namespace: default
    chart: obol/helios
    version: 0.1.4
    needs:
      - default/ingress-nginx
    values:
      - ./values/helios.yaml.gotmpl

  # eRPC
  - name: erpc
    namespace: default
    chart: ethereum/erpc
    needs:
      - default/obol-stack-defaults
      - default/helios
    values:
      - ./values/erpc.yaml.gotmpl

  # Obol Stack frontend
  - name: obol-frontend
    namespace: default
    chart: obol/obol-app
    version: 0.1.0
    needs:
      - default/ingress-nginx
      - default/helios
    values:
      - replicaCount: 1
        image:
          repository: obolnetwork/obol-stack-front-end
          pullPolicy: IfNotPresent
          tag: ""
        service:
          type: ClusterIP
          port: 3000
        ingress:
          enabled: true
          className: "nginx"
          hosts:
            - host: obol.stack
              paths:
                - path: /
                  pathType: Prefix
        obol:
          stack:
            enabled: true
            ethRpcUrl: "http://helios-{{ .Values.network }}.default.svc.cluster.local:8545"
