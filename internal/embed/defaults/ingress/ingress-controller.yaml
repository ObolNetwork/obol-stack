---
# HelmChart CRD for nginx ingress controller
# k3s automatically deploys and manages this Helm release
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: ingress-nginx
  namespace: kube-system
spec:
  chart: ingress-nginx
  repo: https://kubernetes.github.io/ingress-nginx
  version: 4.13.3
  targetNamespace: ingress
  createNamespace: true
  values: |
    controller:
      replicaCount: 1

      service:
        type: LoadBalancer
        externalTrafficPolicy: Local

      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi

      tolerations: []
