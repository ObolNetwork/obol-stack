# Root helmfile for Obol Stack
# Orchestrates all applications in applications/*/helmfile.yaml
# Each application is self-contained with its own repositories and releases

# Global values available to all applications via .Values.obol
values:
  obol:
    clusterId: "{{ env \"OBOL_CLUSTER_ID\" | default \"local\" }}"
    network: "{{ env \"OBOL_NETWORK\" | default \"mainnet\" }}"
    dataDir: /data
    storageClass: local-path

helmfiles:
  # Auto-discover all applications
  # Each app defines its own repositories and releases
  - path: applications/*/helmfile.yaml
    values:
      - obol
