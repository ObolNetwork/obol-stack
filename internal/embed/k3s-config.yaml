# k3s server configuration for Obol Stack
# Generated by: obol stack init --backend k3s

# Disable components we manage ourselves (matching k3d config)
disable:
  - traefik
  - local-storage

# Data directory for k3s internal state
data-dir: {{DATA_DIR}}/k3s

# Bind to all interfaces for local access
bind-address: 0.0.0.0
https-listen-port: 6443

# TLS SANs for local + LAN access. k3s already auto-adds the node's primary
# IP, but listing it (and the hostname) explicitly lets worker nodes join via
# either address and keeps the API cert deterministic across restarts.
tls-san:
  - "127.0.0.1"
  - "localhost"
  - "obol.stack"
  - "{{NODE_IP}}"
  - "{{NODE_HOSTNAME}}"

# Relax eviction thresholds: k3s reports imagefs capacity as 0 on shared
# filesystems, causing spurious disk-pressure taints with percentage thresholds.
# Use absolute values instead.
kubelet-arg:
  - "eviction-hard=imagefs.available<1Gi,nodefs.available<1Gi,memory.available<100Mi"
  - "eviction-soft=imagefs.available<2Gi,nodefs.available<2Gi,memory.available<200Mi"
  - "eviction-soft-grace-period=imagefs.available=1m,nodefs.available=1m,memory.available=30s"

# Node labels
node-label:
  - "obol.cluster-id={{STACK_ID}}"
