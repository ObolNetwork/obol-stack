repositories:
  - name: ethereum-helm-charts
    url: https://ethpandaops.github.io/ethereum-helm-charts

releases:
  # Storage classes, persistent volumes, and ingress (deploy first!)
  # These must exist before the Ethereum chart creates its StatefulSet
  - name: ethereum-storage
    namespace: ethereum
    createNamespace: true
    chart: ./
    values:
      - executionStorageClassName: '{{ .Values.obol.ethereum.execution.client }}-{{ .Values.obol.network }}'
        consensusStorageClassName: '{{ .Values.obol.ethereum.consensus.client }}-{{ .Values.obol.network }}'

  # Ethereum node (execution and consensus clients)
  # Uses the external ethereum-helm-charts/ethereum-node umbrella chart
  # Depends on storage being created first
  - name: ethereum
    namespace: ethereum
    chart: ethereum-helm-charts/ethereum-node
    version: 0.2.4
    needs:
      - ethereum-storage
    values:
      # Network and checkpoint sync configuration
      - global:
          main:
            network: '{{ .Values.obol.network }}'
          checkpointSync:
            enabled: true
            addresses:
              mainnet: https://mainnet-checkpoint-sync.attestant.io
              sepolia: https://checkpoint-sync.sepolia.ethpandaops.io
              holesky: https://checkpoint-sync.holesky.ethpandaops.io
              hoodi: https://checkpoint-sync.hoodi.ethpandaops.io

      # Execution client (configured by OBOL_ETHEREUM_EXECUTION_CLIENT env var)
      - {{ .Values.obol.ethereum.execution.client }}:
          enabled: true
          persistence:
            enabled: true
            storageClassName: '{{ .Values.obol.ethereum.execution.client }}-{{ .Values.obol.network }}'
            size: 500Gi

      # Consensus client (configured by OBOL_ETHEREUM_CONSENSUS_CLIENT env var)
      - {{ .Values.obol.ethereum.consensus.client }}:
          enabled: true
          persistence:
            enabled: true
            storageClassName: '{{ .Values.obol.ethereum.consensus.client }}-{{ .Values.obol.network }}'
            size: 200Gi
