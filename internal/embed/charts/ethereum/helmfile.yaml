repositories:
  - name: ethereum-helm-charts
    url: https://ethpandaops.github.io/ethereum-helm-charts

releases:
  # Create PVCs first - before the Ethereum node
  - name: ethereum-pvcs
    namespace: ethereum
    createNamespace: true
    chart: .
    needs: []
    values:
      # Pass only the values needed for PVC creation
      - executionClient: '{{ .Values.obol.ethereum.execution.client }}'
        consensusClient: '{{ .Values.obol.ethereum.consensus.client }}'
        network: '{{ .Values.obol.network }}'

  # Ethereum node (execution and consensus clients)
  # Uses the external ethereum-helm-charts/ethereum-node umbrella chart
  # Depends on ethereum-pvcs to ensure PVCs exist first
  - name: ethereum
    namespace: ethereum
    createNamespace: true
    chart: ethereum-helm-charts/ethereum-node
    needs: [ethereum-pvcs]
    values:
      # Network and checkpoint sync configuration
      - global:
          main:
            network: '{{ .Values.obol.network }}'
          checkpointSync:
            enabled: true
            addresses:
              mainnet: https://mainnet-checkpoint-sync.attestant.io
              sepolia: https://checkpoint-sync.sepolia.ethpandaops.io
              holesky: https://checkpoint-sync.holesky.ethpandaops.io
              hoodi: https://checkpoint-sync.hoodi.ethpandaops.io

      # Execution client (configured by OBOL_ETHEREUM_EXECUTION_CLIENT env var)
      - {{ .Values.obol.ethereum.execution.client }}:
          enabled: true
          persistence:
            enabled: true
            size: 500Gi
            # Use existing PVC with network/client naming: execution-{client}-{network}
            existingClaim: execution-{{ .Values.obol.ethereum.execution.client }}-{{ .Values.obol.network }}

      # Consensus client (configured by OBOL_ETHEREUM_CONSENSUS_CLIENT env var)
      - {{ .Values.obol.ethereum.consensus.client }}:
          enabled: true
          persistence:
            enabled: true
            size: 200Gi
            # Use existing PVC with network/client naming: consensus-{client}-{network}
            existingClaim: consensus-{{ .Values.obol.ethereum.consensus.client }}-{{ .Values.obol.network }}

  # Ingress for Ethereum RPC endpoints
  - name: ethereum-ingress
    namespace: ethereum
    chart: .
    needs: [ethereum]
    values:
      # Pass through values for ingress template
      - executionClient: '{{ .Values.obol.ethereum.execution.client }}'
        consensusClient: '{{ .Values.obol.ethereum.consensus.client }}'
        network: '{{ .Values.obol.network }}'
