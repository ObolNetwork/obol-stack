mode: auto

transport:
  protocol: "auto"

image:
  repository: cloudflare/cloudflared
  tag: "2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39"

metrics:
  address: "0.0.0.0:2000"
  # PodMonitor (release=monitoring) so Prometheus scrapes cloudflared_* metrics.
  podMonitor:
    enabled: true

quickTunnel:
  url: "http://traefik.traefik.svc.cluster.local:80"

persistent:
  replicaCount: 1

management:
  configMapName: "cloudflared-management"
  modeKey: "management_mode"
  protocolKey: "transport_protocol"

remoteManaged:
  tokenSecretName: "cloudflared-tunnel-token"
  tokenSecretKey: "TUNNEL_TOKEN"

localManaged:
  secretName: "cloudflared-local-credentials"
  configMapName: "cloudflared-local-config"
  tunnelIDKey: "tunnel_id"
