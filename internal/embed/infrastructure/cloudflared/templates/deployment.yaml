{{- $mode := default "auto" .Values.mode -}}
{{- $remoteSecretName := default "cloudflared-tunnel-token" .Values.remoteManaged.tokenSecretName -}}
{{- $remoteSecretKey := default "TUNNEL_TOKEN" .Values.remoteManaged.tokenSecretKey -}}
{{- $localSecretName := default "cloudflared-local-credentials" .Values.localManaged.secretName -}}
{{- $localConfigMapName := default "cloudflared-local-config" .Values.localManaged.configMapName -}}
{{- $localTunnelIDKey := default "tunnel_id" .Values.localManaged.tunnelIDKey -}}

{{- $useLocal := false -}}
{{- if eq $mode "local" -}}
{{- $useLocal = true -}}
{{- else if eq $mode "auto" -}}
{{- $ls := lookup "v1" "Secret" .Release.Namespace $localSecretName -}}
{{- $cm := lookup "v1" "ConfigMap" .Release.Namespace $localConfigMapName -}}
{{- if and $ls $cm -}}
{{- $useLocal = true -}}
{{- end -}}
{{- end -}}

{{- $useRemote := false -}}
{{- if not $useLocal -}}
{{- if eq $mode "remote" -}}
{{- $useRemote = true -}}
{{- else if eq $mode "auto" -}}
{{- $rs := lookup "v1" "Secret" .Release.Namespace $remoteSecretName -}}
{{- if $rs -}}
{{- $useRemote = true -}}
{{- end -}}
{{- end -}}
{{- end -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: obol-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - {{ .Values.metrics.address | quote }}
            {{ if $useLocal }}
            - --origincert
            - /etc/cloudflared/cert.pem
            - --config
            - /etc/cloudflared/config.yml
            - run
            - "$(TUNNEL_ID)"
            {{ else if $useRemote }}
            - run
            - --token
            - "$(TUNNEL_TOKEN)"
            {{ else }}
            - --url
            - {{ .Values.quickTunnel.url | quote }}
            {{ end }}
          {{ if $useLocal }}
          env:
            - name: TUNNEL_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ $localConfigMapName | quote }}
                  key: {{ $localTunnelIDKey | quote }}
          volumeMounts:
            - name: cloudflared-local
              mountPath: /etc/cloudflared
              readOnly: true
          {{ else if $useRemote }}
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $remoteSecretName | quote }}
                  key: {{ $remoteSecretKey | quote }}
          {{ end }}
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      {{ if $useLocal }}
      volumes:
        - name: cloudflared-local
          projected:
            sources:
              - secret:
                  name: {{ $localSecretName | quote }}
              - configMap:
                  name: {{ $localConfigMapName | quote }}
      {{ end }}
      restartPolicy: Always
