{{- $mode := default "auto" .Values.mode -}}
{{- $remoteSecretName := default "cloudflared-tunnel-token" .Values.remoteManaged.tokenSecretName -}}
{{- $remoteSecretKey := default "TUNNEL_TOKEN" .Values.remoteManaged.tokenSecretKey -}}
{{- $localSecretName := default "cloudflared-local-credentials" .Values.localManaged.secretName -}}
{{- $localConfigMapName := default "cloudflared-local-config" .Values.localManaged.configMapName -}}
{{- $localTunnelIDKey := default "tunnel_id" .Values.localManaged.tunnelIDKey -}}
{{- $managementConfigMapName := default "cloudflared-management" .Values.management.configMapName -}}
{{- $managementModeKey := default "management_mode" .Values.management.modeKey -}}
{{- $managementProtocolKey := default "transport_protocol" .Values.management.protocolKey -}}
{{- $persistentReplicas := int (default 2 .Values.persistent.replicaCount) -}}
{{- $defaultProtocol := default "auto" .Values.transport.protocol -}}
{{- $mgmt := lookup "v1" "ConfigMap" .Release.Namespace $managementConfigMapName -}}

{{- $effectiveMode := $mode -}}
{{- if eq $mode "auto" -}}
{{- if and $mgmt $mgmt.data (hasKey $mgmt.data $managementModeKey) -}}
{{- $effectiveMode = get $mgmt.data $managementModeKey | default "auto" -}}
{{- end -}}
{{- end -}}

{{- $effectiveProtocol := $defaultProtocol -}}
{{- if and $mgmt $mgmt.data (hasKey $mgmt.data $managementProtocolKey) -}}
{{- $effectiveProtocol = get $mgmt.data $managementProtocolKey | default $defaultProtocol -}}
{{- end -}}

{{- $useLocal := false -}}
{{- if eq $effectiveMode "local" -}}
{{- $useLocal = true -}}
{{- else if eq $effectiveMode "auto" -}}
{{- $ls := lookup "v1" "Secret" .Release.Namespace $localSecretName -}}
{{- $cm := lookup "v1" "ConfigMap" .Release.Namespace $localConfigMapName -}}
{{- if and $ls $cm -}}
{{- $useLocal = true -}}
{{- end -}}
{{- end -}}

{{- $useRemote := false -}}
{{- if not $useLocal -}}
{{- if eq $effectiveMode "remote" -}}
{{- $useRemote = true -}}
{{- else if eq $effectiveMode "auto" -}}
{{- $rs := lookup "v1" "Secret" .Release.Namespace $remoteSecretName -}}
{{- if $rs -}}
{{- $useRemote = true -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- $replicas := 0 -}}
{{- if or $useLocal $useRemote -}}
{{- $replicas = $persistentReplicas -}}
{{- end -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: obol-stack
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - {{ .Values.metrics.address | quote }}
            - --protocol
            - {{ $effectiveProtocol | quote }}
            {{- if $useLocal }}
            - --origincert
            - /etc/cloudflared/cert.pem
            - --config
            - /etc/cloudflared/config.yml
            - run
            - "$(TUNNEL_ID)"
            {{- else if $useRemote }}
            - run
            - --token
            - "$(TUNNEL_TOKEN)"
            {{- else }}
            - --url
            - {{ .Values.quickTunnel.url | quote }}
            {{- end }}
          {{- if $useLocal }}
          env:
            - name: TUNNEL_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ $localConfigMapName | quote }}
                  key: {{ $localTunnelIDKey | quote }}
          volumeMounts:
            - name: cloudflared-local
              mountPath: /etc/cloudflared
              readOnly: true
          {{- else if $useRemote }}
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $remoteSecretName | quote }}
                  key: {{ $remoteSecretKey | quote }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 2000
          startupProbe:
            httpGet:
              path: /ready
              port: metrics
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      {{- if $useLocal }}
      volumes:
        - name: cloudflared-local
          projected:
            sources:
              - secret:
                  name: {{ $localSecretName | quote }}
              - configMap:
                  name: {{ $localConfigMapName | quote }}
      {{- end }}
      restartPolicy: Always
