---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: agentidentities.obol.org
spec:
  group: obol.org
  names:
    kind: AgentIdentity
    listKind: AgentIdentityList
    plural: agentidentities
    shortNames:
    - aid
    singular: agentidentity
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.registrations[*].chain
      name: Chains
      type: string
    - jsonPath: .status.registrations[*].agentId
      name: AgentIDs
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentIdentity is the durable, on-chain identity an operator controls in
          the ERC-8004 Identity Registry. A single AgentIdentity outlives
          ServiceOffers: deleting the last ServiceOffer that references it does
          not delete the NFT, the published registration document, or the
          recorded agentId; instead the renderer publishes a tombstone
          (active:false, x402Support:false) so external observers still see the
          historical record.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            type: object
          status:
            properties:
              registrations:
                description: Per-chain ERC-8004 registrations for this identity document.
                items:
                  properties:
                    agentId:
                      description: On-chain ERC-721 tokenId on the given chain.
                      type: string
                    chain:
                      description: ERC-8004 registration chain alias.
                      maxLength: 64
                      type: string
                  required:
                  - agentId
                  - chain
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
