---
# Nodecore OAuth token plumbing for eRPC upstream auth (issue #124)
apiVersion: v1
kind: Namespace
metadata:
  name: erpc

---
apiVersion: v1
kind: Secret
metadata:
  name: obol-oauth-token
  namespace: erpc
type: Opaque
stringData:
  # Google `id_token` (JWT). CronJob refreshes and writes into this Secret.
  token: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: nodecore-oauth-refresh
  namespace: erpc
type: Opaque
stringData:
  # Google OAuth client credentials + refresh token.
  # This is intentionally stored separately from the ID token written to `obol-oauth-token`.
  client_id: ""
  client_secret: ""
  refresh_token: ""

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nodecore-token-writer
  namespace: erpc
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["obol-oauth-token"]
    verbs: ["get", "update", "patch"]

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodecore-token-refresher
  namespace: erpc

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nodecore-token-writer
  namespace: erpc
subjects:
  - kind: ServiceAccount
    name: nodecore-token-refresher
    namespace: erpc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nodecore-token-writer

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nodecore-token-refresher
  namespace: erpc
spec:
  # Refresh every 45 minutes to stay ahead of typical 1h ID token expiry.
  schedule: "0,45 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: nodecore-token-refresher
          restartPolicy: OnFailure
          containers:
            - name: refresh
              image: python:3.12-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: GOOGLE_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: nodecore-oauth-refresh
                      key: client_id
                - name: GOOGLE_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: nodecore-oauth-refresh
                      key: client_secret
                - name: GOOGLE_REFRESH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: nodecore-oauth-refresh
                      key: refresh_token
              command:
                - python
                - -c
                - |
                  import base64
                  import json
                  import os
                  import ssl
                  import urllib.parse
                  import urllib.request
                  
                  client_id = os.environ.get("GOOGLE_CLIENT_ID")
                  client_secret = os.environ.get("GOOGLE_CLIENT_SECRET")
                  refresh_token = os.environ.get("GOOGLE_REFRESH_TOKEN")
                  
                  if not client_id or not client_secret or not refresh_token:
                      raise SystemExit("Missing GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET/GOOGLE_REFRESH_TOKEN in Secret erpc/nodecore-oauth-refresh")
                  
                  token_url = "https://oauth2.googleapis.com/token"
                  body = urllib.parse.urlencode({
                      "client_id": client_id,
                      "client_secret": client_secret,
                      "refresh_token": refresh_token,
                      "grant_type": "refresh_token",
                  }).encode("utf-8")
                  
                  req = urllib.request.Request(
                      token_url,
                      data=body,
                      method="POST",
                      headers={"Content-Type": "application/x-www-form-urlencoded"},
                  )
                  
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      payload = json.loads(resp.read().decode("utf-8"))
                  
                  id_token = payload.get("id_token")
                  if not id_token:
                      raise SystemExit(f"Google token endpoint response missing id_token: {payload}")
                  
                  token_b64 = base64.b64encode(id_token.encode("utf-8")).decode("utf-8")
                  
                  namespace = "erpc"
                  secret_name = "obol-oauth-token"
                  api_server = "https://kubernetes.default.svc"
                  
                  sa_token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                  sa_ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  
                  with open(sa_token_path, "r", encoding="utf-8") as f:
                      sa_token = f.read().strip()
                  
                  patch = json.dumps({"data": {"token": token_b64}}).encode("utf-8")
                  patch_url = f"{api_server}/api/v1/namespaces/{namespace}/secrets/{secret_name}"
                  
                  ctx = ssl.create_default_context(cafile=sa_ca_path)
                  patch_req = urllib.request.Request(
                      patch_url,
                      data=patch,
                      method="PATCH",
                      headers={
                          "Authorization": f"Bearer {sa_token}",
                          "Content-Type": "application/merge-patch+json",
                          "Accept": "application/json",
                      },
                  )
                  
                  with urllib.request.urlopen(patch_req, timeout=20, context=ctx) as resp:
                      if resp.status < 200 or resp.status >= 300:
                          raise SystemExit(f"Failed to patch Secret {namespace}/{secret_name}: HTTP {resp.status} {resp.read().decode('utf-8')}")
                  
                  print("Updated Secret erpc/obol-oauth-token")
