# Sensitive obol-frontend env, kept out of the Deployment spec.
#
# BETTER_AUTH_SECRET and OBOL_GOOGLE_CLIENT_SECRET used to be rendered as
# literal `env[].value` entries on the obol-app Deployment, readable by anyone
# with read on Deployments (including the built-in `view` ClusterRole). The
# obol-frontend release now references this Secret via
# `valueFrom.secretKeyRef` (values/obol-frontend.yaml.gotmpl), and Reloader
# (pod-template annotation) rolls the pod when it changes.
#
# Source of truth:
#   - `obol stack up` (fromEnv=true): the host env, exactly as before. An unset
#     env var renders "" (feature off), so unsetting + stack up disables it.
#   - Any other base sync (`obol sell` -> EnsureVerifier, `obol update`): the
#     shell running it may not carry these vars, so the live Secret is carried
#     over via lookup instead of being blanked.
{{- $s := .Values.frontend.secrets }}
{{- $data := dict }}
{{- if not $s.fromEnv }}
{{- $live := lookup "v1" "Secret" "obol-frontend" "obol-frontend-secrets" }}
{{- if $live }}
{{- $data = $live.data | default dict }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: obol-frontend-secrets
  namespace: obol-frontend
type: Opaque
data:
{{- if $s.fromEnv }}
  BETTER_AUTH_SECRET: {{ $s.betterAuthSecret | default "" | b64enc | quote }}
  OBOL_GOOGLE_CLIENT_SECRET: {{ $s.googleClientSecret | default "" | b64enc | quote }}
{{- else }}
  BETTER_AUTH_SECRET: {{ get $data "BETTER_AUTH_SECRET" | default "" | quote }}
  OBOL_GOOGLE_CLIENT_SECRET: {{ get $data "OBOL_GOOGLE_CLIENT_SECRET" | default "" | quote }}
{{- end }}
