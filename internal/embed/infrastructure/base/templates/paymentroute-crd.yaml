---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: paymentroutes.obol.org
spec:
  group: obol.org
  names:
    kind: PaymentRoute
    listKind: PaymentRouteList
    plural: paymentroutes
    singular: paymentroute
    shortNames:
      - pr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - pattern
                - price
                - payTo
                - network
              properties:
                pattern:
                  type: string
                  description: "URL path pattern (e.g., /services/myapi/*)"
                price:
                  type: string
                  description: "USDC price per request in human-readable decimals"
                payTo:
                  type: string
                  description: "Seller wallet address (0x-prefixed)"
                network:
                  type: string
                  description: "Chain name (e.g., base-sepolia)"
                facilitatorURL:
                  type: string
                  description: "x402 facilitator URL"
                description:
                  type: string
                priceModel:
                  type: string
                  enum: ["per-request", "per-mtok", "per-hour"]
                perMTok:
                  type: string
                  description: "Original per-MTok price if approximated"
                approxTokensPerRequest:
                  type: integer
                upstreamAuth:
                  type: string
                  description: "Authorization header for upstream (injected by verifier)"
            status:
              type: object
              properties:
                admitted:
                  type: boolean
                  description: "True when verifier has loaded this route"
                lastAdmittedGeneration:
                  type: integer
                  format: int64
      additionalPrinterColumns:
        - name: Pattern
          type: string
          jsonPath: .spec.pattern
        - name: Price
          type: string
          jsonPath: .spec.price
        - name: Network
          type: string
          jsonPath: .spec.network
        - name: Admitted
          type: boolean
          jsonPath: .status.admitted
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
