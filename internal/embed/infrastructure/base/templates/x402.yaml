---
# x402 runtime components:
# - x402-verifier: shared seller-owned x402 gateway (and legacy /verify endpoint)
# - serviceoffer-controller: control-plane reconciler for ServiceOffer child resources
apiVersion: v1
kind: Namespace
metadata:
  name: x402

---
# Static gateway settings plus optional manual routes. In cluster mode the
# gateway merges these with dynamic routes derived from ready ServiceOffers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: x402-pricing
  namespace: x402
data:
  pricing.yaml: |
    wallet: ""
    chain: "base"
    facilitatorURL: "https://x402.gcp.obol.tech"
    # verifyOnly applies to the legacy /verify endpoint only. The shared seller
    # gateway path always settles after upstream success.
    verifyOnly: true
    routes: []

---
# CA certificates for outbound TLS (e.g. x402.gcp.obol.tech).
# The verifier image is minimal and lacks a system CA bundle; this
# ConfigMap is populated at deploy time from the host cert store.
# Created by: kubectl create configmap ca-certificates -n x402 \
#   --from-file=ca-certificates.crt=/etc/ssl/certs/ca-certificates.crt
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-certificates
  namespace: x402
data: {}

---
apiVersion: v1
kind: Secret
metadata:
  name: x402-secrets
  namespace: x402
type: Opaque
stringData:
  WALLET_ADDRESS: ""

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x402-verifier
  namespace: x402

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serviceoffer-controller
  namespace: x402

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: x402-verifier
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["litellm-secrets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: x402-verifier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: x402-verifier
subjects:
  - kind: ServiceAccount
    name: x402-verifier
    namespace: x402

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: serviceoffer-controller
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["registrationrequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["registrationrequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["agentidentities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["agentidentities/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["agents/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  # Per-agent runtime resources written by the Agent reconciler.
  # ServiceAccount + PVC are namespace-scoped child resources; secrets
  # are limited to creating the agent's API-server token (random) and
  # reading litellm-secrets for the master key. Reading all secrets
  # cluster-wide is intentionally not granted; the agent reconciler only
  # needs read access on litellm-secrets, but the dynamic client makes
  # narrowing harder than it's worth for v1.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["referencegrants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Scoped to litellm-secrets only. Needed to read LITELLM_MASTER_KEY for
  # hot-add/hot-delete via the LiteLLM HTTP API (no pod restart — preserves
  # the x402-buyer sidecar's pod-local consumed-auth state).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["litellm-secrets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: serviceoffer-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: serviceoffer-controller
subjects:
  - kind: ServiceAccount
    name: serviceoffer-controller
    namespace: x402

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-verifier
  namespace: x402
  labels:
    app: x402-verifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: x402-verifier
  template:
    metadata:
      labels:
        app: x402-verifier
    spec:
      serviceAccountName: x402-verifier
      containers:
        - name: verifier
          image: ghcr.io/obolnetwork/x402-verifier:b13254e@sha256:a8a7aa0ca4c35b0ddf6983fa6e3e5f8a3f64e44d8e506ebfd55e39de2bc0342d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          args:
            - --config=/config/pricing.yaml
            - --listen=:8080
            - --route-source=kube
          volumeMounts:
            - name: pricing-config
              mountPath: /config
              readOnly: true
            - name: ca-certs
              mountPath: /etc/ssl/certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: pricing-config
          configMap:
            name: x402-pricing
            items:
              - key: pricing.yaml
                path: pricing.yaml
        - name: ca-certs
          configMap:
            name: ca-certificates
            optional: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceoffer-controller
  namespace: x402
  labels:
    app: serviceoffer-controller
spec:
  replicas: 1  # Do not scale — multiple replicas race on ERC-8004 on-chain registration
  selector:
    matchLabels:
      app: serviceoffer-controller
  template:
    metadata:
      labels:
        app: serviceoffer-controller
    spec:
      serviceAccountName: serviceoffer-controller
      containers:
        - name: controller
          image: ghcr.io/obolnetwork/serviceoffer-controller:b13254e@sha256:f83bd7e55bdc5d87edb49c04e7fd9257097364e2d43e769c19dfd7c8b47d07af
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args: []
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              # Bumped from 256Mi after adding the Agent informer + agent
              # reconciler — the additional shared cache + workqueue + the
              # in-controller keystore generation pushed steady-state past
              # 256Mi and triggered OOMKilled restart loops.
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: x402-verifier
  namespace: x402
  labels:
    app: x402-verifier
spec:
  type: ClusterIP
  selector:
    app: x402-verifier
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: x402-verifier
  namespace: x402
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: x402-verifier
