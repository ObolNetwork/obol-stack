---
# x402 runtime components:
# - x402-verifier: shared seller-owned x402 gateway (and legacy /verify endpoint)
# - serviceoffer-controller: control-plane reconciler for ServiceOffer child resources
apiVersion: v1
kind: Namespace
metadata:
  name: x402
  labels:
    # Pod Security Standards: Restricted profile enforced at admission.
    # Future Deployment edits that omit the per-pod securityContext will be
    # rejected by the apiserver. Both x402-verifier and serviceoffer-controller
    # run as non-root with all caps dropped, seccomp=RuntimeDefault, and
    # readOnlyRootFilesystem.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Static gateway settings plus optional manual routes. In cluster mode the
# gateway merges these with dynamic routes derived from ready ServiceOffers.
#
# authCaptureUnlock is rendered from values so it SURVIVES `obol stack up`.
# Hand-patching this ConfigMap works until the next sync, which restores the
# chart default and silently disables the fee split — that has already
# happened once on a live stack.
apiVersion: v1
kind: ConfigMap
metadata:
  name: x402-pricing
  namespace: x402
data:
  pricing.yaml: |
    wallet: ""
    chain: "base"
    facilitatorURL: "{{ .Values.x402.facilitatorURL | default "https://x402.gcp.obol.tech" }}"
    # verifyOnly applies to the legacy /verify endpoint only. The shared seller
    # gateway path always settles after upstream success.
    verifyOnly: true
    {{- with .Values.x402.authCaptureUnlock }}
    {{- if .enabled }}
    # Paid unlock gate. The offer named by offerPrefix must already expose a
    # `gate: auth` route (its free SIWX sign-in is suppressed); buyers mint a
    # session by paying once instead. minFeeBps/maxFeeBps bound the cut the
    # buyer signs; the remainder goes to payTo.
    authCaptureUnlock:
      enabled: true
      offerPrefix: {{ .offerPrefix | quote }}
      price: {{ .price | quote }}
      network: {{ .network | quote }}
      payTo: {{ .payTo | quote }}
      feeRecipient: {{ .feeRecipient | quote }}
      minFeeBps: {{ .minFeeBps }}
      maxFeeBps: {{ .maxFeeBps }}
      captureAuthorizer: {{ .captureAuthorizer | quote }}
      {{- with .captureDeadlineSecs }}
      captureDeadlineSecs: {{ . }}
      {{- end }}
      {{- with .refundDeadlineSecs }}
      refundDeadlineSecs: {{ . }}
      {{- end }}
    {{- end }}
    {{- end }}
    routes: []

---
# CA certificates for outbound TLS (e.g. x402.gcp.obol.tech).
# The verifier image is minimal and lacks a system CA bundle; this
# ConfigMap is populated at deploy time from the host cert store.
# Created by: kubectl create configmap ca-certificates -n x402 \
#   --from-file=ca-certificates.crt=/etc/ssl/certs/ca-certificates.crt
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-certificates
  namespace: x402
data: {}

---
apiVersion: v1
kind: Secret
metadata:
  name: x402-secrets
  namespace: x402
type: Opaque
stringData:
  WALLET_ADDRESS: ""
  # Shared secret for the verifier→broker HMAC (F1 defense in depth over the
  # NetworkPolicy). Empty = disabled on both sides; set the same non-empty
  # value to require a valid X-Obol-Broker-Sig on every async submit.
  JOB_BROKER_HMAC_SECRET: ""

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x402-verifier
  namespace: x402

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serviceoffer-controller
  namespace: x402

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: x402-verifier
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["litellm-secrets", "hermes-api-server"]
    verbs: ["get", "list", "watch"]
  # Storefront branding for verifier-rendered pages (402 paywall, SIWX
  # sign-in, error pages). Written by `obol sell info set`.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["obol-storefront-profile"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: x402-verifier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: x402-verifier
subjects:
  - kind: ServiceAccount
    name: x402-verifier
    namespace: x402

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: serviceoffer-controller
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["registrationrequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["registrationrequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["agentidentities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["agentidentities/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["agents/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  # Per-agent runtime resources written by the Agent reconciler.
  # ServiceAccount + PVC are namespace-scoped child resources.
  #
  # Secrets: the reconciler touches exactly three, by name:
  #   - litellm-secrets        get                      (read LITELLM_MASTER_KEY, ns llm)
  #   - hermes-api-server      get/delete/create        (mint the agent API token)
  #   - remote-signer-keystore get/update/patch/delete/create (mint + backfill auth token)
  # `hermes-api-server` is create-only: the token is preserved, not rotated.
  # `remote-signer-keystore` needs `update`/`patch` for a one-shot backfill
  # path (backfillSignerAuthToken in agent_wallet.go) that adds the
  # signer-auth bearer-token key to keystores minted before signer auth
  # existed. Idempotent: presence of the key (even empty) is a no-op, so
  # operator-rotated tokens are never clobbered. `litellm-secrets` is
  # get-only; delete is confined to the two per-agent Secret names that
  # teardown owns. `create` is split into its own rule below: resourceNames
  # cannot scope create, and agent namespaces are minted dynamically, so
  # create stays namespace-wide. That is an integrity surface only.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["hermes"]
    verbs: ["get", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: ["hermes-data"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["litellm-secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["hermes-api-server"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["remote-signer-keystore"]
    verbs: ["get", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "create", "update", "patch", "delete"]
  # Agent-namespace isolation: the controller renders an agent-isolation
  # NetworkPolicy alongside every Agent's primitives (agent_render.go).
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["referencegrants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: serviceoffer-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: serviceoffer-controller
subjects:
  - kind: ServiceAccount
    name: serviceoffer-controller
    namespace: x402

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-verifier
  namespace: x402
  labels:
    app: x402-verifier
spec:
  # Single replica — verifier holds per-pod metric registries and per-pod
  # informer caches; multiple replicas produce metric series drift across
  # ServiceMonitor scrape rotations and the pruneSeriesNotIn GC (metrics.go)
  # becomes inconsistent. Single-node k3d gains no HA from 2 replicas.
  replicas: 1
  selector:
    matchLabels:
      app: x402-verifier
  template:
    metadata:
      labels:
        app: x402-verifier
    spec:
      serviceAccountName: x402-verifier
      # PSS Restricted: pod-level identity.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifier
          # :__OBOL_IMAGE__ → :GitCommit@sha256:… at apply (internal/images).
          image: ghcr.io/obolnetwork/x402-verifier:__OBOL_IMAGE__
          imagePullPolicy: IfNotPresent
          # PSS Restricted: per-container hardening. Verifier is a Go binary
          # reading two RO ConfigMaps; no writeable rootfs paths required.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          args:
            - --config=/config/pricing.yaml
            - --listen=:8080
            - --route-source=kube
          env:
            # F1 defense in depth: sign async broker-contract headers so a
            # NetworkPolicy-allowed pod still can't forge a submit. optional
            # so an install without the key runs (HMAC off, NetworkPolicy on).
            - name: JOB_BROKER_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: x402-secrets
                  key: JOB_BROKER_HMAC_SECRET
                  optional: true
          volumeMounts:
            - name: pricing-config
              mountPath: /config
              readOnly: true
            - name: ca-certs
              mountPath: /etc/ssl/certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: pricing-config
          configMap:
            name: x402-pricing
            items:
              - key: pricing.yaml
                path: pricing.yaml
        - name: ca-certs
          configMap:
            name: ca-certificates
            optional: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceoffer-controller
  namespace: x402
  labels:
    app: serviceoffer-controller
spec:
  # Single replica by default; bumping to 2+ is now safe — leader election
  # (client-go Lease in this namespace) prevents split-brain on the reconcile
  # loop and the resulting double on-chain ERC-8004 registration.
  replicas: 1
  selector:
    matchLabels:
      app: serviceoffer-controller
  template:
    metadata:
      labels:
        app: serviceoffer-controller
    spec:
      serviceAccountName: serviceoffer-controller
      # PSS Restricted: pod-level identity. Paired with Dockerfile
      # FROM gcr.io/distroless/static-debian12:nonroot which default-runs
      # as UID/GID 65532. Container escape via a Go-runtime CVE on a
      # UID-0 / no-seccomp / no-cap-drop / RW-rootfs container was the
      # easiest path to host pivot on k3s single-node; this closes it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # MUST be a binary whose reconciler treats Secret as create-only
          # (isCreateOnlyKind includes "Secret"). The ClusterRole above grants
          # NO secrets update/patch verb. Image tag is rewritten at apply time
          # to the CLI's GitCommit (see internal/images) — not a git digest pin.
          image: ghcr.io/obolnetwork/serviceoffer-controller:__OBOL_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args: []
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              # Bumped from 256Mi after adding the Agent informer + agent
              # reconciler — the additional shared cache + workqueue + the
              # in-controller keystore generation pushed steady-state past
              # 256Mi and triggered OOMKilled restart loops.
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: x402-verifier
  namespace: x402
  labels:
    app: x402-verifier
spec:
  type: ClusterIP
  selector:
    app: x402-verifier
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# PodDisruptionBudget: the verifier is the ForwardAuth gate for every paid
# route — evicting its only pod takes all /services/* traffic down. With the
# deliberate single replica (see the Deployment comment on per-pod metric
# registries), minAvailable: 1 makes voluntary evictions (multi-node drains,
# upgrades) require explicit operator intent instead of silently gapping the
# payment path. Same stance as the litellm PDB in llm.yaml. Rollouts are
# unaffected — the default RollingUpdate surge at 1 replica is 0-unavailable,
# gated by /readyz (config + routes loaded).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: x402-verifier
  namespace: x402
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: x402-verifier

---
# ServiceMonitor for x402-verifier — scrapes the stable Service endpoint
# rather than per-pod IPs (which is what a PodMonitor would do). Lives
# alongside the Service it observes so adding/changing the port or
# selector here is a single-file change.
#
# Picked up by kube-prometheus-stack via the `release: monitoring` label
# (configured in values/monitoring.yaml.gotmpl as the serviceMonitorSelector).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: x402-verifier
  namespace: x402
  labels:
    release: monitoring
    app: x402-verifier
spec:
  selector:
    matchLabels:
      app: x402-verifier
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# job-broker: async delivery for spec.async ServiceOffers. The verifier
# proxies verified+settled paid requests here instead of the upstream; the
# broker answers 202 with a job id, replays the request upstream with no
# client-facing deadline, and serves the free /jobs/* status pages plus
# payer/token-gated results. One per stack; jobs live in SQLite on the PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: job-broker-data
  namespace: x402
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-broker
  namespace: x402
  labels:
    app: job-broker
spec:
  # Single replica by design: SQLite single-writer, local-path PV pins to
  # one node anyway. Recreate avoids two writers during a roll.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: job-broker
  template:
    metadata:
      labels:
        app: job-broker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: job-broker
          # :__OBOL_IMAGE__ → :GitCommit@sha256:… at apply (internal/images).
          image: ghcr.io/obolnetwork/job-broker:__OBOL_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --listen=:8090
            - --db=/data/jobs.db
          env:
            # Same shared secret the verifier signs with (F1). When set, the
            # broker requires a valid X-Obol-Broker-Sig on every submit.
            - name: JOB_BROKER_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: x402-secrets
                  key: JOB_BROKER_HMAC_SECRET
                  optional: true
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: job-broker-data
---
apiVersion: v1
kind: Service
metadata:
  name: job-broker
  namespace: x402
  labels:
    app: job-broker
spec:
  selector:
    app: job-broker
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
# job-broker trusts the X-Obol-Upstream-* headers on every request it
# receives to know where to replay it — it is not itself capable of
# re-verifying payment. Without this policy any in-cluster pod could POST
# straight to job-broker.x402.svc with forged upstream headers (SSRF /
# free-compute against whatever upstream it names). Restrict ingress to
# only the x402-verifier pods, which are the sole intended caller (F1).
# Egress is intentionally left unrestricted: the broker must be able to
# reach arbitrary seller upstreams by design.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: job-broker
  namespace: x402
spec:
  podSelector:
    matchLabels:
      app: job-broker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: x402-verifier
      ports:
        - protocol: TCP
          port: 8090
