---
# x402 runtime components:
# - x402-verifier: shared seller-owned x402 gateway (and legacy /verify endpoint)
# - serviceoffer-controller: control-plane reconciler for ServiceOffer child resources
# - x402-escrow: ServiceBounty escrow facilitator (verify/hold Permit2 vouchers,
#   settle permitTransferFrom on capture). ClusterIP-internal ONLY — never
#   routed through Traefik or the tunnel.
apiVersion: v1
kind: Namespace
metadata:
  name: x402
  labels:
    # Pod Security Standards: Restricted profile enforced at admission.
    # Future Deployment edits that omit the per-pod securityContext will be
    # rejected by the apiserver. Both x402-verifier and serviceoffer-controller
    # run as non-root with all caps dropped, seccomp=RuntimeDefault, and
    # readOnlyRootFilesystem.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Static gateway settings plus optional manual routes. In cluster mode the
# gateway merges these with dynamic routes derived from ready ServiceOffers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: x402-pricing
  namespace: x402
data:
  pricing.yaml: |
    wallet: ""
    chain: "base"
    facilitatorURL: "https://x402.gcp.obol.tech"
    # verifyOnly applies to the legacy /verify endpoint only. The shared seller
    # gateway path always settles after upstream success.
    verifyOnly: true
    routes: []

---
# CA certificates for outbound TLS (e.g. x402.gcp.obol.tech).
# The verifier image is minimal and lacks a system CA bundle; this
# ConfigMap is populated at deploy time from the host cert store.
# Created by: kubectl create configmap ca-certificates -n x402 \
#   --from-file=ca-certificates.crt=/etc/ssl/certs/ca-certificates.crt
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-certificates
  namespace: x402
data: {}

---
apiVersion: v1
kind: Secret
metadata:
  name: x402-secrets
  namespace: x402
type: Opaque
stringData:
  WALLET_ADDRESS: ""
  # Stripe secret key for MPP credit-card (stripe.charge) offers. Empty on a
  # crypto-only stack; populate it (e.g. `kubectl -n x402 patch secret
  # x402-secrets --type merge -p '{"stringData":{"STRIPE_SECRET_KEY":"sk_live_..."}}'`)
  # to let the verifier authorize/capture card PaymentIntents. See README
  # "Credit-card payments (MPP)".
  STRIPE_SECRET_KEY: ""

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x402-verifier
  namespace: x402

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serviceoffer-controller
  namespace: x402

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: x402-verifier
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["litellm-secrets", "hermes-api-server"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: x402-verifier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: x402-verifier
subjects:
  - kind: ServiceAccount
    name: x402-verifier
    namespace: x402

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: serviceoffer-controller
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["registrationrequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["registrationrequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["agentidentities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["agentidentities/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests/status"]
    verbs: ["get", "update", "patch"]
  # ServiceBounty demand-side reconcile: watch + finalizer updates + status.
  # The controller never CREATES bounties (posters do), and the bounty pass
  # creates no routes/Middleware/Secrets — a bounty must never become ingress.
  - apiGroups: ["obol.org"]
    resources: ["servicebounties"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["servicebounties/status"]
    verbs: ["get", "update", "patch"]
  # Evaluator pool: the controller READS enrollments for panel selection and
  # writes only the controller-owned ladder STATE (status). It never creates
  # or deletes enrollments — evaluators do.
  - apiGroups: ["obol.org"]
    resources: ["evaluatorenrollments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["obol.org"]
    resources: ["evaluatorenrollments/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["agents/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  # Per-agent runtime resources written by the Agent reconciler.
  # ServiceAccount + PVC are namespace-scoped child resources.
  #
  # Secrets: the reconciler touches exactly three, by name:
  #   - litellm-secrets        get               (read LITELLM_MASTER_KEY, ns llm)
  #   - hermes-api-server      get/delete/create (mint the agent API token)
  #   - remote-signer-keystore get/delete/create (mint the agent wallet keystore)
  # Secrets are create-only in the reconciler (isCreateOnlyKind): the API token
  # is preserved, not rotated, and the keystore is minted once and never
  # reshaped, so no `update`/`patch` verb is needed. `litellm-secrets` is
  # get-only; delete is confined to the two per-agent Secret names that teardown
  # owns. `create` is split into its own rule below: resourceNames cannot scope
  # create, and agent namespaces are minted dynamically, so create stays
  # namespace-wide. That is an integrity surface only.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["hermes"]
    verbs: ["get", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: ["hermes-data"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["litellm-secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["hermes-api-server", "remote-signer-keystore"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "create", "update", "patch", "delete"]
  # Agent-namespace isolation: the controller renders an agent-isolation
  # NetworkPolicy alongside every Agent's primitives (agent_render.go).
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["referencegrants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: serviceoffer-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: serviceoffer-controller
subjects:
  - kind: ServiceAccount
    name: serviceoffer-controller
    namespace: x402

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-verifier
  namespace: x402
  labels:
    app: x402-verifier
spec:
  # Single replica — verifier holds per-pod metric registries and per-pod
  # informer caches; multiple replicas produce metric series drift across
  # ServiceMonitor scrape rotations and the pruneSeriesNotIn GC (metrics.go)
  # becomes inconsistent. Single-node k3d gains no HA from 2 replicas.
  replicas: 1
  selector:
    matchLabels:
      app: x402-verifier
  template:
    metadata:
      labels:
        app: x402-verifier
    spec:
      serviceAccountName: x402-verifier
      # PSS Restricted: pod-level identity.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifier
          image: ghcr.io/obolnetwork/x402-verifier:d16d167@sha256:1d501bbaa14cd3bfc37cffa47c1c8d19a5743e86cb6066bc73f3197b89ca0abf
          imagePullPolicy: IfNotPresent
          # PSS Restricted: per-container hardening. Verifier is a Go binary
          # reading two RO ConfigMaps; no writeable rootfs paths required.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          args:
            - --config=/config/pricing.yaml
            - --listen=:8080
            - --route-source=kube
          env:
            # MPP credit-card (Stripe) settlement key. Empty unless card offers
            # are in use; optional=true keeps the verifier starting on
            # crypto-only stacks where the key is unset.
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: x402-secrets
                  key: STRIPE_SECRET_KEY
                  optional: true
          volumeMounts:
            - name: pricing-config
              mountPath: /config
              readOnly: true
            - name: ca-certs
              mountPath: /etc/ssl/certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: pricing-config
          configMap:
            name: x402-pricing
            items:
              - key: pricing.yaml
                path: pricing.yaml
        - name: ca-certs
          configMap:
            name: ca-certificates
            optional: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceoffer-controller
  namespace: x402
  labels:
    app: serviceoffer-controller
spec:
  # Single replica by default; bumping to 2+ is now safe — leader election
  # (client-go Lease in this namespace) prevents split-brain on the reconcile
  # loop and the resulting double on-chain ERC-8004 registration.
  replicas: 1
  selector:
    matchLabels:
      app: serviceoffer-controller
  template:
    metadata:
      labels:
        app: serviceoffer-controller
    spec:
      serviceAccountName: serviceoffer-controller
      # PSS Restricted: pod-level identity. Paired with Dockerfile
      # FROM gcr.io/distroless/static-debian12:nonroot which default-runs
      # as UID/GID 65532. Container escape via a Go-runtime CVE on a
      # UID-0 / no-seccomp / no-cap-drop / RW-rootfs container was the
      # easiest path to host pivot on k3s single-node; this closes it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # MUST be an image whose reconciler treats Secret as create-only
          # (isCreateOnlyKind includes "Secret"). The ClusterRole above grants
          # NO secrets update/patch verb, so a controller that Updates the
          # per-agent hermes-api-server / remote-signer-keystore Secrets on
          # re-reconcile 403s and per-agent provisioning never converges. The
          # prior pin (f5d94fc) predated that source change and shipped the
          # bug; b39bcaa (post-rc10 main) carries it, and also ships PR #590's
          # actionable pending-registration status message.
          # See TestServiceOfferControllerImage_CarriesSecretCreateOnlyFix.
          image: ghcr.io/obolnetwork/serviceoffer-controller:d16d167@sha256:ab2bc596b0c2b40664519d01e37aea349a6df22dd1b4ed5e44c1c9e1fcf89519
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # ServiceBounty escrow seam. The escrow endpoint + credential come
            # ONLY from controller env (never from CR spec or annotations) —
            # see newBountyEscrowGateway. The controller holds no keys: it is
            # a bounded release trigger against the escrow facilitator.
            - name: OBOL_BOUNTY_ESCROW_URL
              value: "http://x402-escrow.x402.svc.cluster.local:8403"
            - name: OBOL_BOUNTY_ESCROW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: x402-escrow
                  key: token
                  optional: true
          args: []
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              # Bumped from 256Mi after adding the Agent informer + agent
              # reconciler — the additional shared cache + workqueue + the
              # in-controller keystore generation pushed steady-state past
              # 256Mi and triggered OOMKilled restart loops.
              memory: 512Mi

---
# x402-escrow: the ServiceBounty escrow facilitator. Holds poster-signed
# Permit2 batch-transfer vouchers (reserve), settles permitTransferFrom
# on-chain (capture), drops holds store-only (void).
#
# Security posture:
#   - ClusterIP-internal ONLY. No Traefik HTTPRoute, no Middleware, no tunnel
#     exposure — the only callers are the serviceoffer-controller (via
#     OBOL_BOUNTY_ESCROW_URL) and in-cluster operators.
#   - The serviceoffer-controller never signs and holds no keys; the escrow
#     settlement key/credentials live ONLY in the optional `x402-escrow`
#     Secret consumed here (keys: `token` = bearer auth for POST /escrow/*,
#     `key` = hex settlement private key). Both are optional: with no token
#     the routes are unauthenticated (dev); with no key, capture returns 503
#     while reserve/void keep working.
#   - State is an emptyDir: escrow entries are vouchers + receipts, and a
#     voucher lost PRE-capture only means the poster re-attaches it (reserve
#     is idempotent and re-runs from the obol.org/*-voucher annotations).
#     Captured receipts are also recorded on-chain, so replay after pod churn
#     re-converges from the chain + annotation channel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-escrow
  namespace: x402
  labels:
    app: x402-escrow
spec:
  # Single replica: the file-backed store serializes per-id operations
  # in-process; multiple replicas would race reserve/capture on the same id.
  replicas: 1
  selector:
    matchLabels:
      app: x402-escrow
  template:
    metadata:
      labels:
        app: x402-escrow
    spec:
      # PSS Restricted: pod-level identity, same posture as the verifier.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: escrow
          # Pinned like the sibling images in this file. The publish workflow
          # adds the @sha256 digest on the first image-bump PR (Renovate);
          # under OBOL_DEVELOPMENT the pin is rewritten to the local dev tag
          # (internal/defaults.rewriteDevDigestPins, lockstep with
          # internal/stack.baseLocalImages).
          image: ghcr.io/obolnetwork/x402-escrow:04bebbc
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8403
              protocol: TCP
          args:
            - --listen=:8403
          env:
            # Bearer token for POST /escrow/* (reserve/capture/void). Empty =
            # unauthenticated (dev-only; the controller gateway symmetrically
            # omits the Authorization header when its token is empty).
            - name: OBOL_ESCROW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: x402-escrow
                  key: token
                  optional: true
            # Hex settlement key (the Permit2 voucher spender). Optional:
            # without it capture returns 503 and vouchers cannot be
            # spender-bound, but voucher-less reserve/void still work.
            - name: OBOL_ESCROW_KEY
              valueFrom:
                secretKeyRef:
                  name: x402-escrow
                  key: key
                  optional: true
            - name: OBOL_ESCROW_RPC_BASE
              value: "http://erpc.erpc.svc.cluster.local/rpc"
            # File-backed JSON store on an emptyDir: losing it pre-capture
            # only means re-attaching the voucher (see header comment).
            - name: OBOL_ESCROW_STATE_DIR
              value: "/data"
          volumeMounts:
            - name: escrow-state
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: escrow-state
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: x402-escrow
  namespace: x402
  labels:
    app: x402-escrow
spec:
  type: ClusterIP
  selector:
    app: x402-escrow
  ports:
    - name: http
      port: 8403
      targetPort: http
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: x402-verifier
  namespace: x402
  labels:
    app: x402-verifier
spec:
  type: ClusterIP
  selector:
    app: x402-verifier
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# ServiceMonitor for x402-verifier — scrapes the stable Service endpoint
# rather than per-pod IPs (which is what a PodMonitor would do). Lives
# alongside the Service it observes so adding/changing the port or
# selector here is a single-file change.
#
# Picked up by kube-prometheus-stack via the `release: monitoring` label
# (configured in values/monitoring.yaml.gotmpl as the serviceMonitorSelector).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: x402-verifier
  namespace: x402
  labels:
    release: monitoring
    app: x402-verifier
spec:
  selector:
    matchLabels:
      app: x402-verifier
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
