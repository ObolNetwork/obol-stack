---
# x402 runtime components:
# - x402-verifier: shared seller-owned x402 gateway (and legacy /verify endpoint)
# - serviceoffer-controller: control-plane reconciler for ServiceOffer child resources
apiVersion: v1
kind: Namespace
metadata:
  name: x402
  labels:
    # Pod Security Standards: Restricted profile enforced at admission.
    # Future Deployment edits that omit the per-pod securityContext will be
    # rejected by the apiserver. Both x402-verifier and serviceoffer-controller
    # run as non-root with all caps dropped, seccomp=RuntimeDefault, and
    # readOnlyRootFilesystem.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Static gateway settings plus optional manual routes. In cluster mode the
# gateway merges these with dynamic routes derived from ready ServiceOffers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: x402-pricing
  namespace: x402
data:
  pricing.yaml: |
    wallet: ""
    chain: "base"
    facilitatorURL: "https://x402.gcp.obol.tech"
    # verifyOnly applies to the legacy /verify endpoint only. The shared seller
    # gateway path always settles after upstream success.
    verifyOnly: true
    routes: []

---
# CA certificates for outbound TLS (e.g. x402.gcp.obol.tech).
# The verifier image is minimal and lacks a system CA bundle; this
# ConfigMap is populated at deploy time from the host cert store.
# Created by: kubectl create configmap ca-certificates -n x402 \
#   --from-file=ca-certificates.crt=/etc/ssl/certs/ca-certificates.crt
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-certificates
  namespace: x402
data: {}

---
apiVersion: v1
kind: Secret
metadata:
  name: x402-secrets
  namespace: x402
type: Opaque
stringData:
  WALLET_ADDRESS: ""

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x402-verifier
  namespace: x402

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serviceoffer-controller
  namespace: x402

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: x402-verifier
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["litellm-secrets", "hermes-api-server"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: x402-verifier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: x402-verifier
subjects:
  - kind: ServiceAccount
    name: x402-verifier
    namespace: x402

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: serviceoffer-controller
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["registrationrequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["registrationrequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["agentidentities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["agentidentities/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["obol.org"]
    resources: ["agents/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  # Per-agent runtime resources written by the Agent reconciler.
  # ServiceAccount + PVC are namespace-scoped child resources; secrets
  # are limited to creating the agent's API-server token (random) and
  # reading litellm-secrets for the master key. Reading all secrets
  # cluster-wide is intentionally not granted; the agent reconciler only
  # needs read access on litellm-secrets, but the dynamic client makes
  # narrowing harder than it's worth for v1.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["referencegrants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Scoped to litellm-secrets only. Needed to read LITELLM_MASTER_KEY for
  # hot-add/hot-delete via the LiteLLM HTTP API (no pod restart — preserves
  # the x402-buyer sidecar's pod-local consumed-auth state).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["litellm-secrets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: serviceoffer-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: serviceoffer-controller
subjects:
  - kind: ServiceAccount
    name: serviceoffer-controller
    namespace: x402

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-verifier
  namespace: x402
  labels:
    app: x402-verifier
spec:
  # Single replica — verifier holds per-pod metric registries and per-pod
  # informer caches; multiple replicas produce metric series drift across
  # ServiceMonitor scrape rotations and the pruneSeriesNotIn GC (metrics.go)
  # becomes inconsistent. Single-node k3d gains no HA from 2 replicas.
  replicas: 1
  selector:
    matchLabels:
      app: x402-verifier
  template:
    metadata:
      labels:
        app: x402-verifier
    spec:
      serviceAccountName: x402-verifier
      # PSS Restricted: pod-level identity.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifier
          image: ghcr.io/obolnetwork/x402-verifier:46e63fd@sha256:a8cd7946884c9a702b5cfcfad28d1f5eac1037899303eb4e0157e3ffab7a572c
          imagePullPolicy: IfNotPresent
          # PSS Restricted: per-container hardening. Verifier is a Go binary
          # reading two RO ConfigMaps; no writeable rootfs paths required.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          args:
            - --config=/config/pricing.yaml
            - --listen=:8080
            - --route-source=kube
          volumeMounts:
            - name: pricing-config
              mountPath: /config
              readOnly: true
            - name: ca-certs
              mountPath: /etc/ssl/certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: pricing-config
          configMap:
            name: x402-pricing
            items:
              - key: pricing.yaml
                path: pricing.yaml
        - name: ca-certs
          configMap:
            name: ca-certificates
            optional: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceoffer-controller
  namespace: x402
  labels:
    app: serviceoffer-controller
spec:
  # Single replica by default; bumping to 2+ is now safe — leader election
  # (client-go Lease in this namespace) prevents split-brain on the reconcile
  # loop and the resulting double on-chain ERC-8004 registration.
  replicas: 1
  selector:
    matchLabels:
      app: serviceoffer-controller
  template:
    metadata:
      labels:
        app: serviceoffer-controller
    spec:
      serviceAccountName: serviceoffer-controller
      # PSS Restricted: pod-level identity. Paired with Dockerfile
      # FROM gcr.io/distroless/static-debian12:nonroot which default-runs
      # as UID/GID 65532. Container escape via a Go-runtime CVE on a
      # UID-0 / no-seccomp / no-cap-drop / RW-rootfs container was the
      # easiest path to host pivot on k3s single-node; this closes it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/obolnetwork/serviceoffer-controller:b13254e@sha256:f83bd7e55bdc5d87edb49c04e7fd9257097364e2d43e769c19dfd7c8b47d07af
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args: []
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              # Bumped from 256Mi after adding the Agent informer + agent
              # reconciler — the additional shared cache + workqueue + the
              # in-controller keystore generation pushed steady-state past
              # 256Mi and triggered OOMKilled restart loops.
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: x402-verifier
  namespace: x402
  labels:
    app: x402-verifier
spec:
  type: ClusterIP
  selector:
    app: x402-verifier
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# ServiceMonitor for x402-verifier — scrapes the stable Service endpoint
# rather than per-pod IPs (which is what a PodMonitor would do). Lives
# alongside the Service it observes so adding/changing the port or
# selector here is a single-file change.
#
# Picked up by kube-prometheus-stack via the `release: monitoring` label
# (configured in values/monitoring.yaml.gotmpl as the serviceMonitorSelector).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: x402-verifier
  namespace: x402
  labels:
    release: monitoring
    app: x402-verifier
spec:
  selector:
    matchLabels:
      app: x402-verifier
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
