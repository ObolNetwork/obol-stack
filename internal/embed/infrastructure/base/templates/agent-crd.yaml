---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: agents.obol.org
spec:
  group: obol.org
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - ag
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.runtime
      name: Runtime
      type: string
    - jsonPath: .status.pinnedModel
      name: Model
      type: string
    - jsonPath: .status.walletAddress
      name: Wallet
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Agent is the declarative spec for an Obol Stack agent (Hermes today,
          OpenClaw later). Decouples agent lifecycle from selling: `obol sell
          agent <name>` references an existing Agent rather than provisioning
          one inline. Internal manager agents with RBAC can also create Agent
          resources to spawn sub-agents.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              disabledToolsets:
                description: |-
                  Hermes agent.disabled_toolsets. Nil = ["memory","web"] (historical
                  default). Explicit empty list disables none.
                items:
                  maxLength: 64
                  type: string
                maxItems: 32
                type: array
              maxConcurrentRuns:
                description: |-
                  Hermes gateway.api_server.max_concurrent_runs. Nil = omit the
                  gateway block (Hermes internal default, 10). 0 disables the
                  in-process cap — edge concurrency middleware governs instead.
                maximum: 10000
                minimum: 0
                type: integer
              maxTurns:
                description: Hermes agent.max_turns. Nil = 30 (historical sub-agent
                  default).
                maximum: 10000
                minimum: 1
                type: integer
              mcpServers:
                description: |-
                  MCP servers rendered into Hermes config.yaml under mcp_servers.
                  Empty/omitted: no mcp_servers block (byte-identical to pre-field config).
                items:
                  description: |-
                    MCPServer is one Hermes MCP server entry (stdio transport). Env values
                    may use ${VAR} interpolation; Hermes resolves them in-pod at runtime —
                    the controller does not expand them.
                  properties:
                    args:
                      description: Arguments passed to Command. Omitted from YAML
                        when empty.
                      items:
                        type: string
                      maxItems: 64
                      type: array
                    command:
                      description: Command to launch the MCP server process.
                      maxLength: 256
                      minLength: 1
                      type: string
                    env:
                      additionalProperties:
                        type: string
                      description: |-
                        Environment variables for the MCP process. Values may contain
                        ${VAR} placeholders resolved by Hermes in-pod (not by the controller).
                      maxProperties: 64
                      type: object
                    name:
                      description: Server name used as the key under mcp_servers in
                        config.yaml.
                      maxLength: 64
                      minLength: 1
                      pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                      type: string
                    timeout:
                      description: Optional process timeout in seconds. Omitted from
                        YAML when nil.
                      minimum: 1
                      type: integer
                  required:
                  - command
                  - name
                  type: object
                maxItems: 32
                type: array
              model:
                description: |-
                  LiteLLM model name to pin. Empty = controller picks cluster
                  top-of-rank on first deploy and writes status.pinnedModel.
                maxLength: 256
                type: string
              modelProvider:
                description: |-
                  Hermes model provider. Empty or "custom" keeps the cluster LiteLLM
                  path (base_url + api_key). Other values (e.g. "xai-oauth") omit those
                  and resolve credentials in-pod.
                maxLength: 64
                type: string
              objective:
                description: |-
                  Operator-supplied objective text. Substituted into the SOUL.md
                  template by the seeder on first write. Agent owns SOUL.md after that.
                maxLength: 4096
                type: string
              runtime:
                default: hermes
                description: Agent runtime (only hermes today; openclaw planned).
                enum:
                - hermes
                type: string
              skills:
                description: |-
                  Allow-listed skills written to the per-agent skills dir on first
                  reconcile. Agent can edit afterwards; this is a seed, not a sandbox.
                items:
                  maxLength: 64
                  pattern: ^[a-z0-9][a-z0-9-]*$
                  type: string
                maxItems: 64
                type: array
              wallet:
                properties:
                  create:
                    default: false
                    description: |-
                      Provision a per-namespace remote-signer keystore. Address is
                      published in status.walletAddress.
                    type: boolean
                type: object
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned.
                      format: date-time
                      type: string
                    message:
                      description: Human-readable message with details.
                      type: string
                    reason:
                      description: Machine-readable reason for the condition.
                      type: string
                    status:
                      description: Status of the condition.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type.
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              endpoint:
                description: |-
                  Cluster-internal URL for the agent runtime (e.g.
                  http://hermes.agent-quant.svc.cluster.local:8642).
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Pending | Provisioning | Ready | Failed
                type: string
              pinnedModel:
                description: |-
                  Actual model the agent is using (= spec.model when set, otherwise
                  the auto-picked top-of-rank).
                type: string
              walletAddress:
                description: Agent's signing address when wallet.create=true. Empty
                  otherwise.
                pattern: ^(0x[0-9a-fA-F]{40})?$
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
