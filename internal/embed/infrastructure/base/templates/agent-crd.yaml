---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: agents.obol.org
spec:
  group: obol.org
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - ag
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.runtime
      name: Runtime
      type: string
    - jsonPath: .status.pinnedModel
      name: Model
      type: string
    - jsonPath: .status.walletAddress
      name: Wallet
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Agent is the declarative spec for an Obol Stack agent (Hermes today,
          OpenClaw later). Decouples agent lifecycle from selling: `obol sell
          agent <name>` references an existing Agent rather than provisioning
          one inline. Internal manager agents with RBAC can also create Agent
          resources to spawn sub-agents.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              mcpServers:
                description: |-
                  MCPServers registers native MCP servers in the agent's Hermes
                  config (mcp_servers:). Hermes discovers each server's tools and
                  exposes them as first-class tools. stdio (command+args) for a
                  local server, or url for a remote one.
                items:
                  properties:
                    args:
                      items:
                        type: string
                      maxItems: 64
                      type: array
                    command:
                      maxLength: 512
                      type: string
                    env:
                      additionalProperties:
                        type: string
                      type: object
                    name:
                      maxLength: 64
                      pattern: ^[a-z0-9][a-z0-9-]*$
                      type: string
                    transport:
                      maxLength: 16
                      type: string
                    url:
                      maxLength: 512
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 32
                type: array
              model:
                description: |-
                  LiteLLM model name to pin. Empty = controller picks cluster
                  top-of-rank on first deploy and writes status.pinnedModel.
                maxLength: 256
                type: string
              objective:
                description: |-
                  Operator-supplied objective text. Substituted into the SOUL.md
                  template by the seeder on first write. Agent owns SOUL.md after that.
                maxLength: 4096
                type: string
              runtime:
                default: hermes
                description: Agent runtime (only hermes today; openclaw planned).
                enum:
                - hermes
                type: string
              skills:
                description: |-
                  Allow-listed skills written to the per-agent skills dir on first
                  reconcile. Agent can edit afterwards; this is a seed, not a sandbox.
                items:
                  maxLength: 64
                  pattern: ^[a-z0-9][a-z0-9-]*$
                  type: string
                maxItems: 64
                type: array
              wallet:
                properties:
                  create:
                    default: false
                    description: |-
                      Provision a per-namespace remote-signer keystore. Address is
                      published in status.walletAddress.
                    type: boolean
                type: object
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned.
                      format: date-time
                      type: string
                    message:
                      description: Human-readable message with details.
                      type: string
                    reason:
                      description: Machine-readable reason for the condition.
                      type: string
                    status:
                      description: Status of the condition.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type.
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              endpoint:
                description: |-
                  Cluster-internal URL for the agent runtime (e.g.
                  http://hermes.agent-quant.svc.cluster.local:8642).
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Pending | Provisioning | Ready | Failed
                type: string
              pinnedModel:
                description: |-
                  Actual model the agent is using (= spec.model when set, otherwise
                  the auto-picked top-of-rank).
                type: string
              walletAddress:
                description: Agent's signing address when wallet.create=true. Empty
                  otherwise.
                pattern: ^(0x[0-9a-fA-F]{40})?$
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
