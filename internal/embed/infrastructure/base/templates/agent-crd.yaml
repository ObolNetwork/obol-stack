---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: agents.obol.org
spec:
  group: obol.org
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - ag
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.runtime
      name: Runtime
      type: string
    - jsonPath: .status.pinnedModel
      name: Model
      type: string
    - jsonPath: .status.walletAddress
      name: Wallet
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Agent is the declarative spec for an Obol Stack agent (Hermes today,
          OpenClaw later). Decouples agent lifecycle from selling: `obol sell
          agent <name>` references an existing Agent rather than provisioning
          one inline. Internal manager agents with RBAC can also create Agent
          resources to spawn sub-agents.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              model:
                description: |-
                  LiteLLM model name to pin. Empty = controller picks cluster
                  top-of-rank on first deploy and writes status.pinnedModel.
                maxLength: 256
                type: string
              objective:
                description: |-
                  Operator-supplied objective text. Substituted into the SOUL.md
                  template by the seeder on first write. Agent owns SOUL.md after that.
                maxLength: 4096
                type: string
              runtime:
                default: hermes
                description: Agent runtime (only hermes today; openclaw planned).
                enum:
                - hermes
                type: string
              skills:
                description: |-
                  Allow-listed skills written to the per-agent skills dir on first
                  reconcile. Agent can edit afterwards; this is a seed, not a sandbox.
                items:
                  maxLength: 64
                  pattern: ^[a-z0-9][a-z0-9-]*$
                  type: string
                maxItems: 64
                type: array
              wallet:
                properties:
                  create:
                    default: false
                    description: |-
                      Provision a per-namespace remote-signer keystore. Address is
                      published in status.walletAddress.
                    type: boolean
                type: object
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: |-
                  Cluster-internal URL for the agent runtime (e.g.
                  http://hermes.agent-quant.svc.cluster.local:8642).
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Pending | Provisioning | Ready | Failed
                type: string
              pinnedModel:
                description: |-
                  Actual model the agent is using (= spec.model when set, otherwise
                  the auto-picked top-of-rank).
                type: string
              walletAddress:
                description: Agent's signing address when wallet.create=true. Empty
                  otherwise.
                pattern: ^(0x[0-9a-fA-F]{40})?$
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
