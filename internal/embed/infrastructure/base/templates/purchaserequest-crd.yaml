---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: purchaserequests.obol.org
spec:
  group: obol.org
  names:
    kind: PurchaseRequest
    listKind: PurchaseRequestList
    plural: purchaserequests
    shortNames:
    - pr
    singular: purchaserequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.endpoint
      name: Endpoint
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .spec.payment.price
      name: Price
      type: string
    - jsonPath: .status.remaining
      name: Remaining
      type: integer
    - jsonPath: .status.spent
      name: Spent
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PurchaseRequest is the buyer-side request for pre-signed x402 auths
          against a remote inference endpoint.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              autoRefill:
                description: |-
                  PurchaseAutoRefill drives the agent-managed auto-refill policy for a
                  PurchaseRequest. The reconciler reads MaxTotal + MaxSpendPerDay as
                  budget caps before signing more auths; without these fields populated
                  the agent will not auto-refill beyond the initial Count.
                properties:
                  count:
                    description: Number of auths to sign on refill.
                    minimum: 1
                    type: integer
                  enabled:
                    default: false
                    type: boolean
                  maxSpendPerDay:
                    description: Max micro-USDC spend per day.
                    type: string
                  maxTotal:
                    description: Cap total auths ever signed.
                    type: integer
                  threshold:
                    description: Refill when remaining < threshold.
                    minimum: 0
                    type: integer
                type: object
              count:
                description: Number of pre-signed auths to create.
                maximum: 2500
                minimum: 1
                type: integer
              endpoint:
                description: Full URL to the x402-gated inference endpoint.
                type: string
              model:
                description: Remote model ID (used as paid/<model> in LiteLLM).
                type: string
              payment:
                properties:
                  asset:
                    description: ERC-20 contract address.
                    type: string
                  assetDecimals:
                    description: Token decimals in atomic units.
                    format: int64
                    type: integer
                  assetSymbol:
                    description: Human-friendly token symbol (e.g. USDC, OBOL).
                    type: string
                  assetTransferMethod:
                    description: x402 transfer method used for this asset.
                    type: string
                  eip712Name:
                    description: EIP-712 domain name used for signing.
                    type: string
                  eip712Version:
                    description: EIP-712 domain version used for signing.
                    type: string
                  network:
                    type: string
                  payTo:
                    type: string
                  price:
                    description: Atomic token units per request.
                    type: string
                required:
                - asset
                - network
                - payTo
                - price
                type: object
              preSignedAuths:
                description: Pre-signed x402 payments (legacy ERC-3009 auths still
                  supported).
                items:
                  description: |-
                    PreSignedAuth carries a pre-signed x402 payment authorization. The
                    Payment map is opaque (forwarded verbatim to the buyer sidecar / x402
                    facilitator) which can't be deep-copied by controller-gen; DeepCopy
                    methods for this type are hand-written in deepcopy_manual.go.
                  properties:
                    from:
                      type: string
                    id:
                      type: string
                    nonce:
                      type: string
                    payment:
                      x-kubernetes-preserve-unknown-fields: true
                    signature:
                      type: string
                    to:
                      type: string
                    validAfter:
                      type: string
                    validBefore:
                      type: string
                    value:
                      type: string
                  type: object
                type: array
            required:
            - count
            - endpoint
            - model
            - payment
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              probedAt:
                format: date-time
                type: string
              probedPrice:
                type: string
              publicModel:
                description: LiteLLM model name (paid/<model>).
                type: string
              remaining:
                type: integer
              signerAddress:
                type: string
              spent:
                type: integer
              totalSigned:
                type: integer
              totalSpent:
                type: string
              walletBalance:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
