---
# LLM foundation services
#
# This deploys:
# - A ClusterIP Service + Endpoints "ollama" that routes to the host's Ollama server
# - LiteLLM as an OpenAI-compatible gateway / router over providers
#
# Design notes:
# - No in-cluster Ollama is deployed; the host is expected to run Ollama
#   (or another OpenAI-compatible server) on port 11434.
# - The ollama Service abstracts host resolution via ClusterIP + headless Endpoints:
#     k3d  → host IP resolved at init (e.g. 192.168.65.254 on macOS Docker Desktop)
#     k3s  → 127.0.0.1 (k3s runs directly on the host)
# - Using ClusterIP+Endpoints instead of ExternalName for Traefik Gateway API
#   compatibility (ExternalName services are rejected as HTTPRoute backends).
# - LiteLLM starts with an empty model_list; models are added via `obol model setup`.
apiVersion: v1
kind: Namespace
metadata:
  name: llm

---
# ClusterIP Service + Endpoints: routes ollama.llm.svc.cluster.local → host Ollama.
# The endpoint IP is resolved during `obol stack init` via the {{OLLAMA_HOST_IP}} placeholder.
# Using ClusterIP+Endpoints instead of ExternalName for Traefik Gateway API compatibility.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
  labels:
    app: ollama
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      protocol: TCP
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: llm
  labels:
    app: ollama
subsets:
  - addresses:
      - ip: "{{OLLAMA_HOST_IP}}"
    ports:
      - name: http
        port: 11434
        protocol: TCP

---
# LiteLLM configuration: empty model_list by default.
# Models are added via `obol model setup` which patches this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llm
data:
  config.yaml: |
    model_list:
      - model_name: "paid/*"
        litellm_params:
          model: "openai/*"
          api_base: "http://127.0.0.1:8402/v1"
          api_key: "unused"
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    litellm_settings:
      cache: false
      drop_params: true

---
# Buyer ConfigMaps — the serviceoffer-controller writes one <upstreamKey>.json
# entry per PurchaseRequest. This matches x402-buyer --config-dir/--auths-dir
# loading and avoids the old single shared config.json/auths.json merge point.
apiVersion: v1
kind: ConfigMap
metadata:
  name: x402-buyer-config
  namespace: llm
data: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: x402-buyer-auths
  namespace: llm
data: {}

---
# Secret for LiteLLM master key and cloud provider API keys.
# Master key is unique per cluster ({{CLUSTER_ID}} resolved at init).
# Provider keys start empty; patched via `obol model setup`.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: llm
type: Opaque
stringData:
  LITELLM_MASTER_KEY: "sk-obol-{{CLUSTER_ID}}"
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llm
  labels:
    app: litellm
spec:
  # Keep a single LiteLLM + x402-buyer pod while buyer auth consumption state
  # is local to the sidecar pod. Scale this back out only after consumed auth
  # state is shared or auth pools are sharded per replica.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        secret.reloader.stakater.com/reload: "litellm-secrets"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: litellm
          # Obol fork of LiteLLM with config-only model management API.
          # No Postgres required — /model/new and /model/delete work via
          # in-memory router + config.yaml persistence.
          # Source: https://github.com/ObolNetwork/litellm
          image: ghcr.io/obolnetwork/litellm:sha-c16b156
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: litellm-secrets
          env:
            - name: STORE_MODEL_IN_DB
              value: "false"
            - name: DISABLE_SCHEMA_UPDATE
              value: "true"
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
          startupProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: x402-buyer
          # TODO(image-pin): replace :latest with a digest (ghcr.io/obolnetwork/x402-buyer@sha256:…)
          # or the short-SHA tag pattern used for litellm above (sha-<short>).
          # :latest drift between the deployed sidecar and the main branch is what
          # produced the /v1 vs bare-path 404 debacle in PR #343: the mux was
          # updated to register both paths, but the deployed image still served
          # only /v1/*. See internal/embed/embed_image_pin_test.go.
          image: ghcr.io/obolnetwork/x402-buyer:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config-dir=/config/buyer-config
            - --auths-dir=/config/buyer-auths
            - --state=/state/consumed.json
            - --listen=:8402
          ports:
            - name: buyer-http
              containerPort: 8402
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: buyer-http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: buyer-http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: buyer-config
              mountPath: /config/buyer-config
              readOnly: true
            - name: buyer-auths
              mountPath: /config/buyer-auths
              readOnly: true
            - name: x402-buyer-state
              mountPath: /state
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: buyer-config
          configMap:
            name: x402-buyer-config
            optional: true
        - name: buyer-auths
          configMap:
            name: x402-buyer-auths
            optional: true
        - name: x402-buyer-state
          emptyDir: {}

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
  namespace: llm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: litellm

---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: llm
  labels:
    app: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
