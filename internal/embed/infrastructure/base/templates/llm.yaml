---
# LLM foundation services
#
# This deploys:
# - A ClusterIP Service + Endpoints "ollama" that routes to the host's Ollama server
# - LiteLLM as an OpenAI-compatible gateway / router over providers
#
# Design notes:
# - No in-cluster Ollama is deployed; the host is expected to run Ollama
#   (or another OpenAI-compatible server) on port 11434.
# - The ollama Service abstracts host resolution via ClusterIP + headless Endpoints:
#     k3d  → host IP resolved at init via Docker (host.docker.internal lookup
#            from a transient container; works for Docker Desktop (192.168.65.254),
#            Colima (e.g. 192.168.5.2), and Rancher Desktop)
#     k3s  → 127.0.0.1 (k3s runs directly on the host)
# - Using ClusterIP+Endpoints instead of ExternalName for Traefik Gateway API
#   compatibility (ExternalName services are rejected as HTTPRoute backends).
# - LiteLLM starts with a base paid/* route; provider models are added via
#   `obol model setup`, and purchased remote models are added by the controller.
apiVersion: v1
kind: Namespace
metadata:
  name: llm
  labels:
    # Pod Security Standards: Restricted profile enforced at admission.
    # The litellm pod (litellm + x402-buyer sidecar) runs as non-root with
    # all caps dropped, seccomp=RuntimeDefault, and readOnlyRootFilesystem;
    # write paths are routed to named emptyDir mounts.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# ClusterIP Service + Endpoints: routes ollama.llm.svc.cluster.local → host Ollama.
# The endpoint IP is resolved during `obol stack init` via the {{OLLAMA_HOST_IP}} placeholder.
# Using ClusterIP+Endpoints instead of ExternalName for Traefik Gateway API compatibility.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
  labels:
    app: ollama
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      protocol: TCP
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: llm
  labels:
    app: ollama
subsets:
  - addresses:
      - ip: "{{OLLAMA_HOST_IP}}"
    ports:
      - name: http
        port: 11434
        protocol: TCP

---
# LiteLLM configuration: base paid/* route plus provider and purchased models.
# Models are persisted here so LiteLLM reloads survive pod restarts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llm
data:
  config.yaml: |
    model_list:
      - model_name: "paid/*"
        litellm_params:
          model: "openai/*"
          api_base: "http://127.0.0.1:8402/v1"
          api_key: "unused"
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    litellm_settings:
      cache: false
      drop_params: true

---
# Buyer ConfigMaps — the serviceoffer-controller writes one <upstreamKey>.json
# entry per PurchaseRequest. This matches x402-buyer --config-dir/--auths-dir
# loading and avoids the old single shared config.json/auths.json merge point.
apiVersion: v1
kind: ConfigMap
metadata:
  name: x402-buyer-config
  namespace: llm
data: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: x402-buyer-auths
  namespace: llm
data: {}

---
# Secret for LiteLLM master key. Provider API keys (ANTHROPIC_API_KEY,
# OPENAI_API_KEY, ...) are patched in by `obol model setup` and the
# autoConfigureLLM hook on first up. We deliberately do NOT declare empty
# placeholders here — re-applying this manifest on every `obol stack up`
# would overwrite any keys the user has set, leaving `obol model status`
# in the misleading state of `enabled: true, api_key: false`.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: llm
type: Opaque
stringData:
  LITELLM_MASTER_KEY: "sk-obol-{{CLUSTER_ID}}"

---
# x402-buyer maintains consumed-nonce state in /state/consumed.json.
# Previously this was emptyDir, which lost state on every pod restart
# — the buyer would then attempt to re-spend already-consumed auths
# from the ConfigMap-loaded pool, cascading into 400s from the
# facilitator's nonce protection until a manual buy.py process --all.
# PVC backed by local-path (single-node k3d default storage class)
# gives crash-safety without conversion to StatefulSet.
#
# Deployment strategy: Recreate — RWO PVC can't be mounted by two
# pods, so RollingUpdate's surge would block. Recreate accepts a
# brief gap during rollout (litellm is replicas:1 anyway).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: x402-buyer-state
  namespace: llm
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llm
  labels:
    app: litellm
spec:
  # Keep a single LiteLLM + x402-buyer pod while buyer auth consumption state
  # is local to the sidecar pod. Scale this back out only after consumed auth
  # state is shared or auth pools are sharded per replica.
  replicas: 1
  # Recreate (not RollingUpdate) because the x402-buyer-state PVC is RWO and
  # cannot be co-mounted by an overlapping new pod during surge. Litellm is
  # replicas: 1 so this just trades the (currently maxSurge:1) overlap for a
  # short gap during rollout — acceptable, and unavoidable with RWO storage.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        secret.reloader.stakater.com/reload: "litellm-secrets"
    spec:
      terminationGracePeriodSeconds: 60
      # PSS Restricted: pod-level identity. UID/GID 65532 is the nonroot
      # distroless convention; the Obol LiteLLM fork's working dirs are
      # routed onto emptyDir mounts below so readOnlyRootFilesystem can
      # stay on without breaking Python's tempfile / cache writes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          # Obol fork of LiteLLM with config-only model management API.
          # No Postgres required — /model/new and /model/delete work via
          # in-memory router + config.yaml persistence.
          # Source: https://github.com/ObolNetwork/litellm
          image: ghcr.io/obolnetwork/litellm:sha-c16b156@sha256:9f112b51ac5a57d73cdd54103fb98d24eabaddd8689a9a285884dca6456dc86e
          imagePullPolicy: IfNotPresent
          # PSS Restricted: drop all caps, no privilege escalation, RO rootfs.
          # Python writes are funneled to the emptyDir mounts below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: litellm-secrets
          env:
            - name: STORE_MODEL_IN_DB
              value: "false"
            - name: DISABLE_SCHEMA_UPDATE
              value: "true"
            # Redirect Python / HF / pip cache lookups onto the writeable
            # emptyDir at /home/litellm so readOnlyRootFilesystem=true holds.
            - name: HOME
              value: /home/litellm
            - name: XDG_CACHE_HOME
              value: /home/litellm/.cache
            - name: HF_HOME
              value: /home/litellm/.cache/huggingface
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
            - name: litellm-tmp
              mountPath: /tmp
            - name: litellm-home
              mountPath: /home/litellm
          startupProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: x402-buyer
          # Pinned by sha256 digest (multi-arch manifest list, amd64+arm64)
          # so the deployed sidecar is byte-for-byte identical across QA
          # hosts. The :b13254e tag is preserved for human readability; the
          # digest is authoritative.
          # Previous tag-only pin allowed the local-build path to silently
          # reuse a 5-day-old `:latest` image and ate the release-smoke 503
          # investigation: stale buyer serialized X-PAYMENT with empty
          # authorization fields → facilitator /verify 400 → 503 cascade
          # across flow-08/11/14/13. See internal/embed/embed_image_pin_test.go.
          image: ghcr.io/obolnetwork/x402-buyer:b13254e@sha256:446d730fefbe1860e8b3245289aa8979d765ae977b7f0eaa053543e2468313cb
          imagePullPolicy: IfNotPresent
          # PSS Restricted: Go distroless:nonroot image already runs as
          # UID 65532; only the state dir under /state needs to be writeable
          # and it's already an emptyDir mount.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --config-dir=/config/buyer-config
            - --auths-dir=/config/buyer-auths
            - --state=/state/consumed.json
            - --listen=:8402
          ports:
            - name: buyer-http
              containerPort: 8402
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: buyer-http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: buyer-http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: buyer-config
              mountPath: /config/buyer-config
              readOnly: true
            - name: buyer-auths
              mountPath: /config/buyer-auths
              readOnly: true
            - name: x402-buyer-state
              mountPath: /state
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
            items:
              - key: config.yaml
                path: config.yaml
        # Writable /tmp for Python tempfile / multipart uploads. Sized
        # modestly — LiteLLM streams responses rather than buffering them.
        - name: litellm-tmp
          emptyDir:
            sizeLimit: 128Mi
        # Writable HOME for LiteLLM's pip/HF/XDG cache lookups so the
        # container can run with readOnlyRootFilesystem=true.
        - name: litellm-home
          emptyDir:
            sizeLimit: 256Mi
        - name: buyer-config
          configMap:
            name: x402-buyer-config
            optional: true
        - name: buyer-auths
          configMap:
            name: x402-buyer-auths
            optional: true
        - name: x402-buyer-state
          persistentVolumeClaim:
            claimName: x402-buyer-state

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
  namespace: llm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: litellm

---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: llm
  labels:
    app: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP

---
# PodMonitor for the x402-buyer sidecar — kept as PodMonitor (not
# ServiceMonitor) because the sidecar listens on a per-pod port (8402)
# that is NOT exposed via the litellm Service. Lives alongside the
# Deployment that hosts it so changing the buyer port here is one edit.
#
# Relocated from helmfile.yaml `llm-buyer-podmonitor` bedag/raw release;
# chart layout is now the single source of truth for what ships in the
# llm namespace. The PodMonitor CRD comes from kube-prometheus-stack, so
# `base` declares `needs: [monitoring/monitoring]` in helmfile.yaml to
# guarantee CRD presence before this template applies. Picked up by
# kube-prometheus-stack via the `release: monitoring` label.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: litellm-x402-buyer
  namespace: llm
  labels:
    release: monitoring
    app: litellm
spec:
  selector:
    matchLabels:
      app: litellm
  podMetricsEndpoints:
    - port: buyer-http
      path: /metrics
      interval: 30s
