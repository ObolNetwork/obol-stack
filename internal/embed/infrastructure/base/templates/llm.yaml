---
# LLM foundation services (OKR-1)
#
# This deploys:
# - An ExternalName Service "ollama" that resolves to the host's Ollama server
# - llms.py (LLMSpy) as an OpenAI-compatible gateway / router over providers
#
# Design notes:
# - No in-cluster Ollama is deployed; the host is expected to run Ollama
#   (or another OpenAI-compatible server) on port 11434.
# - The ollama Service abstracts host resolution:
#     k3d  → host.k3d.internal
#     k3s  → resolved at stack init via node IP
# - LLMSpy and all consumers reference ollama.llm.svc.cluster.local:11434,
#   which the ExternalName Service routes to the host.
apiVersion: v1
kind: Namespace
metadata:
  name: llm

---
# ExternalName Service: routes ollama.llm.svc.cluster.local → host Ollama.
# The externalName is resolved during `obol stack init` via the {{OLLAMA_HOST}} placeholder.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
  labels:
    app: ollama
spec:
  type: ExternalName
  externalName: {{OLLAMA_HOST}}
  ports:
    - name: http
      port: 11434
      protocol: TCP

---
# llms.py v3 configuration for Obol Stack:
# - Only enable the Ollama provider (host machine via ollama Service)
# - Default model is glm-4.7-flash
apiVersion: v1
kind: ConfigMap
metadata:
  name: llmspy-config
  namespace: llm
data:
  llms.json: |
    {
      "version": 3,
      "defaults": {
        "headers": {
          "Content-Type": "application/json",
          "User-Agent": "llmspy.org/3.0"
        },
        "text": {
          "model": "glm-4.7-flash",
          "messages": [
            { "role": "user", "content": [{ "type": "text", "text": "" }] }
          ]
        }
      },
      "providers": {
        "ollama": {
          "enabled": true
        }
      }
    }
  providers.json: |
    {
      "ollama": {
        "id": "ollama",
        "npm": "ollama",
        "api": "http://ollama.llm.svc.cluster.local:11434",
        "models": {},
        "all_models": true
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmspy
  namespace: llm
  labels:
    app: llmspy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmspy
  template:
    metadata:
      labels:
        app: llmspy
    spec:
      initContainers:
        # Seed ~/.llms/llms.json from the ConfigMap. llms.py also writes runtime
        # state (e.g. analytics) under ~/.llms, so we keep the directory writable.
        - name: seed-config
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /data
              cp /config/llms.json /data/llms.json
              cp /config/providers.json /data/providers.json
          volumeMounts:
            - name: llmspy-config
              mountPath: /config
              readOnly: true
            - name: llmspy-home
              mountPath: /data
      containers:
        - name: llmspy
          # Official LLMSpy container image (published by upstream).
          # Pin a specific version for reproducibility.
          image: ghcr.io/servicestack/llms:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          command:
            - llms
          args:
            - --config
            - /home/llms/.llms/llms.json
            - --serve
            - "8000"
          env:
            # Avoid surprises if the image changes its default HOME.
            - name: HOME
              value: /home/llms
          volumeMounts:
            - name: llmspy-home
              mountPath: /home/llms/.llms
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: llmspy-config
          configMap:
            name: llmspy-config
            items:
              - key: llms.json
                path: llms.json
              - key: providers.json
                path: providers.json
        - name: llmspy-home
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: llmspy
  namespace: llm
  labels:
    app: llmspy
spec:
  type: ClusterIP
  selector:
    app: llmspy
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
