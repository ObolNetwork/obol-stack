---
# LLM foundation services
#
# This deploys:
# - A ClusterIP Service + Endpoints "ollama" that routes to the host's Ollama server
# - LiteLLM as an OpenAI-compatible gateway / router over providers
#
# Design notes:
# - No in-cluster Ollama is deployed; the host is expected to run Ollama
#   (or another OpenAI-compatible server) on port 11434.
# - The ollama Service abstracts host resolution via ClusterIP + headless Endpoints:
#     k3d  → host IP resolved at init via Docker (host.docker.internal lookup
#            from a transient container; works for Docker Desktop (192.168.65.254),
#            Colima (e.g. 192.168.5.2), and Rancher Desktop)
#     k3s  → 127.0.0.1 (k3s runs directly on the host)
# - Using ClusterIP+Endpoints instead of ExternalName for Traefik Gateway API
#   compatibility (ExternalName services are rejected as HTTPRoute backends).
# - LiteLLM starts with a base paid/* route; provider models are added via
#   `obol model setup`, and purchased remote models are added by the controller.
apiVersion: v1
kind: Namespace
metadata:
  name: llm
  labels:
    # Pod Security Standards: Restricted profile enforced at admission.
    # The litellm and x402-buyer pods run as non-root with
    # all caps dropped, seccomp=RuntimeDefault, and readOnlyRootFilesystem;
    # write paths are routed to named emptyDir mounts.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# ClusterIP Service + Endpoints: routes ollama.llm.svc.cluster.local → host Ollama.
# The endpoint IP is resolved during `obol stack init` via the {{OLLAMA_HOST_IP}} placeholder.
# Using ClusterIP+Endpoints instead of ExternalName for Traefik Gateway API compatibility.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
  labels:
    app: ollama
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      protocol: TCP
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: llm
  labels:
    app: ollama
subsets:
  - addresses:
      - ip: "{{OLLAMA_HOST_IP}}"
    ports:
      - name: http
        port: 11434
        protocol: TCP

---
# LiteLLM configuration: base paid/* route plus provider and purchased models.
# This ConfigMap is the Kubernetes source of truth. The pod copies it into a
# writable emptyDir before LiteLLM starts so /model/new can update the live
# router and persist to its configured YAML path without trying to write back to
# a read-only ConfigMap volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llm
data:
  config.yaml: |
    model_list:
      - model_name: "paid/*"
        litellm_params:
          model: "openai/*"
          # x402-buyer runs as its own Deployment/Service (not a sidecar) so
          # LiteLLM stays stateless and can roll with maxUnavailable: 0.
          # The /v1 suffix is required — LiteLLM's OpenAI provider does not
          # append it (CLAUDE.md pitfall 6).
          api_base: "http://x402-buyer.llm.svc.cluster.local:8402/v1"
          api_key: "unused"
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    litellm_settings:
      cache: false
      drop_params: true

---
# Buyer ConfigMaps — the serviceoffer-controller writes one <upstreamKey>.json
# entry per PurchaseRequest. This matches x402-buyer --config-dir/--auths-dir
# loading and avoids the old single shared config.json/auths.json merge point.
apiVersion: v1
kind: ConfigMap
metadata:
  name: x402-buyer-config
  namespace: llm
data: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: x402-buyer-auths
  namespace: llm
data: {}

---
# Secret for LiteLLM master key. Provider API keys (ANTHROPIC_API_KEY,
# OPENAI_API_KEY, ...) are patched in by `obol model setup` and the
# autoConfigureLLM hook on first up. We deliberately do NOT declare empty
# placeholders here — re-applying this manifest on every `obol stack up`
# would overwrite any keys the user has set, leaving `obol model status`
# in the misleading state of `enabled: true, api_key: false`.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: llm
type: Opaque
stringData:
  LITELLM_MASTER_KEY: "sk-obol-{{CLUSTER_ID}}"

---
# x402-buyer maintains consumed-nonce state in /state/consumed.json.
# Previously this was emptyDir, which lost state on every pod restart
# — the buyer would then attempt to re-spend already-consumed auths
# from the ConfigMap-loaded pool, cascading into 400s from the
# facilitator's nonce protection until a manual buy.py process --all.
# PVC backed by local-path (single-node k3d default storage class)
# gives crash-safety without conversion to StatefulSet.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: x402-buyer-state
  namespace: llm
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llm
  labels:
    app: litellm
spec:
  # Single replica is enough locally: with RollingUpdate maxUnavailable: 0
  # below, every rollout (image bump, secret rotation via Reloader) surges a
  # new pod to Ready before the old one terminates — no inference gap.
  # LiteLLM is stateless here (config is copied from the ConfigMap at pod
  # start; x402-buyer runs as its own Deployment with the stateful PVC), so
  # scaling out is safe if ever needed — but note the hot model APIs must
  # then be fanned out per pod (the CLI already does; see litellmAPICall).
  replicas: 1
  # RollingUpdate with zero unavailability is the whole point of keeping
  # this pod stateless (issue #321). The old Recreate strategy was forced by
  # the buyer sidecar's RWO PVC, which now lives in the x402-buyer
  # Deployment below.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        # litellm-secrets ONLY. Deliberately narrow:
        # - litellm-config is NOT watched: every model_list change is
        #   hot-applied to the live router via /model/new + /model/delete by
        #   both the CLI (internal/model/model.go hotAddModels/hotDeleteModel)
        #   and the serviceoffer-controller (purchase_helpers.go). The
        #   ConfigMap is persistence for the next pod start, nothing more.
        #   Watching it here would roll the pod on every model add/remove/
        #   prefer and on every first-time purchase — reintroducing the
        #   inference gap the hot APIs exist to remove (issue #321).
        # - x402-buyer-config/x402-buyer-auths are NOT watched: x402-buyer
        #   hot-reloads them via /admin/reload driven by the controller on
        #   every buy/refill (CLAUDE.md pitfall 7: restart is the fallback,
        #   not the default buy path).
        # - litellm-secrets IS watched: os.environ/ API-key references are
        #   resolved once at config load, so key changes genuinely need a
        #   pod replacement. With RollingUpdate maxUnavailable:0 below this
        #   is a gapless surge, not an outage.
        secret.reloader.stakater.com/reload: "litellm-secrets"
    spec:
      terminationGracePeriodSeconds: 60
      # PSS Restricted: pod-level identity. UID/GID 65532 is the nonroot
      # distroless convention; the Obol LiteLLM fork's working dirs are
      # routed onto emptyDir mounts below so readOnlyRootFilesystem can
      # stay on without breaking Python's tempfile / cache writes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-litellm-config
          image: ghcr.io/obolnetwork/litellm:sha-9b3e569@sha256:ac453f9cdfa3752efa38998aa5bbf4f9a67e642a68b27a647aaf667c083ddc51
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - python3
            - -c
          args:
            - |
              with open("/config-src/config.yaml", "rb") as src, open("/config/config.yaml", "wb") as dst:
                  dst.write(src.read())
          volumeMounts:
            - name: litellm-config-source
              mountPath: /config-src
              readOnly: true
            - name: litellm-config-work
              mountPath: /config
      containers:
        - name: litellm
          # Obol fork of LiteLLM with config-only model management API.
          # No Postgres required — /model/new and /model/delete work via
          # in-memory router + config.yaml persistence.
          # Source: https://github.com/ObolNetwork/litellm
          image: ghcr.io/obolnetwork/litellm:sha-9b3e569@sha256:ac453f9cdfa3752efa38998aa5bbf4f9a67e642a68b27a647aaf667c083ddc51
          imagePullPolicy: IfNotPresent
          # PSS Restricted: drop all caps, no privilege escalation, RO rootfs.
          # Python writes are funneled to the emptyDir mounts below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: litellm-secrets
          env:
            - name: STORE_MODEL_IN_DB
              value: "false"
            - name: DISABLE_SCHEMA_UPDATE
              value: "true"
            # Redirect Python / HF / pip cache lookups onto the writeable
            # emptyDir at /home/litellm so readOnlyRootFilesystem=true holds.
            - name: HOME
              value: /home/litellm
            - name: XDG_CACHE_HOME
              value: /home/litellm/.cache
            - name: HF_HOME
              value: /home/litellm/.cache/huggingface
          volumeMounts:
            - name: litellm-config-work
              mountPath: /etc/litellm
            - name: litellm-tmp
              mountPath: /tmp
            - name: litellm-home
              mountPath: /home/litellm
          startupProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: litellm-config-source
          configMap:
            name: litellm-config
            items:
              - key: config.yaml
                path: config.yaml
        # Runtime copy of litellm-config. ConfigMap volumes are read-only, but
        # LiteLLM's config-backed /model/new path persists to config.yaml after
        # updating the live router. Keep the source ConfigMap immutable and give
        # LiteLLM a pod-local writable working file instead.
        - name: litellm-config-work
          emptyDir:
            sizeLimit: 1Mi
        # Writable /tmp for Python tempfile / multipart uploads. Sized
        # modestly — LiteLLM streams responses rather than buffering them.
        - name: litellm-tmp
          emptyDir:
            sizeLimit: 128Mi
        # Writable HOME for LiteLLM's pip/HF/XDG cache lookups so the
        # container can run with readOnlyRootFilesystem=true.
        - name: litellm-home
          emptyDir:
            sizeLimit: 256Mi

---
# x402-buyer as its own Deployment (was: sidecar in the litellm pod).
# Separating it makes LiteLLM stateless so LiteLLM can use RollingUpdate
# maxUnavailable: 0 (zero-downtime rollouts on image bumps and secret
# rotation, issue #321). The buyer keeps the RWO PVC and stays single
# replica + Recreate: consumed-auth state must have exactly one writer or
# pre-signed auths could be double-spent. Buyer rollouts briefly gap paid/*
# routes only — rare (buyer image bumps; buyer CM changes hot-reload via
# /admin/reload, driven by the serviceoffer-controller).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-buyer
  namespace: llm
  labels:
    app: x402-buyer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: x402-buyer
  template:
    metadata:
      labels:
        app: x402-buyer
      # No Reloader annotations: x402-buyer-config/x402-buyer-auths changes
      # are hot-reloaded via /admin/reload (CLAUDE.md pitfall 7).
    spec:
      # PSS Restricted. UID/GID 1000 (not the 65532 distroless default): on
      # fresh clusters the StorageClass provisions local PVs where kubelet
      # applies fsGroup and any UID works, but clusters UPGRADED in place
      # from <= v0.10.0-rc12 have a hostPath-typed x402-buyer-state PV
      # (kubelet ignores fsGroup there) chowned 1000:1000 with consumed.json
      # written 0600 by UID 1000 — a 65532 buyer cannot read it and
      # crashloops on startup (`load state` Fatalf), taking every paid/*
      # route down. Keep 1000 until hostPath PVs are out of support.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: x402-buyer
          # Stack-owned image: placeholder rewritten at apply time to
          # :GitCommit@sha256:<index-digest> (prod) or :dev-<sha> (OBOL_DEVELOPMENT).
          # Digests are never committed to git — see internal/images.
          image: ghcr.io/obolnetwork/x402-buyer:__OBOL_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --config-dir=/config/buyer-config
            - --auths-dir=/config/buyer-auths
            - --state=/state/consumed.json
            - --listen=:8402
          ports:
            - name: buyer-http
              containerPort: 8402
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: buyer-http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: buyer-http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: buyer-config
              mountPath: /config/buyer-config
              readOnly: true
            - name: buyer-auths
              mountPath: /config/buyer-auths
              readOnly: true
            - name: x402-buyer-state
              mountPath: /state
      volumes:
        - name: buyer-config
          configMap:
            name: x402-buyer-config
            optional: true
        - name: buyer-auths
          configMap:
            name: x402-buyer-auths
            optional: true
        - name: x402-buyer-state
          persistentVolumeClaim:
            claimName: x402-buyer-state

---
# Stable in-cluster address for the buyer: LiteLLM's paid/* routes point
# api_base at this Service, and agents' buy.py reaches /status through it.
# Exposure note: pod IP :8402 was already cluster-reachable when the buyer
# was a sidecar (no NetworkPolicy in this namespace); the Service changes
# addressing, not the security posture. Auth spend is bounded by the
# pre-signed pool (max loss = N x price).
apiVersion: v1
kind: Service
metadata:
  name: x402-buyer
  namespace: llm
  labels:
    app: x402-buyer
spec:
  type: ClusterIP
  selector:
    app: x402-buyer
  ports:
    - name: buyer-http
      port: 8402
      targetPort: buyer-http
      protocol: TCP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
  namespace: llm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: litellm

---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: llm
  labels:
    app: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP

---
# Relocated from helmfile.yaml `llm-buyer-podmonitor` bedag/raw release.
# Lives alongside its workload (the x402-buyer Deployment) instead of
# inlined in helmfile so the chart layout is the single source of truth
# for what ships in the llm namespace. The PodMonitor CRD comes from the
# monitoring release (kube-prometheus-stack), so `base` now declares a
# `needs: [monitoring/monitoring]` in helmfile.yaml to guarantee CRD
# presence before this template applies.
#
# PodMonitor kept under its historical name (litellm-x402-buyer) so
# helmfile ordering notes and tests stay stable; it now targets the
# standalone x402-buyer pods (the buyer is no longer a litellm sidecar).
# Picked up by kube-prometheus-stack via the `release: monitoring` label.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: litellm-x402-buyer
  namespace: llm
  labels:
    release: monitoring
    app: x402-buyer
spec:
  selector:
    matchLabels:
      app: x402-buyer
  podMetricsEndpoints:
    - port: buyer-http
      path: /metrics
      interval: 30s
