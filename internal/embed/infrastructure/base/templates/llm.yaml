---
# LLM foundation services (OKR-1)
#
# This deploys:
# - Ollama (as the upstream LLM runtime)
# - llms.py (LLMSpy) as an OpenAI-compatible gateway / router over providers
#
# Design notes:
# - We default to Ollama Cloud (`glm-4.7:cloud`) to avoid requiring local GPU/VRAM.
# - We persist Ollama's identity keypair at `/root/.ollama/id_ed25519` so the
#   Ollama Cloud "connect" binding survives pod restarts/upgrades.
# - Model cache is kept on `emptyDir` (ephemeral) per product decision.
apiVersion: v1
kind: Namespace
metadata:
  name: llm

---
# Persist Ollama identity (Ollama Cloud connect uses the public key derived from this keypair).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-home
  namespace: llm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm
  labels:
    app: ollama
spec:
  replicas: 1
  # Ollama uses a ReadWriteOnce PVC; avoid surging a second pod during updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          env:
            # Store model blobs (including any cloud model stubs/cache) in an ephemeral volume.
            - name: OLLAMA_MODELS
              value: /models
            # Explicitly bind the HTTP API to all interfaces in-cluster.
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
          volumeMounts:
            # Persist identity + config (e.g. ~/.ollama/id_ed25519) for Ollama Cloud connect.
            - name: ollama-home
              mountPath: /root/.ollama
            - name: ollama-models
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 4Gi
      volumes:
        - name: ollama-home
          persistentVolumeClaim:
            claimName: ollama-home
        - name: ollama-models
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
  labels:
    app: ollama
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
      protocol: TCP

---
# llms.py configuration for Obol Stack:
# - Only enable the Ollama provider
# - Default model is `glm-4.7:cloud` (cloud-first)
apiVersion: v1
kind: ConfigMap
metadata:
  name: llmspy-config
  namespace: llm
data:
  llms.json: |
    {
      "defaults": {
        "headers": {
          "Content-Type": "application/json"
        },
        "text": {
          "model": "glm-4.7:cloud",
          "messages": [
            { "role": "user", "content": "" }
          ]
        }
      },
      "providers": {
        "ollama": {
          "enabled": true,
          "type": "OllamaProvider",
          "base_url": "http://ollama.llm.svc.cluster.local:11434",
          "models": {},
          "all_models": true
        }
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmspy
  namespace: llm
  labels:
    app: llmspy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmspy
  template:
    metadata:
      labels:
        app: llmspy
    spec:
      initContainers:
        # Seed ~/.llms/llms.json from the ConfigMap. llms.py also writes runtime
        # state (e.g. analytics) under ~/.llms, so we keep the directory writable.
        - name: seed-config
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /data
              cp /config/llms.json /data/llms.json
          volumeMounts:
            - name: llmspy-config
              mountPath: /config
              readOnly: true
            - name: llmspy-home
              mountPath: /data
      containers:
        - name: llmspy
          # Official LLMSpy container image (published by upstream).
          # Pin a specific version for reproducibility.
          image: ghcr.io/servicestack/llms:v2.0.30
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          command:
            - sh
            - -c
            - |
              set -eu
              llms --config /home/llms/.llms/llms.json --serve 8000
          env:
            # Avoid surprises if the image changes its default HOME.
            - name: HOME
              value: /home/llms
          volumeMounts:
            - name: llmspy-home
              mountPath: /home/llms/.llms
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: llmspy-config
          configMap:
            name: llmspy-config
            items:
              - key: llms.json
                path: llms.json
        - name: llmspy-home
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: llmspy
  namespace: llm
  labels:
    app: llmspy
spec:
  type: ClusterIP
  selector:
    app: llmspy
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
