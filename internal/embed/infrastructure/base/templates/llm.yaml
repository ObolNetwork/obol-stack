---
# LLM foundation services
#
# This deploys:
# - A ClusterIP Service + Endpoints "ollama" that routes to the host's Ollama server
# - LiteLLM as an OpenAI-compatible gateway / router over providers
#
# Design notes:
# - No in-cluster Ollama is deployed; the host is expected to run Ollama
#   (or another OpenAI-compatible server) on port 11434.
# - The ollama Service abstracts host resolution via ClusterIP + headless Endpoints:
#     k3d  → host IP resolved at init (e.g. 192.168.65.254 on macOS Docker Desktop)
#     k3s  → 127.0.0.1 (k3s runs directly on the host)
# - Using ClusterIP+Endpoints instead of ExternalName for Traefik Gateway API
#   compatibility (ExternalName services are rejected as HTTPRoute backends).
# - LiteLLM starts with an empty model_list; models are added via `obol model setup`.
apiVersion: v1
kind: Namespace
metadata:
  name: llm

---
# ClusterIP Service + Endpoints: routes ollama.llm.svc.cluster.local → host Ollama.
# The endpoint IP is resolved during `obol stack init` via the {{OLLAMA_HOST_IP}} placeholder.
# Using ClusterIP+Endpoints instead of ExternalName for Traefik Gateway API compatibility.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
  labels:
    app: ollama
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      protocol: TCP
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: llm
  labels:
    app: ollama
subsets:
  - addresses:
      - ip: "{{OLLAMA_HOST_IP}}"
    ports:
      - name: http
        port: 11434
        protocol: TCP

---
# LiteLLM configuration: empty model_list by default.
# Models are added via `obol model setup` which patches this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llm
data:
  config.yaml: |
    model_list: []
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    litellm_settings:
      cache: false
      drop_params: false

---
# Secret for LiteLLM master key and cloud provider API keys.
# Master key is unique per cluster ({{CLUSTER_ID}} resolved at init).
# Provider keys start empty; patched via `obol model setup`.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: llm
type: Opaque
stringData:
  LITELLM_MASTER_KEY: "sk-obol-{{CLUSTER_ID}}"
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: litellm-secrets
          env:
            - name: STORE_MODEL_IN_DB
              value: "false"
            - name: DISABLE_SCHEMA_UPDATE
              value: "true"
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
          startupProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
            items:
              - key: config.yaml
                path: config.yaml

---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: llm
  labels:
    app: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
