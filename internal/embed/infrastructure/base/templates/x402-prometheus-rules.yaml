---
# Recording + alerting rules for x402 verifier traffic.
#
# Recording rules pre-aggregate the queries that the frontend's
# /api/sell/list joins use (chargedSalesByOfferAndChain,
# chargedRequests24hByOffer). The frontend reads the recorded series
# directly, which:
#   * removes the `increase()` 2-sample minimum quirk (cold offers no
#     longer show "0" for the first 30s after they receive traffic),
#   * decouples the page from raw metric names (renaming
#     obol_x402_verifier_charged_requests_total no longer breaks the UI),
#   * cuts query cost on dashboards / page reloads (sum is done once at
#     evaluation time, not per page-load).
#
# Alerting rules surface the two operator-meaningful failure modes the
# release-smoke flows historically caught manually.
#
# Picked up by kube-prometheus-stack via the `release: monitoring` label
# (configured in values/monitoring.yaml.gotmpl).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: x402-verifier
  namespace: x402
  labels:
    release: monitoring
    app: x402-verifier
spec:
  groups:
    - name: x402.recording
      interval: 30s
      rules:
        # 24h charged-request count per (offer, chain). Replaces the
        # frontend's `increase(charged_requests_total[24h])` query — same
        # math, pre-computed every 30s.
        #
        # Kept unchanged for backwards compatibility. The
        # _by_offer_chain_asset_symbol sibling below is the migration
        # target for the frontend's per-token EarningsStrip columns.
        - record: x402:revenue:24h_by_offer_chain
          expr: |
            sum by (offer_namespace, offer_name, chain) (
              increase(obol_x402_verifier_charged_requests_total[24h])
            )

        # 24h charged-request count per (offer, chain, asset_symbol).
        # Same math as :24h_by_offer_chain but keeps the asset dimension
        # so the frontend can answer "what's my OBOL revenue?" with a
        # single PromQL query instead of joining metrics with the
        # ServiceOffer CR. Adding asset_symbol is non-multiplicative
        # because each offer pins exactly one asset (A=1 per offer).
        - record: x402:revenue:24h_by_offer_chain_asset_symbol
          expr: |
            sum by (offer_namespace, offer_name, chain, asset_symbol) (
              increase(obol_x402_verifier_charged_requests_total[24h])
            )

        # 7d charged-request count per (offer, chain). Powers the
        # EarningsStrip per-chain × CRD price multiplication.
        - record: x402:revenue:7d_by_offer_chain
          expr: |
            sum by (offer_namespace, offer_name, chain) (
              increase(obol_x402_verifier_charged_requests_total[7d])
            )

        # 7d charged-request count per (offer, chain, asset_symbol).
        # Sibling of :7d_by_offer_chain — once the frontend migrates to
        # the per-asset rule, the EarningsStrip can drop its
        # CR-join-at-query-time for per-token columns. Cardinality is
        # non-multiplicative because each offer pins exactly one asset.
        - record: x402:revenue:7d_by_offer_chain_asset_symbol
          expr: |
            sum by (offer_namespace, offer_name, chain, asset_symbol) (
              increase(obol_x402_verifier_charged_requests_total[7d])
            )

        # 7d charged-request count per offer (chain-agnostic). Used in the
        # My Listings "7d · X earned" header text and the Browse catalog
        # usage badge.
        #
        # Why `increase()` and not `sum(counter)`:
        #   Prometheus counters are per-process by design — they reset to
        #   zero on every pod restart (rollout, OOM, eviction, node
        #   reschedule). A naive `sum by (...) (counter)` query therefore
        #   drops to zero whenever the verifier restarts, producing a
        #   misleading "0 requests" reading on offers with real on-chain
        #   traffic. `increase()` performs reset detection at query time
        #   across the samples the TSDB holds, accounting for the wraps.
        #
        # Why `[7d]` and not `[8d]` (matching retention):
        #   The TSDB is the canonical persistence layer. `increase()`
        #   needs samples on both sides of the window edge to do reset
        #   detection at the left edge; a 7d window inside 8d retention
        #   gives a 1-day headroom so the rule keeps working at exactly
        #   the moment data ages out, instead of silently producing
        #   NaN/undercounts at the boundary.
        #
        # Canonical reference: Robust Perception, "avoiding the counter-
        # reset undercount".
        - record: x402:revenue:7d_by_offer
          expr: |
            sum by (offer_namespace, offer_name) (
              increase(obol_x402_verifier_charged_requests_total[7d])
            )

        # Settlement rate (verified / attempted) over the last hour, per
        # (offer, chain). Useful for the dashboard + the alert below.
        #
        # The `clamp_min(..., 1e-9)` is a division-by-zero guard, not a
        # traffic floor. An earlier revision used `clamp_min(..., 1)`,
        # which floored the denominator at 1 req/s and silently
        # distorted the ratio on low-traffic offers (e.g. verified=
        # 0.001/s ÷ floored_denominator=1 ≈ 0 instead of the real
        # 0.001/0.002 = 0.5). Epsilon keeps the answer accurate at any
        # non-zero traffic level while still avoiding a NaN when no
        # samples exist in the window.
        - record: x402:settlement_rate:1h_by_offer_chain
          expr: |
            sum by (offer_namespace, offer_name, chain) (
              rate(obol_x402_verifier_payment_verified_total[1h])
            )
            /
            clamp_min(
              sum by (offer_namespace, offer_name, chain) (
                rate(obol_x402_verifier_payment_required_total[1h])
                +
                rate(obol_x402_verifier_payment_verified_total[1h])
                +
                rate(obol_x402_verifier_payment_failed_total[1h])
              ),
              1e-9
            )

        # Age of the last successful payment per (offer, chain). Used by
        # the frontend My Purchases drawer to render "last settlement:
        # 12s ago" labels without joining against the buyer sidecar or
        # chasing on-chain receipts.
        #
        # The underlying gauge
        # `obol_x402_verifier_last_payment_success_seconds` stamps
        # `time.Now().Unix()` (seconds since epoch, UTC) into the same
        # `(offer_namespace, offer_name, chain, asset_symbol)` label set
        # used by `obol_x402_verifier_charged_requests_total`, right
        # next to the counter `.Inc()` in the verifier's success branch.
        # Until an offer settles at least once, no series exists for it
        # and the rule's `max(...)` returns no samples — the frontend
        # then renders "no settlements yet" rather than a misleading
        # "X seconds ago since 1970". A pod restart clears the gauge
        # (in-process state) but Prometheus retention keeps the last
        # sample, so the rule keeps producing a sensible age across
        # rollouts.
        #
        # `max by (...)` collapses the asset_symbol dimension on the
        # input gauge: a single (offer, chain) almost always pins one
        # asset, but `max` is safe even if a route re-pins from USDC
        # to OBOL — the most recent settlement still wins.
        - record: x402:last_payment_age_seconds:by_offer_chain
          expr: |
            time() - max by (offer_namespace, offer_name, chain) (
              obol_x402_verifier_last_payment_success_seconds
            )

    - name: x402.alerting
      rules:
        # Payment-failure ratio crossed 10% over the last hour for a paid
        # route that's actually receiving traffic. Typical cause:
        # facilitator unreachable, chain pruning, or seller's CA bundle
        # missing (CLAUDE.md pitfall #8).
        #
        # The `clamp_min(..., 1e-9)` here is a div-by-zero guard only.
        # A prior `clamp_min(..., 1)` floored the denominator at 1 req/s,
        # which under-reports the failure ratio on light-traffic
        # endpoints (failed=0.001/s ÷ floored_denominator=1 = 0.001
        # instead of the true 0.001/0.002 = 0.5) and prevented the
        # alert from ever firing at sub-1 req/s. Epsilon avoids NaN
        # without distorting the ratio.
        - alert: X402PaymentFailureRateHigh
          expr: |
            (
              sum by (offer_namespace, offer_name, chain) (
                rate(obol_x402_verifier_payment_failed_total[1h])
              )
              /
              clamp_min(
                sum by (offer_namespace, offer_name, chain) (
                  rate(obol_x402_verifier_payment_failed_total[1h])
                  +
                  rate(obol_x402_verifier_payment_verified_total[1h])
                ),
                1e-9
              )
            ) > 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "x402 payment failures > 10% on {{ "{{" }} $labels.offer_namespace {{ "}}" }}/{{ "{{" }} $labels.offer_name {{ "}}" }} ({{ "{{" }} $labels.chain {{ "}}" }})"
            description: |
              More than 10% of paid requests to
              {{ "{{" }} $labels.offer_namespace {{ "}}" }}/{{ "{{" }} $labels.offer_name {{ "}}" }} on
              {{ "{{" }} $labels.chain {{ "}}" }} have failed verification over the last
              hour. Check the verifier logs for x509/facilitator errors and
              the seller's `ca-certificates` ConfigMap.

        # An offer received a 402 (payment_required) within the last hour
        # but no charged_requests happened in the same window. Either
        # buyers aren't completing the flow, or settlement is broken
        # downstream of the verifier.
        - alert: X402NoSettlementsAfterChallenge
          expr: |
            (
              sum by (offer_namespace, offer_name) (
                increase(obol_x402_verifier_payment_required_total[1h])
              ) > 0
            )
            and
            (
              sum by (offer_namespace, offer_name) (
                increase(obol_x402_verifier_charged_requests_total[1h])
              ) == 0
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.offer_namespace {{ "}}" }}/{{ "{{" }} $labels.offer_name {{ "}}" }} returns 402 but never settles"
            description: |
              The x402 verifier issued 402 responses for
              {{ "{{" }} $labels.offer_namespace {{ "}}" }}/{{ "{{" }} $labels.offer_name {{ "}}" }} in the
              last hour but observed no settled requests. Check the buyer
              sidecar's auth pool (/status) and the facilitator's settlement
              endpoint.
