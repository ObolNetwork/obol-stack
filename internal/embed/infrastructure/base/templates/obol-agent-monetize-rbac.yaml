---
# Monetize RBAC for the default agent runtime
#
# The agent remains a compatibility CLI surface for creating and inspecting
# ServiceOffer objects. The serviceoffer-controller owns all child resources,
# verifier route state, and registration side effects.

---
#------------------------------------------------------------------------------
# Namespace - pre-create the default Hermes obol-agent namespace. The
# openclaw-* ClusterRole names predate the OpenClaw removal (v0.16) and are kept
# so upgrades do not have to migrate RBAC objects.
#------------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: hermes-obol-agent

---
#------------------------------------------------------------------------------
# ClusterRole - Read-only permissions
#
# Cluster-wide observation so Hermes can steward workloads outside its own
# namespace (local Ethereum nodes in ethereum-<id>, DV pods, monitoring).
# Deliberately EXCLUDES:
#   - secrets: wallet keystores, API keys, tunnel tokens. Never readable.
#   - configmaps: several stack ConfigMaps carry credentials (litellm-config
#     custom-endpoint api_key, hermes-config LiteLLM master key, erpc-config
#     upstream URLs with basic auth / paid RPC keys, x402-buyer-auths pre-signed
#     payment vouchers, dv-pod `prometheus` remote-write token). ConfigMap read
#     is granted per namespace instead (network templates' agent-rbac.yaml; a
#     resourceNames-scoped Role in the dv-pod chart).
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-monetize-read
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers", "serviceoffers/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "namespaces", "nodes", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]

---
#------------------------------------------------------------------------------
# ClusterRole - Minimal Obol CRD write permissions
#
# ServiceOffers live in the upstream workload namespace (for example "llm"),
# while PurchaseRequests live in the buyer agent namespace. The controller owns
# all child resources, so the agent only needs Obol CRD lifecycle permissions.
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-monetize-write
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests/status"]
    verbs: ["get"]

---
#------------------------------------------------------------------------------
# ClusterRole - Hermes mother agent factory permissions
#
# This role is intentionally bound only to the default Hermes mother namespace.
# The agent-factory skill writes deterministic child namespaces, profile/env
# Secrets, Agent CRs, and optional agent-backed ServiceOffers. Admission policy
# guards shape constraints for the broad core resources Kubernetes RBAC cannot
# restrict by name prefix.
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-agent-factory-write
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # Secrets: scoped so the mother agent CANNOT read other namespaces' wallet
  # keystores (remote-signer-keystore / -password). Wallet keys are only ever
  # served via the in-namespace remote-signer REST API, never read through the
  # k8s secrets API by any agent flow, so this allow-list breaks nothing.
  # get/patch are name-restricted to the secrets the agent/factory legitimately
  # touches; create stays open (it cannot read or overwrite an existing wallet).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames:
      - litellm-secrets
      - hermes-api-server
      - hermes-profile-seed
      - hermes-env
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: ["obol.org"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
#------------------------------------------------------------------------------
# ClusterRoleBinding - Read permissions
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-monetize-read-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openclaw-monetize-read
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes-obol-agent

---
#------------------------------------------------------------------------------
# ClusterRoleBinding - Hermes mother agent factory permissions
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-agent-factory-write-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-agent-factory-write
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes-obol-agent

---
#------------------------------------------------------------------------------
# ClusterRoleBinding - Minimal Obol CRD write permissions
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-monetize-write-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openclaw-monetize-write
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes-obol-agent
