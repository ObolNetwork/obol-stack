---
# Monetize RBAC for OpenClaw Agents
#
# The agent remains a compatibility CLI surface for creating and inspecting
# ServiceOffer objects. The serviceoffer-controller owns all child resources,
# verifier route state, and registration side effects.

---
#------------------------------------------------------------------------------
# ClusterRole - Read-only permissions
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-monetize-read
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers", "serviceoffers/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]

---
#------------------------------------------------------------------------------
# ClusterRole - Minimal ServiceOffer write permissions
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-monetize-write
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests/status"]
    verbs: ["get"]

---
#------------------------------------------------------------------------------
# ClusterRoleBinding - Read permissions
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-monetize-read-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openclaw-monetize-read
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: openclaw-obol-agent

---
#------------------------------------------------------------------------------
# ClusterRoleBinding - Minimal write permissions
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-monetize-write-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openclaw-monetize-write
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: openclaw-obol-agent
