---
# Monetize RBAC for the default agent runtime
#
# The agent remains a compatibility CLI surface for creating and inspecting
# ServiceOffer objects. The serviceoffer-controller owns all child resources,
# verifier route state, and registration side effects.

---
#------------------------------------------------------------------------------
# Namespace - pre-create the default obol-agent namespace so base-stack RBAC can
# use namespace-scoped Role/RoleBinding resources without widening writes back
# to a ClusterRole.
#------------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: hermes-obol-agent

---
#------------------------------------------------------------------------------
# ClusterRole - Read-only permissions
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-monetize-read
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers", "serviceoffers/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]

---
#------------------------------------------------------------------------------
# Role - Minimal write permissions in the agent namespace only
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-monetize-write
  namespace: hermes-obol-agent
rules:
  - apiGroups: ["obol.org"]
    resources: ["serviceoffers"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["obol.org"]
    resources: ["purchaserequests/status"]
    verbs: ["get"]

---
#------------------------------------------------------------------------------
# ClusterRoleBinding - Read permissions
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-monetize-read-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openclaw-monetize-read
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes-obol-agent

---
#------------------------------------------------------------------------------
# RoleBinding - Minimal write permissions in the agent namespace
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-monetize-write-binding
  namespace: hermes-obol-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-monetize-write
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes-obol-agent
