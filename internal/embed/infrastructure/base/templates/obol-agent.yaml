{{- if .Values.obolAgent.enabled }}
---
# Obol Agent Kubernetes Manifest
# This manifest deploys the Obol AI Agent with namespace-scoped RBAC permissions
# The agent can read cluster-wide resources (nodes, namespaces) but can only modify
# resources in specific namespaces: agent (and others via dynamic bindings)
#
# To enable the obol-agent, set obolAgent.enabled=true in the base chart values
# (infrastructure helmfile.yaml → base release → values).

#------------------------------------------------------------------------------
# Namespace - Ensure the agent namespace exists
#------------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: agent

---
#------------------------------------------------------------------------------
# ServiceAccount - Identity for the Obol Agent pod
#------------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obol-agent
  namespace: agent

---
#------------------------------------------------------------------------------
# ClusterRole - Read-only access to cluster-wide resources
# Allows the agent to list namespaces and nodes across the entire cluster
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obol-agent-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list", "watch"]  # Read-only access

---
#------------------------------------------------------------------------------
# ClusterRoleBinding - Grants cluster-wide read access to the agent
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obol-agent-cluster-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obol-agent-cluster-reader
subjects:
  - kind: ServiceAccount
    name: obol-agent
    namespace: agent

---
#------------------------------------------------------------------------------
# Role for 'agent' namespace
# Grants create/update/patch permissions within the agent's own namespace
#------------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: obol-agent-role
  namespace: agent
rules:
  - apiGroups: [""]  # Core API group
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]  # Apps API group
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["batch"]  # Batch API group
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]  # Access to pod logs
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: obol-agent-binding
  namespace: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: obol-agent-role
subjects:
  - kind: ServiceAccount
    name: obol-agent
    namespace: agent

---
#------------------------------------------------------------------------------
# Deployment - Obol Agent
# Lightweight sidecar that keeps the agent namespace healthy.
# The main agent logic is managed via `obol openclaw`.
#------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obol-agent
  namespace: agent
  labels:
    app: obol-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obol-agent
  template:
    metadata:
      labels:
        app: obol-agent
    spec:
      serviceAccountName: obol-agent
      containers:
        - name: obol-agent
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Use 'obol openclaw' to control your Obol Agent"
              while true; do sleep 3600; done
          resources:
            limits:
              cpu: 10m
              memory: 16Mi

---
#------------------------------------------------------------------------------
# Service - Exposes the Obol Agent within the cluster
# Access the agent at: http://obol-agent.agent.svc.cluster.local:8000
#------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: obol-agent
  namespace: agent
  labels:
    app: obol-agent
spec:
  type: ClusterIP  # Internal cluster access only (use Ingress for external access)
  ports:
    - port: 8000          # Service port
      targetPort: http    # Container port name
      protocol: TCP
      name: http
  selector:
    app: obol-agent  # Routes traffic to pods with this label
{{- end }}
