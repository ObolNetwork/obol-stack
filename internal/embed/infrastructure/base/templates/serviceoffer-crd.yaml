---
# ServiceOffer CRD
# Defines a compute service the agent can expose, gate with x402, and register on-chain.
# Condition lifecycle: ModelReady -> UpstreamHealthy -> PaymentGateReady -> RoutePublished -> Registered -> Ready
#
# Field naming conventions:
#   - payment.* fields align with x402 PaymentRequirements (V2): payTo, network, scheme, maxTimeoutSeconds
#   - registration.* fields align with ERC-8004 AgentRegistration: name, description, services, supportedTrust
#   - Human-friendly values (e.g., "base-sepolia") are used; the reconciler translates to wire format
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceoffers.obol.org
spec:
  group: obol.org
  names:
    kind: ServiceOffer
    listKind: ServiceOfferList
    plural: serviceoffers
    singular: serviceoffer
    shortNames:
      - so
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Model
          type: string
          jsonPath: .spec.model.name
        - name: Price
          type: string
          jsonPath: .spec.payment.price.perRequest
        - name: Network
          type: string
          jsonPath: .spec.payment.network
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            ServiceOffer declares a compute service that can be exposed publicly,
            gated with x402 payments, and optionally registered on an ERC-8004
            service registry. Field names align with x402 and ERC-8004 standards.
          properties:
            spec:
              type: object
              required:
                - payment
              # upstream is required for type=http|inference|fine-tuning but
              # synthesized by the controller from Agent.status.endpoint when
              # type=agent. Validation of "upstream OR agent.ref" lives in
              # the controller's runtime check.
              properties:
                type:
                  type: string
                  description: >-
                    Service type. 'inference' enables model management; 'http' for any HTTP service;
                    'agent' references an Agent CR via spec.agent.ref and the controller derives
                    upstream + model + skills from the agent's status.
                  default: "http"
                  enum:
                    - inference
                    - fine-tuning
                    - http
                    - agent
                agent:
                  type: object
                  description: >-
                    Required when type='agent'. The controller resolves spec.agent.ref to the
                    referenced Agent CR, derives upstream from Agent.status.endpoint, and surfaces
                    the agent's pinned model + skills in the 402 response's extra block.
                  properties:
                    ref:
                      type: object
                      required:
                        - name
                        - namespace
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                model:
                  type: object
                  description: "LLM model metadata. Required when the upstream serves an LLM."
                  required:
                    - name
                    - runtime
                  properties:
                    name:
                      type: string
                      description: "Model identifier (e.g. qwen3.5:35b)."
                    runtime:
                      type: string
                      description: "Runtime serving the model."
                      enum:
                        - ollama
                        - vllm
                        - tgi
                upstream:
                  type: object
                  description: "In-cluster service that handles the actual workload."
                  required:
                    - service
                    - namespace
                    - port
                  properties:
                    service:
                      type: string
                      description: "Kubernetes Service name."
                    namespace:
                      type: string
                      description: "Namespace of the upstream Service."
                    port:
                      type: integer
                      description: "Port on the upstream Service."
                      default: 11434
                      minimum: 1
                      maximum: 65535
                    healthPath:
                      type: string
                      description: "HTTP path used for health probes against the upstream."
                      default: "/health"
                payment:
                  type: object
                  description: >-
                    x402 payment terms. Field names align with x402 PaymentRequirements (V2):
                    payTo, network, scheme, maxTimeoutSeconds.
                  required:
                    - network
                    - payTo
                    - price
                  properties:
                    scheme:
                      type: string
                      description: "x402 payment scheme."
                      default: "exact"
                      enum:
                        - exact
                    network:
                      type: string
                      description: >-
                        Chain identifier for payments (human-friendly).
                        Reconciler resolves to CAIP-2 format (e.g., "base-sepolia" → "eip155:84532").
                    payTo:
                      type: string
                      description: "USDC recipient wallet address (x402: payTo)."
                      pattern: "^0x[0-9a-fA-F]{40}$"
                    maxTimeoutSeconds:
                      type: integer
                      description: "Payment validity window in seconds (x402: maxTimeoutSeconds)."
                      default: 300
                    asset:
                      type: object
                      description: >-
                        Optional token metadata override for x402 settlement.
                        When omitted, the verifier uses the chain default asset.
                      properties:
                        address:
                          type: string
                          description: "ERC-20 contract address."
                          pattern: "^0x[0-9a-fA-F]{40}$"
                        symbol:
                          type: string
                          description: "Human-friendly token symbol (e.g. USDC, OBOL)."
                        decimals:
                          type: integer
                          description: "Token decimals in atomic units."
                          minimum: 0
                          maximum: 255
                        transferMethod:
                          type: string
                          description: "x402 transfer method for the asset."
                          enum:
                            - eip3009
                            - permit2
                        eip712Name:
                          type: string
                          description: "EIP-712 domain name used by the token."
                        eip712Version:
                          type: string
                          description: "EIP-712 domain version used by the token."
                    price:
                      type: object
                      description: >-
                        Pricing table with per-unit prices in USDC (human-readable decimals).
                        Which fields are applicable depends on the workload type.
                      properties:
                        perRequest:
                          type: string
                          description: "Flat per-request price in USDC. Applicable to all types."
                        perMTok:
                          type: string
                          description: "Per-million-tokens price in USDC. Inference only."
                        perHour:
                          type: string
                          description: "Per-compute-hour price in USDC. Fine-tuning only."
                        perEpoch:
                          type: string
                          description: "Per-training-epoch price in USDC. Fine-tuning only."
                provenance:
                  type: object
                  description: >-
                    Optional provenance metadata for the service. Tracks how the
                    model or service was produced (e.g. autoresearch experiment data).
                    Included in the ERC-8004 registration document when present.
                  properties:
                    framework:
                      type: string
                      description: "Optimization framework (e.g. autoresearch)."
                    metricName:
                      type: string
                      description: "Name of the primary quality metric (e.g. val_bpb)."
                    metricValue:
                      type: string
                      description: "Primary quality metric value (e.g. 0.9973)."
                    experimentId:
                      type: string
                      description: "Experiment or commit identifier."
                    trainHash:
                      type: string
                      description: "SHA-256 hash of the training code that produced this model."
                    paramCount:
                      type: string
                      description: "Model parameter count (e.g. 50M, 1.3B)."
                path:
                  type: string
                  description: "URL path prefix for the HTTPRoute, defaults to /services/<name>."
                  pattern: "^/[a-zA-Z0-9/_.-]*$"
                registration:
                  type: object
                  description: >-
                    ERC-8004 registration metadata. Field names align with the
                    AgentRegistration document schema (ERC-8004 spec).
                  properties:
                    enabled:
                      type: boolean
                      description: "If true, register on ERC-8004 after routing is live."
                      default: false
                    name:
                      type: string
                      description: "Agent name (ERC-8004: AgentRegistration.name)."
                    description:
                      type: string
                      description: "Agent description (ERC-8004: AgentRegistration.description)."
                    image:
                      type: string
                      description: "Agent icon URL (ERC-8004: AgentRegistration.image)."
                    services:
                      type: array
                      description: "Service endpoints (ERC-8004: AgentRegistration.services[])."
                      items:
                        type: object
                        required:
                          - name
                          - endpoint
                        properties:
                          name:
                            type: string
                            description: "Service type: web, A2A, MCP, OASF, ENS, DID, email."
                          endpoint:
                            type: string
                            description: "Service URL. Auto-filled from tunnel URL if empty."
                          version:
                            type: string
                            description: "Protocol version (SHOULD per ERC-8004 spec)."
                    skills:
                      type: array
                      description: >-
                        OASF skills for discovery (e.g. natural_language_processing/text_generation).
                        Mapped to an OASF service entry in the registration JSON.
                      items:
                        type: string
                    domains:
                      type: array
                      description: >-
                        OASF domains for discovery (e.g. technology/artificial_intelligence).
                        Mapped to an OASF service entry in the registration JSON.
                      items:
                        type: string
                    supportedTrust:
                      type: array
                      description: >-
                        Trust verification methods (ERC-8004: AgentRegistration.supportedTrust[]).
                        Valid values: reputation, crypto-economic, tee-attestation.
                      items:
                        type: string
                    metadata:
                      type: object
                      description: >-
                        Additional registration metadata published into the generated
                        agent-registration.json for discovery and ranking (for example:
                        gpu, framework, best_val_bpb, total_experiments).
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: >-
                    Condition types: ModelReady, UpstreamHealthy, PaymentGateReady,
                    RoutePublished, Registered, Ready.
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        description: "Condition type."
                      status:
                        type: string
                        description: "Status of the condition."
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      reason:
                        type: string
                        description: "Machine-readable reason for the condition."
                      message:
                        type: string
                        description: "Human-readable message with details."
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: "Last time the condition transitioned."
                endpoint:
                  type: string
                  description: "The public endpoint URL once the route is published."
                agentId:
                  type: string
                  description: "ERC-8004 agent NFT token ID after on-chain registration."
                registrationTxHash:
                  type: string
                  description: "Transaction hash of the ERC-8004 registration."
                observedGeneration:
                  type: integer
                  format: int64
                  description: "The generation observed by the controller."
                agentResolution:
                  type: object
                  description: >-
                    Controller's resolved view of an agent-type offer's referenced
                    Agent. Populated only when type=agent and the Agent is Ready.
                  properties:
                    model:
                      type: string
                    skills:
                      type: array
                      items:
                        type: string
                    runtime:
                      type: string
                    endpoint:
                      type: string
