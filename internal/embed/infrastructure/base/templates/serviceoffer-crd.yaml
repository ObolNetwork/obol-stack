{{- if .Values.obolAgent.enabled }}
---
# ServiceOffer CRD
# Defines a compute service the agent can expose, gate with x402, and register on-chain.
# Condition lifecycle: ModelReady -> UpstreamHealthy -> PaymentGateReady -> RoutePublished -> Registered -> Ready
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceoffers.obol.network
spec:
  group: obol.network
  names:
    kind: ServiceOffer
    listKind: ServiceOfferList
    plural: serviceoffers
    singular: serviceoffer
    shortNames:
      - so
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.model.name
        - name: Price
          type: string
          jsonPath: .spec.pricing.amount
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            ServiceOffer declares a compute service that can be exposed publicly,
            gated with x402 payments, and optionally registered on an ERC-8004
            service registry.
          properties:
            spec:
              type: object
              required:
                - upstream
                - pricing
                - wallet
              properties:
                model:
                  type: object
                  description: "LLM model metadata. Required when the upstream serves an LLM."
                  required:
                    - name
                    - runtime
                  properties:
                    name:
                      type: string
                      description: "Model identifier (e.g. llama3.2:3b)."
                    runtime:
                      type: string
                      description: "Runtime serving the model."
                      enum:
                        - ollama
                upstream:
                  type: object
                  description: "In-cluster service that handles the actual workload."
                  required:
                    - service
                    - namespace
                    - port
                  properties:
                    service:
                      type: string
                      description: "Kubernetes Service name."
                    namespace:
                      type: string
                      description: "Namespace of the upstream Service."
                    port:
                      type: integer
                      description: "Port on the upstream Service."
                      default: 11434
                    healthPath:
                      type: string
                      description: "HTTP path used for health probes against the upstream."
                      default: "/api/generate"
                pricing:
                  type: object
                  description: "Payment terms for accessing this service."
                  required:
                    - amount
                    - unit
                    - chain
                  properties:
                    amount:
                      type: string
                      description: "Price per unit (e.g. \"0.50\")."
                    unit:
                      type: string
                      description: "Billing unit."
                      default: "MTok"
                      enum:
                        - MTok
                        - request
                    currency:
                      type: string
                      description: "Payment token symbol."
                      default: "USDC"
                    chain:
                      type: string
                      description: "Chain identifier for payments (e.g. \"base-sepolia\")."
                wallet:
                  type: string
                  description: "Ethereum address that receives payments."
                  pattern: "^0x[0-9a-fA-F]{40}$"
                path:
                  type: string
                  description: "URL path prefix for the HTTPRoute, defaults to /services/<name>."
                register:
                  type: boolean
                  description: "If true, register on ERC-8004 after routing is live."
                  default: false
            status:
              type: object
              properties:
                conditions:
                  type: array
                  description: >-
                    Condition types: ModelReady, UpstreamHealthy, PaymentGateReady,
                    RoutePublished, Registered, Ready.
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        description: "Condition type (ModelReady, UpstreamHealthy, PaymentGateReady, RoutePublished, Registered, Ready)."
                      status:
                        type: string
                        description: "Status of the condition."
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      reason:
                        type: string
                        description: "Machine-readable reason for the condition."
                      message:
                        type: string
                        description: "Human-readable message with details."
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: "Last time the condition transitioned."
                endpoint:
                  type: string
                  description: "The public endpoint URL once the route is published."
                observedGeneration:
                  type: integer
                  format: int64
                  description: "The generation observed by the controller."
{{- end }}
