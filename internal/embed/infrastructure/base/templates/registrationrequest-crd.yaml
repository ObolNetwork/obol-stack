---
# RegistrationRequest CRD
# Isolates ERC-8004 publication and on-chain side effects from the main
# ServiceOffer reconciliation loop. ServiceOffer remains the source of truth.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: registrationrequests.obol.org
spec:
  group: obol.org
  names:
    kind: RegistrationRequest
    listKind: RegistrationRequestList
    plural: registrationrequests
    singular: registrationrequest
    shortNames:
      - rr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Offer
          type: string
          jsonPath: .spec.serviceOfferName
        - name: State
          type: string
          jsonPath: .spec.desiredState
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: AgentID
          type: string
          jsonPath: .status.agentId
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - serviceOfferName
                - serviceOfferNamespace
                - desiredState
              properties:
                serviceOfferName:
                  type: string
                serviceOfferNamespace:
                  type: string
                desiredState:
                  type: string
                  enum:
                    - Active
                    - Tombstoned
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                publishedUrl:
                  type: string
                agentId:
                  type: string
                registrationTxHash:
                  type: string
