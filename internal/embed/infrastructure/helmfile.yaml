# Helmfile for Obol Stack default infrastructure
# Orchestrates core infrastructure components deployed with every stack
# Uses Traefik with Gateway API for routing (replaces nginx-ingress)

repositories:
  - name: traefik
    url: https://traefik.github.io/charts
  - name: obol
    url: https://obolnetwork.github.io/helm-charts/
  - name: ethereum
    url: https://ethpandaops.github.io/ethereum-helm-charts
  - name: bedag
    url: https://bedag.github.io/helm-charts/

# Single source of truth: change this to switch networks
values:
  - network: mainnet

releases:
  # Local storage provisioner (raw manifests wrapped as chart)
  - name: base
    namespace: kube-system
    chart: ./base
    values:
      - dataDir: /data
      - network: "{{ .Values.network }}"

  # Traefik ingress controller with Gateway API support
  - name: traefik
    namespace: traefik
    createNamespace: true
    chart: traefik/traefik
    version: 38.0.2
    values:
      # Gateway API provider configuration
      - providers:
          kubernetesGateway:
            enabled: true
            namespaces: []  # Watch all namespaces
          kubernetesCRD:
            enabled: true
          kubernetesIngress:
            enabled: false  # Disable legacy Ingress support
      # GatewayClass configuration
      - gatewayClass:
          enabled: true
          name: traefik
      # Gateway configuration (main entry point)
      - gateway:
          enabled: true
          name: traefik-gateway
          namespace: traefik
          listeners:
            web:
              port: 8000
              protocol: HTTP
              namespacePolicy:
                from: All
      # Ports configuration
      - ports:
          web:
            port: 8000
            expose:
              default: true
            exposedPort: 80
            protocol: TCP
          websecure:
            port: 8443
            expose:
              default: true
            exposedPort: 443
            protocol: TCP
            tls:
              enabled: false  # TLS termination disabled for local dev
      # Service configuration
      - service:
          type: LoadBalancer
          externalTrafficPolicy: Local
      # Resource limits
      - resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      # Disable dashboard by default
      - ingressRoute:
          dashboard:
            enabled: false

  # eRPC
  - name: erpc
    namespace: erpc
    createNamespace: true
    chart: ethereum/erpc
    needs:
      - kube-system/base
      - traefik/traefik
    values:
      - ./values/erpc.yaml.gotmpl

  # eRPC HTTPRoute
  - name: erpc-httproute
    namespace: erpc
    chart: bedag/raw
    needs:
      - traefik/traefik
      - erpc/erpc
    values:
      - resources:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: erpc
              namespace: erpc
            spec:
              parentRefs:
                - name: traefik-gateway
                  namespace: traefik
                  sectionName: web
              hostnames:
                - obol.stack
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /rpc
                  backendRefs:
                    - name: erpc
                      port: 4000

  # Obol Stack frontend
  - name: obol-frontend
    namespace: obol-frontend
    createNamespace: true
    chart: obol/obol-app
    version: 0.1.0
    needs:
      - traefik/traefik
      - erpc/erpc
    values:
      - ./values/obol-frontend.yaml.gotmpl

  # Obol Frontend HTTPRoute
  - name: obol-frontend-httproute
    namespace: obol-frontend
    chart: bedag/raw
    needs:
      - traefik/traefik
      - obol-frontend/obol-frontend
    values:
      - resources:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: obol-frontend
              namespace: obol-frontend
            spec:
              parentRefs:
                - name: traefik-gateway
                  namespace: traefik
                  sectionName: web
              hostnames:
                - obol.stack
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - name: obol-frontend
                      port: 3000
