# Helmfile for Obol Stack default infrastructure
# Orchestrates core infrastructure components deployed with every stack
# Uses Traefik with Gateway API for routing (replaces nginx-ingress)

repositories:
  - name: traefik
    url: https://traefik.github.io/charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: obol
    url: https://obolnetwork.github.io/helm-charts/
  - name: ethereum
    url: https://ethpandaops.github.io/ethereum-helm-charts
  - name: bedag
    url: https://bedag.github.io/helm-charts/
  - name: stakater
    url: https://stakater.github.io/stakater-charts

# Single source of truth: change this to switch networks
values:
  - network: mainnet
  - gatewayApiVersion: v1.4.1
  # Default the cloudflared release to enabled. `obol stack up` overrides via
  # `--state-values-set cloudflared.enabled=false` when it detects a running
  # quick tunnel that should be preserved across the sync.
  - cloudflared:
      enabled: true

releases:
  # Local storage provisioner (raw manifests wrapped as chart)
  - name: base
    namespace: kube-system
    chart: ./base
    values:
      - dataDir: /data
      - network: "{{ .Values.network }}"

  # Monitoring stack (Prometheus operator + Prometheus)
  - name: monitoring
    namespace: monitoring
    createNamespace: true
    chart: prometheus-community/kube-prometheus-stack
    version: 82.2.1
    values:
      - ./values/monitoring.yaml.gotmpl

  # NOTE: PodMonitor for litellm-x402-buyer and ServiceMonitor for
  # x402-verifier moved into base/templates/llm.yaml and
  # base/templates/x402.yaml respectively. They live alongside the
  # workloads they observe so a port/selector edit is one-file. Kills
  # two `bedag/raw` releases. kube-prometheus-stack picks them up via
  # the `release: monitoring` label.

  # Traefik ingress controller with Gateway API support
  # Traefik v38+ bundles Gateway API CRDs in its crds/ directory
  - name: traefik
    namespace: traefik
    createNamespace: true
    chart: traefik/traefik
    version: 38.0.2
    values:
      # Gateway API provider configuration
      - providers:
          kubernetesGateway:
            enabled: true
            namespaces: []  # Watch all namespaces
          kubernetesCRD:
            enabled: true
          kubernetesIngress:
            enabled: false  # Disable legacy Ingress support
      # GatewayClass configuration
      - gatewayClass:
          enabled: true
          name: traefik
      # Gateway configuration (main entry point)
      - gateway:
          enabled: true
          name: traefik-gateway
          namespace: traefik
          listeners:
            web:
              port: 8000
              protocol: HTTP
              namespacePolicy:
                from: All
      # Ports configuration
      - ports:
          web:
            port: 8000
            expose:
              default: true
            exposedPort: 80
            protocol: TCP
          websecure:
            port: 8443
            expose:
              default: true
            exposedPort: 443
            protocol: TCP
            tls:
              enabled: false  # TLS termination disabled for local dev
      # Service configuration
      - service:
          type: LoadBalancer
          externalTrafficPolicy: Local
      # Resource limits
      - resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      # Disable dashboard by default
      - ingressRoute:
          dashboard:
            enabled: false

  # Cloudflare Tunnel (dormant until configured via obol tunnel login/provision).
  # `condition: cloudflared.enabled` lets `obol stack up` flip this off when an
  # active quick tunnel is already serving — re-syncing the chart kills the
  # running pod (chart renders replicas: 0 in quick-tunnel mode), and that
  # invalidates the *.trycloudflare.com URL anyone bookmarked. Default true so
  # fresh installs and `helmfile sync` outside of stack-up keep working.
  - name: cloudflared
    namespace: traefik
    chart: ./cloudflared
    condition: cloudflared.enabled
    needs:
      - traefik/traefik

  # Stakater Reloader (restarts workloads on Secret/ConfigMap change)
  - name: reloader
    namespace: reloader
    createNamespace: true
    chart: stakater/reloader
    version: 2.2.7

  # eRPC
  - name: erpc
    namespace: erpc
    createNamespace: true
    chart: ethereum/erpc
    version: 0.0.4
    needs:
      - kube-system/base
      - traefik/traefik
    values:
      - ./values/erpc.yaml.gotmpl
    # The chart exposes port 4000 (container) via Service port 4000.
    # In-cluster callers use erpc.erpc.svc.cluster.local:4000.

  # eRPC HTTPRoute
  - name: erpc-httproute
    namespace: erpc
    chart: bedag/raw
    version: 2.0.2
    needs:
      - traefik/traefik
      - erpc/erpc
    values:
      - resources:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: erpc
              namespace: erpc
            spec:
              hostnames:
                - "obol.stack"
              parentRefs:
                - name: traefik-gateway
                  namespace: traefik
                  sectionName: web
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /rpc
                  filters:
                    - type: ExtensionRef
                      extensionRef:
                        group: traefik.io
                        kind: Middleware
                        name: x402-payment
                  backendRefs:
                    - name: erpc
                      port: 80

  # x402 Middleware for eRPC namespace (ForwardAuth -> central verifier).
  # Always deployed; the verifier returns 200 for routes with no pricing rules.
  - name: erpc-x402-middleware
    namespace: erpc
    chart: bedag/raw
    version: 2.0.2
    needs:
      - traefik/traefik
    values:
      - resources:
          - apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: x402-payment
              namespace: erpc
            spec:
              forwardAuth:
                address: http://x402-verifier.x402.svc.cluster.local:8080/verify
                authResponseHeaders:
                  - X-Payment-Response

  # eRPC metadata ConfigMap for frontend discovery
  - name: erpc-metadata
    namespace: erpc
    chart: bedag/raw
    needs:
      - erpc/erpc
    values:
      - ./values/erpc-metadata.yaml.gotmpl

  # Obol Stack frontend
  - name: obol-frontend
    namespace: obol-frontend
    createNamespace: true
    chart: obol/obol-app
    version: 0.1.1
    needs:
      - traefik/traefik
      - erpc/erpc
    values:
      - ./values/obol-frontend.yaml.gotmpl

  # Obol Frontend HTTPRoute
  - name: obol-frontend-httproute
    namespace: obol-frontend
    chart: bedag/raw
    version: 2.0.2
    needs:
      - traefik/traefik
      - obol-frontend/obol-frontend
    values:
      - resources:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: obol-frontend
              namespace: obol-frontend
            spec:
              hostnames:
                - "obol.stack"
              parentRefs:
                - name: traefik-gateway
                  namespace: traefik
                  sectionName: web
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - name: obol-frontend-obol-app
                      port: 3000

  # NOTE: obol-frontend-rbac ClusterRole + ClusterRoleBinding moved into
  # base/templates/obol-frontend-rbac.yaml. Co-located with the workload
  # they grant; kills a `bedag/raw` release. Frontend-egress NetworkPolicy
  # was attempted and reverted — on k3s + Flannel (k3d's default CNI) the
  # kubernetes apiserver Service Endpoints point at the host process,
  # outside the cluster pod/service CIDRs. A clean allowlist can't target
  # the apiserver portably without an install-specific ipBlock for the k3s
  # host IP. Tracking as a deferred hardening item.
