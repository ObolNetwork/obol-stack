# Helmfile for Obol Stack default infrastructure
# Orchestrates core infrastructure components deployed with every stack

repositories:
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: obol
    url: https://obolnetwork.github.io/helm-charts/
  - name: ethereum
    url: https://ethpandaops.github.io/ethereum-helm-charts

# Single source of truth: change this to switch networks
values:
  - network: mainnet 

releases:
  # Local storage provisioner (raw manifests wrapped as chart)
  - name: base
    namespace: kube-system
    chart: ./base
    values:
      - dataDir: /data
      - network: "{{ .Values.network }}"

  # Nginx ingress controller (upstream chart)
  - name: ingress-nginx
    namespace: ingress-nginx
    chart: ingress-nginx/ingress-nginx
    version: 4.13.3
    values:
      - controller:
          replicaCount: 1
          service:
            type: LoadBalancer
            externalTrafficPolicy: Local
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          tolerations: []
          admissionWebhooks:
            enabled: false

  # eRPC
  - name: erpc
    namespace: erpc
    chart: ethereum/erpc
    needs:
      - kube-system/base
      - ingress-nginx/ingress-nginx
    values:
      - ./values/erpc.yaml.gotmpl

  # Obol Stack frontend
  - name: obol-frontend
    namespace: obol-frontend
    chart: obol/obol-app
    version: 0.1.0
    needs:
      - ingress-nginx/ingress-nginx
      - erpc/erpc
    values:
      - ./values/obol-frontend.yaml.gotmpl
