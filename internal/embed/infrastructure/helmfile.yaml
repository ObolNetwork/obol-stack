# Helmfile for Obol Stack default infrastructure
# Orchestrates core infrastructure components deployed with every stack
# Uses Traefik with Gateway API for routing (replaces nginx-ingress)

repositories:
  - name: traefik
    url: https://traefik.github.io/charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: obol
    url: https://obolnetwork.github.io/helm-charts/
  - name: ethereum
    url: https://ethpandaops.github.io/ethereum-helm-charts
  - name: bedag
    url: https://bedag.github.io/helm-charts/
  - name: stakater
    url: https://stakater.github.io/stakater-charts

# Single source of truth: change this to switch networks
values:
  - network: mainnet
  - gatewayApiVersion: v1.4.1

releases:
  # Local storage provisioner (raw manifests wrapped as chart)
  - name: base
    namespace: kube-system
    chart: ./base
    values:
      - dataDir: /data
      - network: "{{ .Values.network }}"

  # Monitoring stack (Prometheus operator + Prometheus)
  - name: monitoring
    namespace: monitoring
    createNamespace: true
    chart: prometheus-community/kube-prometheus-stack
    version: 82.2.1
    values:
      - ./values/monitoring.yaml.gotmpl

  # Traefik ingress controller with Gateway API support
  # Traefik v38+ bundles Gateway API CRDs in its crds/ directory
  - name: traefik
    namespace: traefik
    createNamespace: true
    chart: traefik/traefik
    version: 38.0.2
    values:
      # Gateway API provider configuration
      - providers:
          kubernetesGateway:
            enabled: true
            namespaces: []  # Watch all namespaces
          kubernetesCRD:
            enabled: true
          kubernetesIngress:
            enabled: false  # Disable legacy Ingress support
      # GatewayClass configuration
      - gatewayClass:
          enabled: true
          name: traefik
      # Gateway configuration (main entry point)
      - gateway:
          enabled: true
          name: traefik-gateway
          namespace: traefik
          listeners:
            web:
              port: 8000
              protocol: HTTP
              namespacePolicy:
                from: All
      # Ports configuration
      - ports:
          web:
            port: 8000
            expose:
              default: true
            exposedPort: 80
            protocol: TCP
          websecure:
            port: 8443
            expose:
              default: true
            exposedPort: 443
            protocol: TCP
            tls:
              enabled: false  # TLS termination disabled for local dev
      # Service configuration
      - service:
          type: LoadBalancer
          externalTrafficPolicy: Local
      # Resource limits
      - resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      # Disable dashboard by default
      - ingressRoute:
          dashboard:
            enabled: false

  # Cloudflare Tunnel (quick tunnel mode for public access)
  - name: cloudflared
    namespace: traefik
    chart: ./cloudflared
    needs:
      - traefik/traefik

  # Stakater Reloader (restarts workloads on Secret/ConfigMap change)
  - name: reloader
    namespace: reloader
    createNamespace: true
    chart: stakater/reloader
    version: 2.2.7

  # eRPC
  - name: erpc
    namespace: erpc
    createNamespace: true
    chart: ethereum/erpc
    version: 0.0.4
    needs:
      - kube-system/base
      - traefik/traefik
    values:
      - ./values/erpc.yaml.gotmpl

  # eRPC HTTPRoute
  - name: erpc-httproute
    namespace: erpc
    chart: bedag/raw
    version: 2.0.2
    needs:
      - traefik/traefik
      - erpc/erpc
    values:
      - resources:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: erpc
              namespace: erpc
            spec:
              parentRefs:
                - name: traefik-gateway
                  namespace: traefik
                  sectionName: web
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /rpc
                  filters:
                    - type: ExtensionRef
                      extensionRef:
                        group: traefik.io
                        kind: Middleware
                        name: x402-payment
                  backendRefs:
                    - name: erpc
                      port: 4000

  # x402 Middleware for eRPC namespace (ForwardAuth -> central verifier).
  # Always deployed; the verifier returns 200 for routes with no pricing rules.
  - name: erpc-x402-middleware
    namespace: erpc
    chart: bedag/raw
    version: 2.0.2
    needs:
      - traefik/traefik
    values:
      - resources:
          - apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: x402-payment
              namespace: erpc
            spec:
              forwardAuth:
                address: http://x402-verifier.x402.svc.cluster.local:8080/verify
                authResponseHeaders:
                  - X-Payment-Response

  # eRPC metadata ConfigMap for frontend discovery
  - name: erpc-metadata
    namespace: erpc
    chart: bedag/raw
    needs:
      - erpc/erpc
    values:
      - ./values/erpc-metadata.yaml.gotmpl

  # Obol Stack frontend
  - name: obol-frontend
    namespace: obol-frontend
    createNamespace: true
    chart: obol/obol-app
    version: 0.1.1
    needs:
      - traefik/traefik
      - erpc/erpc
    values:
      - ./values/obol-frontend.yaml.gotmpl

  # Obol Frontend HTTPRoute
  - name: obol-frontend-httproute
    namespace: obol-frontend
    chart: bedag/raw
    version: 2.0.2
    needs:
      - traefik/traefik
      - obol-frontend/obol-frontend
    values:
      - resources:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: obol-frontend
              namespace: obol-frontend
            spec:
              parentRefs:
                - name: traefik-gateway
                  namespace: traefik
                  sectionName: web
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - name: obol-frontend-obol-app
                      port: 3000

  # Obol Frontend RBAC (OpenClaw instance discovery via Kubernetes API)
  - name: obol-frontend-rbac
    namespace: obol-frontend
    chart: bedag/raw
    version: 2.0.2
    needs:
      - obol-frontend/obol-frontend
    values:
      - resources:
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: obol-frontend-openclaw-discovery
              labels:
                app.kubernetes.io/name: obol-frontend
            rules:
              - apiGroups: [""]
                resources: ["namespaces"]
                verbs: ["get", "list"]
              - apiGroups: [""]
                resources: ["pods", "configmaps", "secrets"]
                verbs: ["get", "list"]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: obol-frontend-openclaw-discovery
              labels:
                app.kubernetes.io/name: obol-frontend
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: obol-frontend-openclaw-discovery
            subjects:
              - kind: ServiceAccount
                name: obol-frontend
                namespace: obol-frontend
