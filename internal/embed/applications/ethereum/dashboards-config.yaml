# Dashboard provisioner configuration
# This chart deploys a Job that downloads Ethereum client dashboards from Grafana.com
# and creates ConfigMaps that are auto-discovered by the monitoring stack

# The dashboards are defined in charts/dashboard-provisioner/templates/dashboards.yaml
# Modify the DASHBOARDS array in that file to add/remove dashboards

