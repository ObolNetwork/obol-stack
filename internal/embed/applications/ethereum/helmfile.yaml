repositories:
  - name: ethereum-helm-charts
    url: https://ethpandaops.github.io/ethereum-helm-charts

releases:
  # Main ethereum node (execution + consensus clients)
  - name: ethereum-node
    namespace: ethereum
    createNamespace: true
    chart: ethereum-helm-charts/ethereum-node
    version: 0.2.4
    values:
      - values.yaml

  # Dashboard provisioner (downloads and creates Grafana dashboards)
  - name: dashboard-provisioner
    namespace: ethereum
    chart: ./charts/dashboard-provisioner
    values:
      - dashboards-config.yaml
