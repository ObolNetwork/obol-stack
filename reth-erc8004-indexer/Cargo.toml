[package]
name = "reth-erc8004-indexer"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "reth"
path = "src/main.rs"

[dependencies]
alloy-primitives = { version = "1.5.6", features = ["serde"] }
alloy-sol-types = "1.3.1"
axum = { version = "0.8.6", features = ["json"] }
base64 = "0.22.1"
clap = { version = "4.5.39", features = ["derive"] }
eyre = "0.6.12"
futures = "0.3.31"
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls"] }
reth = { git = "https://github.com/paradigmxyz/reth", tag = "v1.11.1" }
reth-ethereum-cli = { git = "https://github.com/paradigmxyz/reth", tag = "v1.11.1" }
reth-execution-types = { git = "https://github.com/paradigmxyz/reth", tag = "v1.11.1" }
reth-exex = { git = "https://github.com/paradigmxyz/reth", tag = "v1.11.1", features = ["serde"] }
reth-node-api = { git = "https://github.com/paradigmxyz/reth", tag = "v1.11.1" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v1.11.1" }
reth-provider = { git = "https://github.com/paradigmxyz/reth", tag = "v1.11.1" }
reth-tracing = { git = "https://github.com/paradigmxyz/reth", tag = "v1.11.1" }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
time = { version = "0.3.41", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.47.1", features = ["full"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.20.0"
tower = { version = "0.5.2", features = ["util"] }
