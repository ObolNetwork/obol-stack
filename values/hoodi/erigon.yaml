# Hoodi network override values for Erigon
# This file should be used with -f mainnet/erigon.yaml -f hoodi/erigon.yaml

# -- Extra args for the erigon container
extraArgs:
  - --chain=holesky
# -- Extra args for the rpcdaemon container
extraArgsRPCDaemon:
  - --http.api=eth,erigon,web3,net,txpool,engine,trace

# Increase probe delays for initial sync
livenessProbe:
  tcpSocket:
    port: metrics
  initialDelaySeconds: 900
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  tcpSocket:
    port: metrics
  initialDelaySeconds: 30
  periodSeconds: 30
  failureThreshold: 30

# Enable persistence with appropriate size for testnet
persistence:
  enabled: true
  size: 350Gi