# Example values file for deploying Helios on Holesky Testnet
# Replace the execution RPC placeholder with your actual endpoint

# Helios specific configuration
helios:
  # Network to sync to
  network: "sepolia"
  
  # REQUIRED: Add your execution RPC endpoint (must support eth_getProof)
  # Example using AllthatNode (replace with your provider)
  executionRpc: "https://sepolia.drpc.org"

  # Use Nimbus Sepolia testing endpoint for light client API
  # TODO: Switch to local after Nimbus completes a full sync committee period
  consensusRpc: "http://unstable.sepolia.beacon-api.nimbus.team"
  
  # Example checkpoint
  checkpoint: ""
  strictCheckpointAge: false

  # Trusted URL to retrieve a checkpoint sync to begin the light client from
  # Using healthy checkpoint sync endpoint from ethpandaops
  fallback: "https://sepolia.beaconstate.info"
  loadExternalFallback: true
  
  # Bind to 0.0.0.0 to allow connections from outside the pod
  rpcBindIp: "0.0.0.0"
  
  # Data directory for cached checkpoints
  dataDir: "/data"

image:
  repository: obolnetwork/helios
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  #tag: "e10e753"

# Configure service to be accessible
service:
  type: ClusterIP
  port: 8545

# Resource allocation - lower for testnet
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Enable persistent storage for checkpoint data
persistence:
  enabled: true
  size: 500Mi
