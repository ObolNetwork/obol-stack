# -- Image to use for the container
image:
  # -- Image repository
  repository: aztecprotocol/aztec
  # -- Image tag
  tag: 2.0.3
  # -- Container pull policy
  pullPolicy: IfNotPresent

network: alpha-testnet

# Use host network for P2P connectivity (port 40400)
hostNetwork: true

node:
  replicas: 1
  logLevel: "debug; info: aztec:simulator, json-rpc"

  l1ExecutionUrls: ["http://l1-full-node-sepolia-execution.l1.svc.cluster.local:8545"]
  l1ConsensusUrls: ["http://l1-full-node-sepolia-beacon.l1.svc.cluster.local:5052"]

  startCmd:
    - --node
    - --archiver
    - --sequencer
    - --network testnet


  startupProbe:
    # -- Period seconds
    periodSeconds: 60
    # -- Failure threshold
    failureThreshold: 60

persistence:
  enabled: true
  size: 512Gi
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  selector: {}

# Pin to specific node for local-path storage
nodeSelector:
  kubernetes.io/hostname: silverfib

service:
  p2p:
    enabled: true
    nodePortEnabled: false
    port: 40400
    announcePort: 40400
  admin:
    enabled: true
    port: 8082
  httpPort: 8080