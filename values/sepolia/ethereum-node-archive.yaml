# Sepolia Archive Node Configuration
# Required for Aztec and other L2s that need historical L1 data

global:
  main:
    network: sepolia

nethermind:
  enabled: true
  extraArgs:
    - --config=sepolia
    - --Sync.AncientBodiesBarrier=9200000
    - --Sync.AncientReceiptsBarrier=9200000
    - --Pruning.Mode=None
  persistence:
    enabled: true
    # Partial archive from block ~9.2M (for Aztec support)
    # Aztec requires L1 data from block 9,222,769 onwards (based on snapshot)
    # Setting barrier to 9.2M provides buffer for earlier block access
    # Much smaller than full archive: ~500GB-800GB vs ~2TB
    size: 1000Gi
    storageClassName: local-path
  nodeSelector:
    kubernetes.io/hostname: silverfib

nimbus:
  enabled: true
  extraArgs:
    - --light-client-data-serve=true  # Enable light client server (default: true)
    - --light-client-data-import-mode=only-new  # Import new light client data incrementally
    - --el=http://l1-full-node-sepolia-execution:8551  # Connect to execution layer (Nethermind)
  persistence:
    enabled: true
    size: 500Gi
    storageClassName: local-path
  nodeSelector:
    kubernetes.io/hostname: silvernuc3
