# -- Overrides the chart's name
nameOverride: ""

# -- Overrides the chart's computed fullname
fullnameOverride: "rpc"

# -- Number of replicas
replicas: 1

image:
  # -- erpc container image repository
  repository: ghcr.io/erpc/erpc
  # -- erpc container image tag
  tag: 0.0.50
  # -- erpc container pull policy
  pullPolicy: IfNotPresent

# -- Config file
# @default -- See `values.yaml`
config: |
    logLevel: debug

    database:
      evmJsonRpcCache:
        connectors:
          - id: memory-cache
            driver: memory
            memory:
              maxItems: 10000
        policies:
          - network: "*"
            method: "*"
            finality: unfinalized
            connector: memory-cache
            ttl: 10s

    server:
      httpHostV4: "0.0.0.0"
      listenV6: true
      httpHostV6: "[::]"
      httpPort: {{ .Values.httpPort }}

    metrics:
      enabled: true
      hostV4: "0.0.0.0"
      hostV6: "[::]"
      port: {{ .Values.metricsPort }}

    projects:
      - id: rpc
        networks:
          - architecture: evm
            evm:
              chainId: 1
            alias: mainnet
            failsafe:
              timeout:
                duration: 60s
              retry:
                maxAttempts: 3
                delay: 0ms
              # Defining a "hedge" is highly-recommended on network-level because if upstream A is being slow for
              # a specific request, it can start a new parallel hedged request to upstream B, for whichever responds faster.
              hedge:
                delay: 500ms
                maxCount: 1
          - architecture: evm
            evm:
              chainId: 560048
            alias: hoodi
            failsafe:
              timeout:
                duration: 30s
              retry:
                maxAttempts: 3
                delay: 0ms
              hedge:
                delay: 500ms
                maxCount: 1
        upstreams:
          - endpoint: http://l1-light-client-helios-mainnet.l1.svc.cluster.local:8545
            id: helios-mainnet
            evm:
              chainId: 1
          - endpoint: http://l1-light-client-helios-hoodi.l1.svc.cluster.local:8545
            id: helios-hoodi
            evm:
              chainId: 560048
          - endpoint: http://l1-light-client-helios-sepolia.l1.svc.cluster.local:8545
            id: helios-sepolia
            evm:
              chainId: 11155111
          - endpoint: http://l1-full-node-execution.l1.svc.cluster.local:8545
            id: l1-full-node
        cors:
          # List of allowed origins.
          # This allows any dApp in your browser to call the RPC.
          allowedOrigins:
            - "*"
          # HTTP methods allowed for CORS requests
          allowedMethods:
            - "GET"
            - "POST"
            - "PUT"
            - "DELETE"
            - "OPTIONS"
          # Headers allowed in actual requests
          allowedHeaders:
            - "*"
          # Headers exposed to the browser
          exposedHeaders:
            - "X-Request-ID"
          # Whether the browser should include credentials with requests
          allowCredentials: true
          # How long (in seconds) browsers should cache preflight request results
          maxAge: 3600

# -- Secret env variables injected via a created secret
# These env variables can be used to populate the erpc config file with sensitive data such as RPC API keys
secretEnv:
  ALCHEMY_API_KEY: XXXXXXXXXX

# - HTTP port for erpc
httpPort: 80

# - Metrics port for erpc
metricsPort: 4001

# -- Extra args for the erpc container
extraArgs: []

# -- Command replacement for the erpc container
customCommand: []

ingress:
  # -- Ingress resource for the HTTP API
  enabled: false
  # -- Annotations for Ingress
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress host
  hosts:
    - host: obol.stack
      paths: []
  # -- Ingress TLS
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

service:
  # -- Service type
  type: ClusterIP

# -- Affinity configuration for pods
affinity: {}

# -- Image pull secrets for Docker images
imagePullSecrets: []

# -- Annotations for the StatefulSet
annotations: {}

# -- Liveness probe
# @default -- See `values.yaml`
livenessProbe:
  httpGet:
    path: /healthcheck
    port: http
  initialDelaySeconds: 60
  periodSeconds: 120

# -- Readiness probe
# @default -- See `values.yaml`
readinessProbe:
  httpGet:
    path: /healthcheck
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

# -- Node selector for pods
nodeSelector: {}

# -- Pod labels
podLabels: {}

# -- Pod annotations
podAnnotations: {}

# -- Pod management policy
podManagementPolicy: OrderedReady

# -- Pod priority class
priorityClassName: null

# -- Resource requests and limits
resources: {}
# limits:
#   cpu: 500m
#   memory: 2Gi
# requests:
#   cpu: 300m
#   memory: 1Gi

# -- The security context for pods
# @default -- See `values.yaml`
securityContext:
  fsGroup: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001

# -- The security context for containers
# @default -- See `values.yaml`
containerSecurityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- How long to wait until the pod is forcefully terminated
terminationGracePeriodSeconds: 30

# -- Tolerations for pods
## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

# -- Topology Spread Constraints for pods
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
topologySpreadConstraints: []

# -- Define the PodDisruptionBudget spec
# If not set then a PodDisruptionBudget will not be created
podDisruptionBudget: {}
# minAvailable: 1
# maxUnavailable: 1

# -- Update strategy for the Statefulset
updateStrategy:
  # -- Update strategy type
  type: RollingUpdate

# -- Additional init containers
initContainers: []
# - name: my-init-container
#   image: busybox:latest
#   command: ['sh', '-c', 'echo hello']

# -- Additional containers
extraContainers: []

# -- Additional volumes
extraVolumes: []

# -- Additional volume mounts
extraVolumeMounts: []

# -- Additional ports. Useful when using extraContainers
extraPorts: []

# -- Additional env variables
extraEnv: []

persistence:
  # -- Uses an EmptyDir when not enabled
  enabled: false
  # -- Use an existing PVC when persistence.enabled
  existingClaim: null
  # -- Access mode for the volume claim template
  accessModes:
  - ReadWriteOnce
  # -- Requested size for volume claim template
  size: 1Gi
  # -- Use a specific storage class
  # E.g 'local-path' for local storage to achieve best performance
  # Read more (https://github.com/rancher/local-path-provisioner)
  storageClassName: null
  # -- Annotations for volume claim template
  annotations: {}
  # -- Selector for volume claim template
  selector: {}
  #   matchLabels:
  #     app.kubernetes.io/name: something

serviceMonitor:
  # -- If true, a ServiceMonitor CRD is created for a prometheus operator
  # https://github.com/coreos/prometheus-operator
  enabled: false
  # -- Path to scrape
  path: /metrics
  # -- Alternative namespace for ServiceMonitor
  namespace: null
  # -- Additional ServiceMonitor labels
  labels: {}
  # -- Additional ServiceMonitor annotations
  annotations: {}
  # -- ServiceMonitor scrape interval
  interval: 1m
  # -- ServiceMonitor scheme
  scheme: http
  # -- ServiceMonitor TLS configuration
  tlsConfig: {}
  # -- ServiceMonitor scrape timeout
  scrapeTimeout: 30s
  # -- ServiceMonitor relabelings
  relabelings: []