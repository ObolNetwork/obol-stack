steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-east4-docker.pkg.dev/$PROJECT_ID/obol-agent/obol-agent-ag-ui:$SHORT_SHA'
      - '-t'
      - 'us-east4-docker.pkg.dev/$PROJECT_ID/obol-agent/obol-agent-ag-ui:latest'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-east4-docker.pkg.dev/$PROJECT_ID/obol-agent/obol-agent-ag-ui'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'obol-agent-ag-ui'
      - '--image'
      - 'us-east4-docker.pkg.dev/$PROJECT_ID/obol-agent/obol-agent-ag-ui:$SHORT_SHA'
      - '--region'
      - 'us-east4'
      - '--platform'
      - 'managed'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8000'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--service-account'
      - 'obol-agent-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-secrets'
      - 'GOOGLE_API_KEY=google-api-key:latest'
      - '--set-env-vars'
      - 'PUBLIC_MODE=true'
      - '--allow-unauthenticated'

images:
  - 'us-east4-docker.pkg.dev/$PROJECT_ID/obol-agent/obol-agent-ag-ui:$SHORT_SHA'
  - 'us-east4-docker.pkg.dev/$PROJECT_ID/obol-agent/obol-agent-ag-ui:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
