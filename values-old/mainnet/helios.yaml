# Example values file for deploying Helios on Ethereum Mainnet

# Helios specific configuration
helios:
  # Network to sync to
  network: "mainnet"

  # Trusted URL to retrieve a checkpoint sync to begin the light client from
  #fallback: "https://mainnet.checkpoint.sigp.io"
  loadExternalFallback: true
  strictCheckpointAge: true
  
  # REQUIRED: Execution RPC endpoint (must support eth_getProof)
  executionRpc: "https://eth.drpc.org"

  # No need for consensus RPC or checkpoint when using drpc
  #consensusRpc: "https://ethereum-beacon-api.publicnode.com"
  checkpoint: ""
  
  # Bind to 0.0.0.0 to allow connections from outside the pod
  rpcBindIp: "0.0.0.0"
  
  # Data directory for cached checkpoints
  dataDir: "/data"

image:
  repository: obolnetwork/helios
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  #tag: "e10e753"

# Configure service to be accessible
service:
  type: ClusterIP
  port: 8545

# Resource allocation
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Enable persistent storage for checkpoint data
persistence:
  enabled: true
  size: 1Gi
