## Default values for otterscan
## This is a YAML-formatted file.
## Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: otterscan/otterscan
  pullPolicy: IfNotPresent
  tag: "latest" # Overrides the image tag whose default is the chart appVersion.

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: otterscan.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: otterscan-tls
  #    hosts:
  #      - otterscan.local

resources: 
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

persistence:
  enabled: true
  useVolumeClaimTemplates: true # Use volumeClaimTemplates for StatefulSet
  # Bind to PVC created earlier, or leave empty to dynamically provision a PV
  existingClaim: ""
  # storageClass: "-"
  accessMode: ReadWriteOnce
  size: 10Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Otterscan-specific configuration
otterscan:
  # Ethereum JSON-RPC URL to connect to
  ethereumRpcUrl: "http://helios:8545"
  # Interface to bind the server to
  host: "0.0.0.0"
  # Port to listen on
  port: 3000
  # Enables indexer (requires Erigon with additional APIs enabled)
  enableIndexer: false
  # Number of confirmations required to show a transaction/block as confirmed
  minConfirmations: 10
  # Enable debug logs
  debug: false
  # Base path for serving the app (e.g. if behind a proxy with path prefix)
  basePath: "/"
  # Transaction trace timeout in seconds
  tracerTimeout: 60
  # Number of blocks to search when searching for regular transactions
  maxBlocksToSearchTransactions: 100000
  # Number of blocks to search when searching for internal transactions (if indexer is enabled)
  maxBlocksToSearchInternalTransactions: 1000000
  # Number of blocks to search when searching for contracts
  maxBlocksToSearchContracts: 1000000
  # Use Erigon v2 API
  useErigonV2: false
