apiVersion: apps/v1
kind: Deployment
metadata:
  name: mev-boost
  namespace: l1
  labels:
    app: mev-boost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mev-boost
  template:
    metadata:
      labels:
        app: mev-boost
    spec:
      containers:
      - name: mev-boost
        image: flashbots/mev-boost:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 18550
          name: mev-boost
        - containerPort: 9090
          name: metrics
        env:
        - name: NETWORK
          valueFrom:
            configMapKeyRef:
              name: mev-boost-config
              key: network
        - name: RELAYS
          valueFrom:
            configMapKeyRef:
              name: mev-boost-config
              key: relays
        command:
        - /app/mev-boost
        args:
        - -addr
        - "0.0.0.0:18550"
        - -relay-check
        - -relays
        - "$(RELAYS)"
        - -min-bid
        - "0.05"
        - -request-timeout
        - "12s"
        - -metrics
        - -metrics-addr
        - "0.0.0.0:9090"
        livenessProbe:
          httpGet:
            path: /eth/v1/builder/status
            port: 18550
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /eth/v1/builder/status
            port: 18550
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/os: linux