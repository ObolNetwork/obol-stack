apiVersion: v1
kind: Service
metadata:
  name: mev-boost
  namespace: l1
  labels:
    app: mev-boost
spec:
  type: ClusterIP
  ports:
  - port: 18550
    targetPort: 18550
    protocol: TCP
    name: mev-boost
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: mev-boost